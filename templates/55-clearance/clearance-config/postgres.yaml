# Clearance's durable store and evidence sink (the core's internal/store/pg; before R-4, clearance.pg): one CloudNativePG cluster, one instance, owned by this
# Application. CNPG creates the `clearance` database and owner and writes the connection URI to the Secret
# clearance-pg-app (key `uri`), which the core reads as CLEARANCE_DSN; no credential is written by hand.
# Evidence is retention-bound data: the volume outlives a pod restart, not a cluster rebuild. No object store backs
# CloudNativePG here, so backup.yaml (clearance.backup.enabled) dumps the database nightly onto a volume beside it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: clearance-pg
  namespace: @@CLEARANCE_NAMESPACE@@
  labels:
    hangar.io/component: clearance
    hangar.io/subcomponent: clearance
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The evidence chain lives here: never pruned or deleted with an Application (it moved from autopilot-clearance
    # to clearance-config at R-7; an Application move must never take the data with it).
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: clearance
      owner: clearance
  # clearance-api's read-only role (reader-credentials.yaml): it may read every table and write none.
  managed:
    roles:
      - name: clearance_reader
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret: {name: clearance-pg-reader}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
