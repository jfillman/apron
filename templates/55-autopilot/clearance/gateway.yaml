# The gateway: autopilot-gateway (autopilot repo, Dockerfile), which is Clearance at its pinned release with
# Autopilot's Hangar backends (README "Running the gateway"). One replica: the store is single-writer and clearance.pg
# refuses a second writer. Run pods find it by the label and port function-agentrun's egress allows.
#
# Backends wired here: AgentRuns (Role in agentrun-grants), Airframe and Argo CD Application reads (identity.yaml),
# glidepath-api (its delegates/readers/operators/releasers list this identity), Thanos Query and Loki (no credential).
# Losing Postgres ends the process (exit 70) and the kubelet restarts it; it starts again once the database answers.
# Callers authenticate with a service-account token for the `clearance` audience, or (people) an ID token from
# people-dex (55-autopilot/people-dex, GitHub sign-in, autopilot.people only). The SA token mounted here (API server audience)
# is what Clearance uses for TokenReview, the Airframe reads, AgentRuns and glidepath-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearance
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: clearance}
  template:
    metadata:
      labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
    spec:
      serviceAccountName: clearance
      automountServiceAccountToken: true
      enableServiceLinks: false
#@if tower.hostAliasIP
      # Tower's hostname has no DNS in the lab (tower.hostAliasIP, as Glidepath's tasks use).
      hostAliases:
        - ip: "@@TOWER_HOST_ALIAS_IP@@"
          hostnames: ["backstage.@@TOWER_CLUSTER@@.local"]
#@end
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          # gateway-v0.3.13 = autopilot f92e394 with clearance v0.16.0 (glidepath.cicd.validate and glidepath.cicd.propose:
          # a cicd.yaml change validated by glidepath-api, then a PR); multi-arch index digest (amd64, arm64).
          image: @@REGISTRY_HOST@@/@@REGISTRY_OWNER@@/autopilot-gateway:gateway-v0.3.13@sha256:8dabda0f116304d83e73ea7a97ef7a0284f25c08852b3b895110ed92c0a14494
          ports:
            - {name: mcp, containerPort: 8080}
            - {name: model, containerPort: 8081}
          env:
            - name: CLEARANCE_DSN
              valueFrom: {secretKeyRef: {name: clearance-pg-app, key: uri}}
            - {name: CLEARANCE_AUDIENCE, value: clearance}
            - {name: GLIDEPATH_API_URL, value: "http://glidepath-api.platform-system.svc:8080"}
            - {name: GLIDEPATH_ON_BEHALF_OF, value: "1"}
            - {name: AIRFRAME_CLUSTER, value: "@@CLUSTER_NAME@@"}
            - {name: AIRFRAME_TENANTS_REPO, value: "@@TENANTS_REPO_NAME@@"}
            # T0 reads: Argo CD Applications through the Kubernetes API (the airframe reader's RBAC), PromQL on Thanos
            # Query, LogQL on Loki (OpenTelemetry labels: k8s_namespace_name, k8s_pod_name, service_name).
            - {name: ARGO_APP_NAMESPACES, value: "argocd,argocd-apps"}
            # argo.sync.lower: a sync of an Application in an <app>-lower project, the Role and admission policy in
            # argo-sync.yaml (argocd-apps only).
            - {name: ARGO_SYNC_ENABLED, value: "1"}
            - {name: PROMETHEUS_URL, value: "http://thanos-query.observability.svc:9090"}
            - {name: LOKI_URL, value: "http://loki-gateway.observability.svc"}
            # repo.pr.open as the agents' GitHub App: a token per PR from Glidepath's broker (/agent-installation-token),
            # asked for with the projected token below. The App's key never reaches this pod.
            - {name: GITHUB_PR_ENABLED, value: "1"}
            - {name: AGENT_TOKEN_FILE, value: /var/run/clearance/agent-installation-token}
            # The model proxy (port 8081, Service model-proxy): runs' model calls, decided and charged here.
            - {name: MODEL_KEY_FILE, value: /etc/clearance-model/anthropic-api-key}
            - {name: MODEL_ROUTES, value: "claude-sonnet-5-5=claude-sonnet-5-5"}
            # The event trigger bridge: glidepath-api /v1/events as this identity (a glidepath-api reader) -> each
            # matching Glidepath event trigger's run (agents/triage-agent.yaml: a failed gate-api pipeline run).
            - {name: EVENTS_ENABLED, value: "1"}
            # The agent gates (glidepath docs/admin/agent-gates.md) ask POST /v1/provenance as their pipeline's service
            # account; only these principals may. Every app's -cicd namespace runs them.
            - {name: CLEARANCE_VERIFIERS, value: "app-*-cicd/pipeline-runner"}
#@if tower.cluster
            # catalog.read: Tower's catalog, as this identity (the backstage-catalog token below, which Backstage checks
            # against this cluster's public issuer; catalog-token-policy.yaml keeps that audience to this pod).
            - {name: BACKSTAGE_URL, value: "@@TOWER_BASE_URL@@"}
            - {name: BACKSTAGE_TOKEN_FILE, value: /var/run/clearance/backstage-token}
            # The human inbox (human.request): Tower's backend (Backstage's service account on Tower's cluster) answers
            # for the person it names. Its tokens are verified against that cluster's public issuer.
            - {name: TOWER_ISSUER, value: "@@TOWER_ISSUER@@"}
            - {name: TOWER_CLUSTER, value: "@@TOWER_CLUSTER@@"}
            - {name: TOWER_SERVICE_ACCOUNTS, value: "@@TOWER_NAMESPACE@@/backstage-ingestor"}
            - {name: CLEARANCE_DELEGATES, value: "@@TOWER_CLUSTER@@/@@TOWER_NAMESPACE@@/backstage-ingestor"}
#@end
#@if autopilot.people and components.gatewayRoutes
            # People (D19 interim): ID tokens from people-dex (GitHub sign-in) for its public client `clearance`, as
            # user:<GitHub login>, and only for cluster.yaml autopilot.people. The issuer is the browser-facing URL;
            # the keys are read in-cluster.
            - {name: CLEARANCE_OIDC_ISSUER, value: "http://dex.@@CLUSTER_DOMAIN@@/dex"}
            - {name: CLEARANCE_OIDC_AUDIENCE, value: clearance}
            - {name: CLEARANCE_OIDC_JWKS_URL, value: "http://people-dex.autopilot-system.svc:5556/dex/keys"}
            - {name: CLEARANCE_OIDC_USER_CLAIM, value: preferred_username}
            - {name: CLEARANCE_OIDC_ALLOWED_USERS, value: "@@AUTOPILOT_PEOPLE@@"}
            - {name: CLEARANCE_RESOURCE_URL, value: "http://clearance.@@CLUSTER_DOMAIN@@/mcp"}
#@end
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: clearance-tokens, mountPath: /var/run/clearance, readOnly: true}
            - {name: model-key, mountPath: /etc/clearance-model, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        # Clearance's tokens, rotated by the kubelet: toward the broker's /agent-installation-token, and toward Tower's
        # catalog (audience backstage-catalog; only this pod may mount it, catalog-token-policy.yaml).
        - name: clearance-tokens
          projected:
            sources:
              - serviceAccountToken: {audience: agent-installation-token, expirationSeconds: 3600, path: agent-installation-token}
              - serviceAccountToken: {audience: backstage-catalog, expirationSeconds: 3600, path: backstage-token}
        - name: model-key
          secret:
            secretName: clearance-model-key
---
apiVersion: v1
kind: Service
metadata:
  name: clearance
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
spec:
  selector: {app.kubernetes.io/name: clearance}
  ports:
    - {name: mcp, port: 8080, targetPort: mcp}
---
# The model proxy is Clearance's own pod (function-agentrun's model_proxy_selector, airframe compositions/agentrun):
# runs reach it as MODEL_PROXY_URL, http://model-proxy.autopilot-system.svc:8081.
apiVersion: v1
kind: Service
metadata:
  name: model-proxy
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
spec:
  selector: {app.kubernetes.io/name: clearance}
  ports:
    - {name: model, port: 8081, targetPort: model}
