# Same minimum scope as the former management cluster's own backstage-ingestor RBAC (view + CRD read +
# crossplane-browse, no crossplane-view/managed-resource or secrets access) - see that
# file's own header for the full rationale (TeraSky-OSS/backstage-plugins
# kubernetes-ingestor/K8S_RBAC.md). The one real difference: this ServiceAccount's
# token is minted as a long-lived Secret (below), not a kubelet-projected in-cluster
# mount, because the consumer (Backstage) runs on a different cluster (the former management cluster) and
# has no pod here to project a token into. The token value itself is never read or
# handled by an assistant - see this directory's README for how it's planted into
# Infisical and delivered to the former management cluster.
