# gitops-strategy.md §10: every app gets a SECOND, narrower AppProject scoped to the
# dev-cluster-only self-service lower-env tier - sourceRepos is this app's own SRC
# repo (.Values.appRepoUrl, NOT gitopsRepoUrl - that stays upper-env-only, see the
# sibling appproject.yaml), destinations restricted to this app's own
# app-<appName>-* namespaces on THIS cluster only (this chart/Application only ever
# runs on kind-dev - no other cluster is even registered as an ArgoCD destination on
# this instance today, confirmed via grep for secret-type: cluster). This is the real
# enforcement boundary §10 calls for: lower-envs-applicationset.yaml's generated
# Applications can only ever sync [idp-service-catalog, this app's own src repo] into
# this app's own namespace class - never gitops-<app-name>, never a staging/prod
# namespace, even by operator mistake.
#
# Guarded on appRepoUrl being set below: it's always present in a real
# tenants/<app>/app.yaml (NodeJSApplication's own Composition writes it
# unconditionally), but a malformed one should render nothing here rather than a
# broken AppProject with an empty sourceRepos entry - same "structural backstop,
# refuse rather than partially succeed" instinct used elsewhere in this design.
{{- if .Values.appRepoUrl }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.appName }}-lower
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: tenant-onboarding
    hangar.io/app: {{ .Values.appName }}
    hangar.io/env-tier: lower
spec:
  description: "Per-app lower-env (dev-cluster-only) AppProject for {{ .Values.appName }}, gitops-strategy.md §10"
  sourceRepos:
    - {{ .Values.idpServiceCatalogRepoUrl }}
    - {{ .Values.appRepoUrl }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "app-{{ .Values.appName }}-*"
  # Same clusterResourceWhitelist gotcha the sibling appproject.yaml already
  # documents hitting live (2026-08-15): an AppProject with no
  # clusterResourceWhitelist implicitly denies EVERY cluster-scoped resource,
  # including the Namespace CreateNamespace=true needs to create for a brand-new
  # lower env.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
{{- end }}
