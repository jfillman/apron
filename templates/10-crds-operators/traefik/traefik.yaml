apiVersion: v1
kind: Namespace
metadata:
  name: @@GATEWAY_NAMESPACE@@
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: @@GATEWAY_NAMESPACE@@
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: traefik
  name: traefik
  namespace: @@GATEWAY_NAMESPACE@@
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: traefik
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: traefik
    spec:
      containers:
      - args:
        - --entrypoints.web.address=:80
        - --entrypoints.websecure.address=:443
        - --entrypoints.traefik.address=:8080
        - --ping=true
        - --providers.kubernetesgateway=true
        - --providers.kubernetesgateway.statusaddress.service.name=traefik
        - --providers.kubernetesgateway.statusaddress.service.namespace=@@GATEWAY_NAMESPACE@@
        image: docker.io/traefik:v3.7.6
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: traefik
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: traefik
        ports:
        - containerPort: 80
          name: web
          protocol: TCP
        - containerPort: 443
          name: websecure
          protocol: TCP
        - containerPort: 8080
          name: traefik
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: traefik
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccount: traefik
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 30
---
# On a cloud load balancer (traefik.loadBalancer.certificateArn, runtime eks): the AWS Load Balancer Controller's NLB
# ends TLS on 443 with the ACM certificate and forwards it to the plain-HTTP `web` entrypoint, the Gateway's one
# listener. It admits only traefik.loadBalancer.sourceRanges (admin CIDRs, the fleet's NAT addresses, GitHub's hooks).
apiVersion: v1
kind: Service
metadata:
  labels:
    app: traefik
  name: traefik
  namespace: @@GATEWAY_NAMESPACE@@
#@if traefik.loadBalancer.certificateArn
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: @@TRAEFIK_LB_SCHEME@@
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: @@TRAEFIK_LB_CERT_ARN@@
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
#@end
spec:
#@if traefik.loadBalancer.class
  loadBalancerClass: @@TRAEFIK_LB_CLASS@@
#@end
#@if traefik.loadBalancer.sourceRanges
  loadBalancerSourceRanges: @@TRAEFIK_LB_SOURCE_RANGES@@
#@end
  ports:
  - name: web
#@if traefik.fixedNodePorts
    nodePort: @@TRAEFIK_HTTP_NODEPORT@@
#@end
    port: 80
    targetPort: web
  - name: websecure
#@if traefik.fixedNodePorts
    nodePort: @@TRAEFIK_HTTPS_NODEPORT@@
#@end
    port: 443
#@if traefik.loadBalancer.certificateArn
    targetPort: web
#@end
#@if not traefik.loadBalancer.certificateArn
    targetPort: websecure
#@end
  selector:
    app: traefik
  type: @@TRAEFIK_SERVICE_TYPE@@
