# The Flight tenant-onboarding ApplicationSet (chart/applicationset.tmpl.yaml), rendered with this cluster's
# default environment chart from cluster-defaults.yaml (ADR-0023 slice 1). Took over the ApplicationSet that the root
# Application used to apply raw from tenant-onboarding/applicationset.yaml (the root does not prune).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-onboarding
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: tenant-onboarding
spec:
  project: default
  sources:
    - repoURL: https://github.com/jfillman/gitops-cluster-dev.git
      targetRevision: main
      path: 02-argocd-apps/tenant-onboarding/chart
      helm:
        valueFiles:
          - $clustercfg/cluster-defaults.yaml
    - repoURL: https://github.com/jfillman/gitops-cluster-dev.git
      targetRevision: main
      ref: clustercfg
      directory:
        exclude: "*"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-apps
  syncPolicy:
    automated:
      selfHeal: true
