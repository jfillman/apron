# Same split as ../../01-argocd-platform/repo-creds/secret-application.yaml - a
# directory-sourced plain manifest (the ExternalSecret in this same folder) applied
# into the argocd-apps instance's own namespace. This Application object itself lives
# in the argocd-platform instance's namespace (same convention as every other
# 02-argocd-apps/*/application.yaml - the platform instance bootstraps the app-owner
# instance's resources), while spec.destination.namespace is where the rendered
# Secret actually lands.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps-repo-creds
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-repo-creds
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-dev.git
    targetRevision: main
    path: 02-argocd-apps/repo-creds
    directory:
      exclude: "secret-application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-apps
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
