# The Pipelines-as-Code webhook listener on the hub's gateway (gateway.fleetRoutes, runtime eks): the PaC GitHub App's
# webhook URL is https://pac.<hub domain>, replacing the laptop's cloudflared tunnel to the
# pipelines-as-code-controller-nodeport Service. PaC checks every delivery's HMAC against the App's webhook secret
# (pipelines-as-code-secret), and the load balancer admits GitHub's hook ranges through traefik.loadBalancer.sourceRanges.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pac-webhook
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
  hostnames:
    - pac.@@CLUSTER_DOMAIN@@
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pipelines-as-code-controller
          port: 8080
