# A dedicated GitHub OAuth App for Backstage sign-in, not the fleet's existing
# GitHub App (platform-cicd, the dev cluster, App ID + private key for installation-token
# minting) and not provider-github's classic PAT (the former management cluster Crossplane) either -
# checked live 2026-08-27 that both of those are the wrong shape for user OAuth
# sign-in (no client id/secret) or the wrong blast radius (broad repo-write scope
# tied to CI automation). This App is scoped to nothing but "who is this person" -
# see idp/docs/backstage-design.md for context, this revises that doc's original
# "reuse provider-github's App" plan.
#
# Same secretStoreRef (platform-secret-store, the former management cluster's shared ClusterSecretStore)
# as provider-github-creds-external-secret.yaml. Plant the App's client ID/secret by
# hand, once, in platform-cicd-<cluster>'s Infisical project - never committed here,
# same "manual by design" posture as every other credential's ultimate source in
# this platform:
#   1. github.com -> Settings -> Developer settings -> OAuth Apps -> New OAuth App
#      - Homepage URL: http://<service>.<domain>
#      - Authorization callback URL:
#        http://<service>.<domain>/api/auth/github/handler/frame
#      (updated 2026-09-03 for the kiac migration - HTTP, not HTTPS: the kiac
#      Gateway has no TLS listener. If an existing App was already registered
#      against the old https://backstage.man.local:8453 values, edit it in place
#      rather than creating a new one - the Infisical-stored client ID/secret
#      don't need to change, only the App's own Homepage/callback URL fields.)
#   2. Infisical keys: backstage-github-oauth-client-id, backstage-github-oauth-client-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-oauth-creds
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-github-oauth-creds
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: backstage-github-oauth-client-id
    - secretKey: clientSecret
      remoteRef:
        key: backstage-github-oauth-client-secret
