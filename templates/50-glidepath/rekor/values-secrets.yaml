# 50-glidepath/rekor/values-secrets.yaml
#
# the dev cluster's own Rekor/Trillian MySQL credentials - generated 2026-09-05 the same way
# hack/customize-cluster.sh now generates them for a fresh cluster (openssl rand -hex
# 20), retrofitting this pre-existing cluster onto the declarative path rather than
# leaving it on the imperative helm install/upgrade sequence this session started
# with. See the template repo's own copy of this file for the full rationale (why a
# committed value is an acceptable exception here, unlike Fulcio's signing key).
trillian:
  mysql:
    auth:
      password: "@@REKOR_MYSQL_PASSWORD@@"
      rootPassword: "@@REKOR_MYSQL_ROOT_PASSWORD@@"
