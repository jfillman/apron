# 50-platform-cicd/rekor/values-secrets.yaml
#
# This cluster's own Rekor/Trillian MySQL credentials. Generated once by
# hack/customize-cluster.sh (same openssl-rand + placeholder-substitution pattern
# already used there for Infisical's PG/Redis passwords) and committed as part of
# customizing this template into a real gitops-cluster-<name> repo - never hand-typed,
# never copied from another cluster.
#
# Committing a real credential here is a deliberate, narrower exception to ADR-0006's
# "no cluster secrets in a repo" spirit than Fulcio's signing key gets: this is
# genuinely internal, ClusterIP-only DB auth for a local Merkle-tree store with no
# external exposure and no ability to forge a signature or impersonate this cluster's
# identity if leaked - unlike Fulcio's root key, which must never be persisted
# anywhere at rest and is instead generated inside the cluster by
# hooks/fulcio-bootstrap-job.yaml. See platform-cicd's platform/sigstore/
# rekor-helm-values.yaml for why a FIXED (not chart-random-generated) value is
# required here regardless, for a real, unrelated reason (a namespace-mismatched
# `lookup` call in the upstream chart's own random-password helper).
trillian:
  mysql:
    auth:
      password: "__REKOR_MYSQL_PASSWORD__"
      rootPassword: "__REKOR_MYSQL_ROOT_PASSWORD__"
