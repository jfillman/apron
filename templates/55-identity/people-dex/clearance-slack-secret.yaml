# The Slack service's people-dex client secret (clearance.slack.enabled), from the owner's Infisical project; never in git. The
# same Infisical key feeds both ends: people-dex reads it as the static client's secretEnv, the service reads it as a file
# (idp-client-secret in clearance-config's slack-secret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clearance-slack-idp
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: clearance-slack}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: clearance-slack-idp
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: clearance-slack-idp-client-secret}
