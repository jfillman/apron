# autopilot-api, in Go (`autopilot-gateway api`): the gateway's read API, rendered INSTEAD of autopilot-api.yaml when cluster.yaml says
# `autopilot.gateway.implementation: go`. Same names, ports, Service, route, PodDisruptionBudget and ServiceAccount, so Tower and the
# Backstage plugin call it unchanged. It reads the gateway database as a READ-ONLY role (autopilot.gateway.go.readerSecret, default the
# Python read API's autopilot-pg-reader secret, key `uri`; never created or printed here) and refuses to start on a role that could write.
# It takes no writer lock and creates nothing, so it runs two replicas beside the one writer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autopilot-api-auth-delegator
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: autopilot-api
    namespace: autopilot-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: autopilot-api, hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
  annotations:
    # Wave 2: after the migrate Job (wave 1, gateway-go-migrate.yaml) when autopilot.gateway.go.migrateJob is on; the Python Deployments are wave 1.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: autopilot-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: autopilot-api, hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
    spec:
      serviceAccountName: autopilot-api
      automountServiceAccountToken: true
      enableServiceLinks: false
#@if runtime.labNetworking and tower.hostAliasIP
      hostAliases:
        - ip: "@@TOWER_HOST_ALIAS_IP@@"
          hostnames: ["backstage.@@TOWER_CLUSTER@@.local"]
#@end
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: @@AUTOPILOT_GO_IMAGE@@
          args: [api]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: GATEWAY_API_DSN
              valueFrom: {secretKeyRef: {name: "@@AUTOPILOT_GO_READER_SECRET@@", key: uri}}
            - {name: CLEARANCE_API_URL, value: "http://clearance-api.@@CLEARANCE_NAMESPACE@@.svc:8080"}
            - {name: AUTOPILOT_AUDIENCE, value: clearance}
            - {name: AUTOPILOT_GATEWAY_URL, value: "@@GATEWAY_SCHEME@@://autopilot.@@CLUSTER_DOMAIN@@"}
#@if components.observability and observability.full
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: "http://otel-collector-opentelemetry-collector.observability.svc:4318/v1/logs"}
            - {name: OTEL_SERVICE_NAME, value: autopilot-api}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.cluster.name=@@CLUSTER_NAME@@"}
#@end
#@if components.observability and observability.full and autopilot.gateway.go.plainHttp.logs
            - {name: OTEL_EXPORTER_OTLP_LOGS_ALLOW_HTTP, value: "1"}
#@end
#@if tower.cluster
            # Tower: its backend reads for the person it names (delegate) and reads the inbox feed (notifier).
            - {name: BACKSTAGE_URL, value: "@@TOWER_BASE_URL@@"}
            - {name: BACKSTAGE_TOKEN_FILE, value: /var/run/clearance/backstage-token}
            - {name: TOWER_ISSUER, value: "@@TOWER_ISSUER@@"}
            - {name: TOWER_CLUSTER, value: "@@TOWER_CLUSTER@@"}
            - {name: TOWER_SERVICE_ACCOUNTS, value: "@@TOWER_NAMESPACE@@/backstage-ingestor"}
#@end
#@if tower.cluster and autopilot.gateway.go.plainHttp.catalog
            - {name: BACKSTAGE_ALLOW_HTTP, value: "1"}
#@end
            - {name: AUTOPILOT_DELEGATES, value: "@@AUTOPILOT_GO_DELEGATES@@"}
            - {name: GATEWAY_API_NOTIFIERS, value: "@@AUTOPILOT_GO_NOTIFIERS@@"}
#@if autopilot.customImages
            - {name: RUNTIME_IMAGES_EXTRA, value: "@@AUTOPILOT_CUSTOM_IMAGES@@"}
#@end
#@if autopilot.people and components.gatewayRoutes
            - {name: AUTOPILOT_OIDC_ISSUER, value: "@@GATEWAY_SCHEME@@://dex.@@CLUSTER_DOMAIN@@/dex"}
            - {name: AUTOPILOT_OIDC_AUDIENCE, value: clearance}
            - {name: AUTOPILOT_OIDC_JWKS_URL, value: "http://people-dex.autopilot-system.svc:5556/dex/keys"}
            - {name: AUTOPILOT_OIDC_USER_CLAIM, value: preferred_username}
            - {name: AUTOPILOT_OIDC_ALLOWED_USERS, value: "@@AUTOPILOT_PEOPLE@@"}
#@end
#@if autopilot.people and components.gatewayRoutes and autopilot.gateway.go.plainHttp.jwks
            - {name: AUTOPILOT_JWKS_ALLOW_HTTP, value: "1"}
#@end
            - {name: GATEWAY_API_AUDITORS, value: "@@AUTOPILOT_GO_AUDITORS@@"}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: tokens, mountPath: /var/run/clearance, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: tokens
          projected:
            sources:
              - serviceAccountToken: {audience: backstage-catalog, expirationSeconds: 3600, path: backstage-token}
---
apiVersion: v1
kind: Service
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: autopilot-api, hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  selector: {app.kubernetes.io/name: autopilot-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: autopilot-api}
---
# Ingress to the read API: the Gateway (its route below) and pods in this cluster that carry the client label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: autopilot-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: @@GATEWAY_NAMESPACE@@}
        - namespaceSelector: {}
          podSelector:
            matchLabels: {hangar.io/autopilot-client: api}
      ports:
        - {protocol: TCP, port: 8080}
#@if components.gatewayRoutes
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  parentRefs:
    - name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
  hostnames:
    - autopilot-api.@@CLUSTER_DOMAIN@@
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: autopilot-api
          port: 8080
#@end
