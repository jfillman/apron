# Crossplane Function packages, pinned to the exact package references already
# installed (`kubectl get functions.pkg.crossplane.io`). function-rollout-watcher is
# the custom function from the ai-rollout prototype (github.com/jfillman) - kept as its
# own GHCR package, reused (not rebuilt) per the "fold it in" decision - see
# service-catalog-design.md's Argo Rollouts / AnalysisTemplate section once its
# Composition usage is ported in Phase 2.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
  # CEL readiness rules (airframe review C7, catalog v0.3.128+): see function-auto-ready-runtime.yaml.
  runtimeConfigRef:
    name: function-auto-ready
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.12.3
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.7.0
---
# 2026-08-24: bumped from v0.1.16 (this template repo had never picked up any
# post-prototype fixes) to v0.2.4, the current known-good tag - see
# idp-service-catalog/functions/function-rollout-watcher/README.md's own
# changelog for what each bump since v0.1.16 fixed.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-rollout-watcher
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
    hangar.io/origin: ai-rollout
spec:
  # v0.2.4 (and everything before it) was a genuine single-platform (amd64-only)
  # OCI manifest - built and pushed by hand, since this function's own CI
  # workflow was never actually discoverable by GitHub Actions (nested under a
  # monorepo subdirectory, not the repo root's .github/workflows/). Crashes with
  # "exec format error" on arm64 nodes - hit and fixed live on kiac-dev/kiac-prod
  # 2026-09-02. v0.2.5 is a genuine multi-platform OCI index (linux/amd64 +
  # linux/arm64), confirmed live against the GHCR manifest API.
  # 2026-10-09: v0.2.5 -> v0.2.8 (matches the live clusters; v0.2.8 emits events on phase changes only).
  package: ghcr.io/jfillman/function-rollout-watcher:v0.2.8
---
# Renders the Dex XRD (airframe compositions/dex): server mode is a self-contained Dex, attach mode registers an
# OAuth client through Dex's gRPC admin API. Multi-arch (amd64 + arm64). v0.1.7 runs Dex v2.46.0.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-dex
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  package: ghcr.io/jfillman/function-dex:v0.1.7
