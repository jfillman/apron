# runtimes/kind.yaml - a local single-node kind cluster. `apron up` runs
#   kind create cluster --name <name> --config hack/kind-config.yaml   (rendered into the cluster repo)
# then installs Calico before anything else: kind's kindnet ignores NetworkPolicy.
runtime:
  type: kind
  labNetworking: true          # lab name/IP plumbing (hostAliases, LAN addresses, *.local) may be rendered: docs/lab-networking.md
  nodeExec: docker exec -i      # + <node>; e.g. "podman exec -i" or "ssh <host> podman exec -i" for apron identity
  controlPlane:
    # kube-controller-manager and kube-scheduler leader election (defaults 15s/10s/2s): a slow etcd or API server made the
    # lease call miss 10s and both crash-looped (hangar-dev 2026-11: 362/348 restarts), each restart re-listing everything.
    # Whole seconds; lease > renew > 1.2 x retry. kind: rendered into hack/kind-config.yaml. kiac has no kubeadm hook:
    # run hack/control-plane-tuning.sh apply after `apron up` (docs/control-plane-tuning.md).
    leaderElection:
      leaseDuration: 60s
      renewDeadline: 40s
      retryPeriod: 10s
  kind:
    config: hack/kind-config.yaml
    podSubnet: 10.244.0.0/16     # never a LAN range: 192.168.0.0/16 swallowed a hub at 192.168.1.x
    maxPods: 250
    hostHttpPort: 80
    hostHttpsPort: 443
  cni:
    name: calico
    version: v3.29.1
    manifest: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
traefik:
  serviceType: NodePort         # kind has no LoadBalancer; host 80/443 map to these NodePorts
  fixedNodePorts: true
  httpNodePort: 30080
  httpsNodePort: 30443
components:
  metricsServer: true          # kind ships no metrics-server
