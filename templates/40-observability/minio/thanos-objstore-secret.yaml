# Thanos (sidecar, inside every Prometheus pod - see kube-prometheus-stack/application.yaml
# - and the standalone Query/Store Gateway/Compactor in thanos/application.yaml) both read
# this by name (existingObjstoreSecret / prometheusSpec.thanos.objectStorageConfig.existingSecret).
# Dev-only credentials matching minio/application.yaml's auth.rootUser/rootPassword exactly -
# same "learning setup, not for anywhere real" caveat as that file.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore-config
  namespace: observability
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: thanos
      endpoint: minio:9000
      access_key: admin
      secret_key: minioadmin123
      insecure: true
