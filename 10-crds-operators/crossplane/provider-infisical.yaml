# provider-infisical: the Crossplane provider airframe's SecretStore Composition drives to
# provision Infisical projects, environments, machine identities (universal auth or
# kubernetes auth) and project memberships. Source: github.com/jfillman/provider-infisical
# (upjet-generated from the official Infisical/infisical Terraform provider). It REPLACES
# the hand-rolled infisical-secretstore-operator, which is retired on every cluster - a
# cluster built from this template installs no operator.
#
# Version: v0.0.0-7.gb220ec2 or later is REQUIRED. Earlier builds (this file pinned
# v0.0.0-5 until 2026-09-23) fail IdentityUniversalAuthClientSecret's first Observe
# ("cannot unmarshal array into Go struct field ...") because upjet seeds the Terraform state
# with an empty id and the Terraform provider then calls the client-secret LIST endpoint.
# Fixed in -7 (a non-empty seeded id) - which universal auth, i.e. every remote-consumer
# cluster, depends on. The package is a multi-arch index (amd64 and arm64).
#
# Resource set: Project, ProjectEnvironment, Identity, IdentityUniversalAuth,
# IdentityUniversalAuthClientSecret, IdentityKubernetesAuth, ProjectIdentity - all
# namespaced (infisical.m.hangar.io).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-infisical
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  package: ghcr.io/jfillman/provider-infisical:v0.0.0-7.gb220ec2
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-infisical-runtime
