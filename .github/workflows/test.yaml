# apron's offline tests (tests/run.sh): the renderer, the checks, and the admission policies against a real kube-apiserver
# (envtest binaries). APRON_REQUIRE_ENVTEST=1 makes an envtest suite that cannot find its binaries fail instead of skip, so a
# green run here means the policies were proven, not skipped.
#
# The cases (tests/cases/) run as parallel jobs, one per group, the render group in four balanced shards (tests/runner.py
# --shard); a shard also runs, uncounted, the cases its own read from. Every case runs on every pull request and push to
# main. `run` is the one result to require: it passes only when every shard passed.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gated set (Argo CD ApplicationSet controller), args: --group gatedset, envtest: true}
          - {name: Clearance gate admission, args: --group admission, envtest: true}
          - {name: policy and CEL, args: --group policy, envtest: true}
          - {name: render 1/4, args: --group render --shard 1/4, envtest: false}
          - {name: render 2/4, args: --group render --shard 2/4, envtest: false}
          - {name: render 3/4, args: --group render --shard 3/4, envtest: false}
          - {name: render 4/4, args: --group render --shard 4/4, envtest: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.envtest
        with:
          go-version: "1.26.11"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml cel-python
      - if: matrix.envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
      - name: tests/run.sh ${{ matrix.args }}
        env:
          ENVTEST: ${{ matrix.envtest }}
        run: |
          set -euo pipefail
          command -v kubectl jq openssl
          if [ "${ENVTEST}" = true ]; then
            assets="$("$(go env GOPATH)/bin/setup-envtest" use 1.36.2 -p path)"
            test -n "$assets"
            test -x "$assets/kube-apiserver"
            export KUBEBUILDER_ASSETS="$assets"
          fi
          APRON_REQUIRE_ENVTEST=1 bash tests/run.sh ${{ matrix.args }}
  run:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "shards: ${RESULT}"
          test "${RESULT}" = success
