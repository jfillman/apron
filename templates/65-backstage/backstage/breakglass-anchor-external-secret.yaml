# Tower break-glass recording anchor key (backstage breakglassAnchor.ts, gaps phase B, 2026-10-11). An ECDSA P-256
# private key in PEM, generated and planted by hand in Infisical (the prod cluster, platform-cicd-<cluster> / shared) as
# tower-breakglass-anchor-key - not generated by an assistant:
#   openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt
# The backend signs each recording's SHA-256 with it and submits a hashedrekord to Rekor; the public half travels in
# the entry, so verification needs neither Backstage nor this key. Rotating it does not invalidate old entries.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-breakglass-anchor
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-breakglass-anchor
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: tower-breakglass-anchor-key
