# The real §0 xr-requests mechanism (idp/docs/service-catalog-design.md) - one
# Application per app directory under gitops-cluster-dev-tenants/tenants/, rendering
# whatever raw XR manifests are committed into that app's own xr-requests/ subfolder.
# This is how NodeJSApplication/ApplicationEnvironment (and future SpringBootApplication)
# get created for real: a git commit, not `kubectl apply`.
#
# Generator uses a `directories` matcher (path: tenants/*), NOT a `files` matcher keyed
# on app.yaml or identity.yaml like the sibling ../tenant-appprojects/ and
# ../tenant-onboarding/ ApplicationSets. Deliberate: app.yaml is WRITTEN by
# NodeJSApplication's own Composition - gating the Application that CREATES that XR on
# a file the XR itself produces would be circular. A brand-new app's very first commit
# (tenants/<new-app>/xr-requests/nodejsapplication.yaml) already creates the
# tenants/<new-app>/ directory, which is all this generator needs to notice it.
#
# project: idp-onboarding (see appproject.yaml in this same directory), not `default`
# and not the per-app AppProject (which, same circularity, doesn't exist yet either for
# a brand-new app) - see appproject.yaml's own header for the full reasoning.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: xr-requests
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: xr-requests
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: https://github.com/jfillman/gitops-cluster-dev-tenants.git
        revision: main
        directories:
          - path: "tenants/*"
  template:
    metadata:
      name: "{{.path.basename}}-xr-requests"
      labels:
        hangar.io/component: cluster-config
        hangar.io/subcomponent: xr-requests
        hangar.io/app: "{{.path.basename}}"
      # Cascade-deletes everything this Application created (the Bootstrap-tier XRs) if
      # a tenant's whole tenants/<app>/ directory is ever removed - same finalizer,
      # same reasoning as the sibling ApplicationSets in this repo.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd-apps
    spec:
      project: idp-onboarding
      source:
        repoURL: https://github.com/jfillman/gitops-cluster-dev-tenants.git
        targetRevision: main
        # Source path is the APP directory (tenants/<app>), not the xr-requests/
        # subfolder directly - found live: git doesn't track empty directories, so a
        # directory-type source pointed straight at xr-requests/ starts erroring
        # manifest generation entirely ("app path does not exist") the moment the
        # LAST file in it is removed - exactly the moment a real deletion needs it to
        # cleanly diff down to zero resources instead. tenants/<app> itself is
        # guaranteed to exist (the directories generator above just matched it), so
        # scoping down to just xr-requests/*.yaml via recurse+include instead keeps
        # the source path always valid while still only ever applying XR manifests -
        # app.yaml and <env>/identity.yaml, both siblings of xr-requests/ under the
        # same tenants/<app>/ root, are excluded by the include pattern.
        path: "tenants/{{.path.basename}}"
        directory:
          recurse: true
          include: "xr-requests/*.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{.path.basename}}-cicd"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # SUSPECTED RESOLVED, not proven (downgraded 2026-08-15 - full writeup in
          # idp/docs/service-catalog-design.md's own status note): deleting an
          # ApplicationEnvironment xr-request through this Application was confirmed
          # twice, live, to deadlock against the Usage it composes - the Usage's own
          # controller (protection.crossplane.io) refused to release its finalizer until
          # the ApplicationEnvironment ("using" resource, spec.by) was actually gone,
          # while the ApplicationEnvironment itself wouldn't finish going away until that
          # same Usage (an owned, blockOwnerDeletion:true dependent) was gone first -
          # circular. PrunePropagationPolicy=background (kept below) was tried as a fix
          # and did NOT resolve it on a same-day retest. A later same-day pass
          # reproduced the same deletion path 3 times, including one attempt matching
          # the original failure's timing/cluster almost exactly - all 3 tore down
          # cleanly, no code change made to the Usage/finalizer mechanism in between.
          # Best lead: a real, separate ArgoCD Redis-cache staleness bug
          # (../../01-argocd-platform/README.md) was found and fixed immediately before the clean
          # runs, and the original failures happened during heavy same-day onboard/
          # teardown churn - plausible, not proven. If this ever recurs: kubectl patch
          # usage <name> -n <ns> --type=merge -p '{"metadata":{"finalizers":[]}}'. Treat
          # env deletion through this path as usable but monitored, not yet fully
          # routine.
          - PrunePropagationPolicy=background
