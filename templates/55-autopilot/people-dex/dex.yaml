# Dex for people. The issuer is the browser-facing URL (the Gateway); Clearance reads its JWKS in-cluster
# (CLEARANCE_OIDC_JWKS_URL). Grants: the device flow (tools/hangar-login, nothing listens on the laptop) and the
# authorization code flow; no refresh-token grant (hangar-login never asks for offline_access),
# and ID tokens last 1 hour, so a stolen token is short-lived. GitHub is the only connector; $GITHUB_* come from
# people-dex-github and Dex expands them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: people-dex
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: people-dex, hangar.io/component: autopilot, hangar.io/subcomponent: people-dex}
data:
  config.yaml: |
    issuer: http://dex.@@CLUSTER_DOMAIN@@/dex
    storage:
      type: sqlite3
      config: {file: /var/dex/dex.db}
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    oauth2:
      grantTypes: ["authorization_code", "urn:ietf:params:oauth:grant-type:device_code"]
      responseTypes: ["code"]
      skipApprovalScreen: true
    expiry:
      idTokens: 1h
      deviceRequests: 5m
    enablePasswordDB: false
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $GITHUB_CLIENT_ID
          clientSecret: $GITHUB_CLIENT_SECRET
          redirectURI: http://dex.@@CLUSTER_DOMAIN@@/dex/callback
    staticClients:
      - id: clearance
        name: Clearance
        public: true
        # The device flow's callback under the issuer's path, matched exactly (Dex authflow validateRedirectURI).
        redirectURIs: ["/dex/device/callback"]
      # glidepath-api's own client (glidepath docs/admin/api.md "People"): its ID tokens carry aud glidepath-api, which
      # Clearance refuses and glidepath-api requires, so a token for one is never accepted by the other.
      - id: glidepath-api
        name: glidepath-api
        public: true
        redirectURIs: ["/dex/device/callback"]
---
# Same wave as the Deployment: a WaitForFirstConsumer PVC stays Pending until its pod schedules, so an earlier wave
# would wait on it forever.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: people-dex
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: people-dex, hangar.io/component: autopilot, hangar.io/subcomponent: people-dex}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-dex
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: people-dex, hangar.io/component: autopilot, hangar.io/subcomponent: people-dex}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: people-dex}
  template:
    metadata:
      labels: {app.kubernetes.io/name: people-dex}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.46.0
          args: [dex, serve, /etc/dex/config.yaml]
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom: {secretKeyRef: {name: people-dex-github, key: client-id}}
            - name: GITHUB_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: people-dex-github, key: client-secret}}
          ports:
            - {name: http, containerPort: 5556}
            - {name: telemetry, containerPort: 5558}
          readinessProbe:
            httpGet: {path: /healthz/ready, port: telemetry}
          livenessProbe:
            httpGet: {path: /healthz/live, port: telemetry}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/dex, readOnly: true}
            - {name: data, mountPath: /var/dex}
            # The image entrypoint renders the config (env expansion) into /tmp before starting dex.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: people-dex}
        - name: data
          persistentVolumeClaim: {claimName: people-dex}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: people-dex
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: people-dex, hangar.io/component: autopilot, hangar.io/subcomponent: people-dex}
spec:
  selector: {app.kubernetes.io/name: people-dex}
  ports:
    - {name: http, port: 5556, targetPort: http}
