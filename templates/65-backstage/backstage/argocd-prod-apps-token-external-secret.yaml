# Delivers the prod cluster's argocd-apps `backstage` account API token into a K8s Secret
# here, which deployment.yaml mounts as ARGOCD_PROD_APPS_TOKEN for app-config.yaml's
# argocd.appLocatorMethods to read via ${ARGOCD_PROD_APPS_TOKEN} substitution. The
# `backstage` account itself (apiKey capability only, role:readonly) is provisioned
# by the prod cluster's repo/01-argocd-platform/argocd-apps-install/application.yaml's
# own configs.cm/configs.rbac - this file only delivers the token minted against it.
#
# Same secretStoreRef (platform-secret-store) and "manual by design" posture as
# github-oauth-secret.yaml in this same directory - do this yourself, not through
# an assistant, once argocd-apps-install has synced on the prod cluster:
#   1. argocd login <service>.<domain> --plaintext --grpc-web \
#        --username admin --password "$(kubectl --context the prod cluster -n argocd-apps \
#        get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 --decode)"
#      (--plaintext, not --insecure: server.insecure: true means argocd-server
#      speaks plain HTTP/gRPC, not TLS-with-an-untrusted-cert)
#   2. argocd account generate-token --account backstage --grpc-web
#   3. Plant the printed token into Infisical's `platform-cicd-<cluster>` project
#      under the key: backstage-argocd-prod-apps-token
#      (corrected 2026-09-23 - this comment previously said `platform-cicd-<cluster>`,
#      wrong even before the former management cluster was decommissioned; the former management cluster was never involved in
#      this cluster's own secret storage)
#
# Re-mint if the prod cluster's argocd-apps release is ever reinstalled from scratch (the
# account exists but carries no tokens until one is generated against it) - same
# live-verification discipline every other credential in this platform needs. This
# happened for real 2026-09-22: the prod cluster was decommissioned entirely and replaced by
# the prod cluster, a genuinely fresh ArgoCD install with no carried-over accounts/tokens -
# the old token failed live with "token signature is invalid" until re-minted per the
# steps above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-argocd-prod-apps-token
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-argocd-prod-apps-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: backstage-argocd-prod-apps-token
