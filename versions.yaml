# versions.yaml - the one place Apron pins Hangar's own products and the installs it renders. Bump a pin here after
# cutting the tag, then `apron render` every cluster repo. Defaults are what the lab clusters ran on 2026-10-17.
#
# The name-free Airframe and Glidepath changes (no hardcoded cluster names or owner) are on their
# no-hardcoded-cluster-names branches: cut new tags from them and set those tags here before rebuilding.
versions:
  airframe:
    catalog: v0.3.176 # 20-service-catalog/airframe-service-catalog: XRDs + Compositions. v0.3.172..v0.3.173 adds xrds/agentrepository.yaml + compositions/agentrepository (Autopilot M4) and a comment in xrds/agentrun.yaml; v0.3.173..v0.3.174 (airframe#145): the AgentRun Composition names the gateway autopilot-gateway (gateway_service, clearance_selector, model_proxy_selector); v0.3.174..v0.3.175 (airframe#150): the Dex XRD gains spec.checkRide; v0.3.175..v0.3.176 (airframe#149): the SLO composition scopes every query to the SLO's own namespace and refuses namespace/__name__ matchers
    clusterRegistry: v0.3.154 # 00-bootstrap/cluster-registry: charts/cluster-registry
    analysisCatalog: v0.3.135 # 20-service-catalog/analysis-catalog: ClusterAnalysisTemplates
    defaultChart: v0.3.173 # cluster-defaults.yaml defaultChart: the app chart every environment renders
  # Clearance (55-clearance): the chart from oci://ghcr.io/jfillman/charts, and the image index it runs (the chart's
  # default tag pinned by digest). Cut by the clearance release workflow; bump both together.
  clearance:
    chart: 0.57.0
    imageDigest: sha256:a901af81199f5c1b6801cc30771a2d9aad308d6d40171299b9be4626ecd204c8
    # The Argo CD gate's images (clearance.gate.enabled; G-ARGO-4/5): ghcr.io/<owner>/clearance-cmp and clearance-wait
    # by digest, first published by clearance v0.33.0. Used only where clearance.gate.enabled.
    cmpImage: ghcr.io/jfillman/clearance-cmp@sha256:bd7154a2480e7d2be5109f197a82d8be7826f873d5e11a594a40b0d7e24347f3
    waitImage: ghcr.io/jfillman/clearance-wait@sha256:9f8d29c7ce9fcfa2ba8580c8e0e091a4cd0f3aacfb11c59d5865b383648c8c37
    # One release only (remove at the next wait-image change): the v0.56.0 wait image, admitted beside waitImage by the gate policy's
    # wait-Job exemption and Flight admission's allow-list, so a held release whose wait Job still runs it stays admitted.
    previousWaitImage: ghcr.io/jfillman/clearance-wait@sha256:36a55f14f2abb8febdef0cce42dc5a85f54a8f6b02a2f559b15a1bb71a42cf1e
    # The Argo CD agent (G-ARGO-3): image and chart, for the protected cluster (hangar-prod).
    argocdAgentImage: ghcr.io/jfillman/clearance-argocd-agent@sha256:ab32b20e5899e57d260bf2fb1e7b690f233accdde9092ef25ca290605fce16f9
    argocdAgentChart: 0.57.0
    # The Slack service (clearance.slack.enabled; clearance chart slack.*, first in clearance v0.47.1): ghcr.io/jfillman/clearance-slack by
    # digest (v0.57.0's index). Needs versions.clearance.chart 0.47.1 or later, which `apron check` says.
    slackImageDigest: sha256:44f6663d6092b753656ffa07810b8c7415ed15f5375cb394c41e114b5fe0d898
    # The Kubernetes audit collector (O-3; clearance.observe.enabled), first published by clearance v0.38.0.
    observeK8sImage: ghcr.io/jfillman/clearance-observe-k8s@sha256:c2bb43e545456303d61912f37859b8cebbd74a2a8df518ec20c7888d67f627c1
    observeK8sChart: 0.57.0
    # The AWS collector (clearance.observeAWS.enabled), first published by clearance v0.39.2; 0.39.3 renders its own rule set.
    observeAWSImage: ghcr.io/jfillman/clearance-observe-aws@sha256:9955490fa708c1990ebb37deff7a4bd34d7e82f27d36f2a206fcfa40600522c6
    observeAWSChart: 0.57.0
    # The ledger witness (C-3; clearance.witness.enabled): ghcr.io/<owner>/clearance-witness by digest, first published by
    # clearance v0.36.0. Rendered as plain manifests (templates/56-clearance-witness): its chart is not published.
    witnessImage: ghcr.io/jfillman/clearance-witness@sha256:1c05537a68cdbbdf83af8d07e28e9fcb23d3a2a4c31af6d9e46331da9f6692d2
  # Autopilot: the gateway image's tag, named as the registered provider's version in Clearance's providers list.
  autopilot:
    gateway: gateway-v0.8.0
  glidepath: main # 50-glidepath: control plane, catalog, Rekor values (a tag once one is cut)
  # The per-task accounts of Glidepath's run admission (glidepath-control-plane values cicdRunAdmission.sourceTasks, pusherTasks,
  # cloudDeployerTasks), which glidepath-api's PipelineRun policy (30-policy/kyverno-policies/tower-identity-writes.yaml) must
  # allow and require exactly. Bump them with the glidepath pin above: `apron render` compares them with the pinned Glidepath's
  # values.yaml and refuses a render when they differ (hack/glidepath_tasks.py; APRON_GLIDEPATH_VALUES=<values.yaml> to compare
  # with a local file, APRON_GLIDEPATH_CHECK=off to skip).
  glidepathRunTasks:
    sourceTasks: {build: [build-source, unit-test, build-image, build-python-wheel-artifact, build-go-binary-artifact], test: [run-integration-script], policy-validation-check: [render], clearance-gate-check: [render], values-check: [render]}
    pusherTasks: {build: [push-image]}
    cloudDeployerTasks: {deploy: [deploy-aws-lambda, deploy-aws-ecs]}
    # Pipeline trust T4 split accounts (release-record-writer, clearance-gate, test-runner), mapped by glidepath step 3.
    recordWriterTasks: {bypass-merge-check: [mark-release-merged, itsm-implement], clearance-gate-check: [join-release], itsm-check: [verify-change, verify-change-advisory], release: [open-release-pr], release-outcome-notify: [itsm-close], release-rollback-notify: [itsm-close-rolled-back]}
    clearanceTasks: {agent-definitions-check: [review], agent-gates-check: [agent-gates], agent-release: [release], clearance-gate-check: [fetch, register, register-advisory, render-check]}
    testRunnerTasks: {test: [run-testworkflow]}
  argocdChart: 10.3.2 # argo-cd chart for the second instance (argocd-apps); the first instance is the
  # vendored 01-argocd-platform/install.yaml (Argo CD v3.5.0)
  # trust-manager (components.trustManager, 10-crds-operators/trust-manager; A-19): jetstack's chart and its image index by digest
  # (quay.io/jetstack/trust-manager:<chart>, an OCI index for linux/amd64, arm64, arm, ppc64le and s390x). The image tag is the
  # chart version (the chart's appVersion). Its Bundle API is trust.cert-manager.io/v1alpha1 (the chart's only CRD).
  trustManager:
    chart: v0.26.0
    imageDigest: sha256:783afe31d39f122a811b96ac3aedab9f358488088df21622ae5b057b4a38b5c2
infisical:
  nodePort: 31800 # the Infisical host's NodePort, how other clusters reach it
  bootstrapImageTag: "0.43.99-arm64" # autoBootstrap Job image; arm64 nodes need the -arm64 tag (see the template)
