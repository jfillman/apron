# Generated by apron hack/cluster-identity.sh render from components.clusterIdentity.trust.
# Installed on the control-plane node as /etc/kubernetes/authn/config.yaml (hack/cluster-identity.sh trust,
# or kind-patch at create time). The API server reloads it on change. Not an Argo CD manifest.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
- issuer:
    url: @@TOWER_ISSUER@@
    audiences:
    - @@CLUSTER_NAME@@
  claimValidationRules:
  # Who on @@TOWER_CLUSTER@@ may present a token here: Tower's two ServiceAccounts, and, on a hub that receives its
  # trace metrics (observability.receive), its Prometheus - which can only reach the Thanos Receive service proxy
  # (40-observability/thanos-receive-access).
  - expression: >-
      (claims["kubernetes.io"].namespace == "@@TOWER_NAMESPACE@@"
      && claims["kubernetes.io"].serviceaccount.name in ["backstage-ingestor", "tower-actor"])
#@if components.observability and observability.full and observability.receive and tower.cluster
      || (claims["kubernetes.io"].namespace == "observability"
      && claims["kubernetes.io"].serviceaccount.name == "kube-prometheus-stack-prometheus")
#@end
    message: only @@TOWER_CLUSTER@@'s listed ServiceAccounts
  - expression: int(claims.exp) - int(claims.iat) <= 600
    message: tokens longer than 600s are refused
  claimMappings:
    username:
      expression: '"hangar:@@TOWER_CLUSTER@@:" + claims["kubernetes.io"].serviceaccount.name'
    groups:
      expression: '["hangar:@@TOWER_CLUSTER@@"]'
    uid:
      expression: claims.sub
    extra:
    - key: hangar.io/pod
      valueExpression: 'has(claims["kubernetes.io"].pod) ? claims["kubernetes.io"].pod.name : ""'
  userValidationRules:
  - expression: '!user.username.startsWith("system:")'
    message: reserved prefix
