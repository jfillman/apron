# One per-app AppProject (gitops-strategy.md §6), generated from
# gitops-cluster-dev-tenants/tenants/<app>/identity.yaml - deliberately the COARSER of
# the two tenant-onboarding ApplicationSets (one entry per app, not per app+env), since
# an app's AppProject is shared across every env it has on this cluster; generating it
# from the finer-grained per-env <app>/<env>/identity.yaml files instead would produce N
# conflicting ApplicationSet entries all trying to own the same AppProject name.
#
# Reads tenants/*/identity.yaml, not tenants/*/app.yaml (changed 2026-08-18) - this
# ApplicationSet used to be the one consumer of a separate app.yaml file that sat right
# next to identity.yaml in the same tenant directory, "almost identical, one a subset of
# the other." Consolidated onto the one file platform-cicd's own tenant-onboarding
# ApplicationSet already reads (charts/platform-cicd-control-plane/templates/argocd/
# tenant-onboarding-applicationset.yaml in platform-cicd.git) - both ApplicationSets now
# key off the SAME tenants/<app>/identity.yaml commit, nested under platformIdentity:,
# instead of two near-duplicate files with subtly different field sets AND (until this
# same change) different URL conventions. See idp-service-catalog's
# compositions/nodejsapplication/templates/render-github-resources/
# cicd-identity-yaml.yaml for the full history, including the real PaC-matching bug
# that made a naive merge unsafe until gitopsRepoUrl/appRepoUrl dropped their .git
# suffix everywhere, not just here.
#
# ApplicationSet can only generate Application objects, not arbitrary resource kinds -
# there's no native "AppProjectSet" generator. The workaround here (same shape used
# elsewhere in the ArgoCD ecosystem for this exact gap): generate an Application per
# app whose only job is to render ./chart's templates, values-driven.
#
# ./chart now renders THREE objects, not one (gitops-strategy.md §10, added
# 2026-08-16): the original per-app AppProject (appproject.yaml, upper-env scoped),
# a second narrower AppProject (appproject-lower.yaml, dev-cluster-only self-service
# lower envs), and a per-app ApplicationSet (lower-envs-applicationset.yaml) whose own
# git generator watches THIS app's own src repo (appRepoUrl, not this repo) for
# platform/envs/*.yaml - the only way to fan out to N different apps' own repos, since
# a single git-files generator can only ever have one static repoURL. See that
# template's own header for why it (unlike this file) DOES need {{ }}-vs-Helm-template
# escaping - it emits ArgoCD goTemplate syntax of its OWN, one Helm-render layer
# beneath this file's plain-YAML ApplicationSet.
#
# appRepoUrl added to valuesObject below 2026-08-16 - already present in every
# tenants/<app>/app.yaml (NodeJSApplication's own Composition writes it), just
# unused by this chart until the lower-env tier needed it.
#
# No {{ }}-vs-Helm-template escaping needed in THIS file (unlike platform-cicd's
# chart-embedded tenant-onboarding-applicationset.yaml) - this repo's manifests are
# plain YAML, never passed through Helm themselves, so ArgoCD's own goTemplate syntax
# below is written directly, no double-escaping.
#
# template.metadata.name renamed <app>-appproject -> <app>-onboarding, 2026-08-16 -
# "appproject" undersold what this renders once it's THREE objects, not one (see above).
# Live-verified safe: the per-env Applications (<app>-dev) and the lower-envs
# ApplicationSet kept their original UIDs throughout (never recreated). One real gotcha
# hit along the way, not anticipated: an omitted or explicit-empty template.metadata.
# finalizers doesn't stick - ArgoCD's ApplicationSet controller re-adds
# resources-finalizer.argocd.argoproj.io to already-generated Applications within ~1s
# regardless. The actual lever for "don't cascade-delete children when the old name
# drops out of the generated set" is spec.syncPolicy.preserveResourcesOnDeletion (a
# top-level ApplicationSet field, applied+removed for this migration only - see git
# history). Even with that set, the two AppProjects per tenant (not the ApplicationSet)
# still got recreated (new UID) - never fully root-caused, best guess is a delete queued
# during the finalizer back-and-forth before the corrected fix landed. No lasting damage
# since AppProjects are referenced by name, not UID, and nothing else in this file's
# blast radius has an ownerReference into them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-appprojects
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: tenant-onboarding
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: https://github.com/jfillman/gitops-cluster-dev-tenants.git
        revision: main
        files:
          - path: "tenants/*/identity.yaml"
  template:
    metadata:
      name: "{{.platformIdentity.appName}}-onboarding"
      labels:
        hangar.io/component: cluster-config
        hangar.io/subcomponent: tenant-onboarding
        hangar.io/app: "{{.platformIdentity.appName}}"
      # Cascade-deletes the AppProject if a tenant's identity.yaml is ever removed -
      # same finalizer/reasoning as platform-cicd's own tenant-onboarding-applicationset.yaml.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd-apps
    spec:
      project: default
      source:
        repoURL: https://github.com/jfillman/gitops-cluster-dev.git
        targetRevision: main
        path: 02-argocd-apps/tenant-appprojects/chart
        helm:
          valuesObject:
            appName: "{{.platformIdentity.appName}}"
            gitopsRepoUrl: "{{.platformIdentity.gitopsRepoUrl}}"
            appRepoUrl: "{{.platformIdentity.appRepoUrl}}"
            idpServiceCatalogRepoUrl: "https://github.com/jfillman/airframe.git"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd-apps
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
