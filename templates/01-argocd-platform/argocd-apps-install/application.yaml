# gitops-strategy.md §2/§4: the app-owner-facing ArgoCD instance, installed and owned
# by argocd-platform (this Application lives in argocd-platform's own `argocd`
# namespace - it's the installer, not the thing being installed). "Let ArgoCD manage
# ArgoCD" applied to the SECOND instance rather than the first: the first instance's own
# self-management (vendoring 01-argocd-platform/install.yaml into a self-referential
# Application) stays deliberately deferred - see that directory's own README - real
# bootstrap-ordering risk if that goes wrong takes down the only thing running this
# repo's own sync. Standing up argocd-apps fresh via a normal Application carries none of
# that risk: it's a brand-new instance with zero live workload on it yet.
#
# Chart version 10.2.1 (appVersion v3.4.5) deliberately matches the exact version
# already running on the dev cluster's platform instance (confirmed live via
# `kubectl get deployment argocd-server -n argocd -o jsonpath='{.spec.template.spec.
# containers[0].image}'`), not the newer 10.3.2/v3.5.0 bootstrap-upper-cluster.sh uses
# for the prod cluster's single-instance install - both instances on THIS cluster share the
# same CRDs (installed once, cluster-wide, by 01-argocd-platform/install.yaml's own
# v3.4.5-pinned manifest), so keeping both ArgoCD versions identical avoids any
# controller/CRD-schema skew risk between them.
#
# crds.install: false - the CRDs are already cluster-wide from 01-argocd-platform's own
# install.yaml; a second Helm-managed CRD install would fight over ownership of the same
# CustomResourceDefinition objects.
#
# configs.params."reposerver.repo.cache.expiration": 3m - same fix 01-argocd-platform/
# install.yaml's own argocd-cmd-params-cm already carries (found live chasing the
# xr-requests/ deadlock), applied here too after hitting the identical symptom live on
# THIS instance: checkout-api-dev's Application reported Synced immediately after a
# platform/envs/dev.yaml commit, but the live Rollout still ran the previous image until
# a manual hard-refresh busted the stale cached manifest render. The two instances don't
# share a repo-server, so patching one never fixed the other - each needs its own.
#
# application.namespaces / applicationsetcontroller.namespaces: scoped to the *-cicd glob
# (2026-08-24) so THIS instance's Application/ApplicationSet controllers reconcile
# platform-cicd-app's ephemeral-envs.yaml (the pr-envs ApplicationSet and its generated
# per-PR Applications, which live in each tenant's own -cicd namespace rather than
# argocd-apps's own) - matches this instance's stated role (gitops-strategy.md §2:
# "argocd-apps ... watches per-app Applications generated by an ApplicationSet"), since
# PR-based ephemeral environments are app-owner/PR-driven, not cluster-admin work.
# Initially built on argocd-platform instead (2026-08-23) since that instance already
# fully owns the `-cicd` namespace class; moved here once it was clear nothing else on
# argocd-platform needed the wider watch (see 01-argocd-platform/install.yaml's own
# comment) and that per gitops-strategy.md §2 this was always argocd-apps's job.
#
# This is still a narrower opt-in than it looks: ArgoCD's stock default (no
# application.namespaces configured) scopes an instance's controllers to objects
# physically inside its OWN release namespace only - that default is what keeps
# argocd-platform and argocd-apps from seeing or reconciling each other's objects without
# one of them opting in. Widening argocd-apps's watch to `*-cicd` doesn't cross into
# argocd-platform's territory (argocd-platform doesn't watch `*-cicd` at all any more) or
# grant any new capability beyond reconciling this one already-scoped ApplicationSet kind.
#
# applicationsetcontroller.enable.tokenref.strict.mode: required once an ApplicationSet
# generator's tokenRef Secret (see ephemeral-envs.yaml's pr-generator-token) can live
# outside argocd-apps - without strict mode a generator could read ANY Secret in its own
# namespace, not just ones meant for it. Requires the referenced Secret to carry
# `argocd.argoproj.io/secret-type: scm-creds` (set by ephemeral-envs.yaml's
# pr-token-refresher CronJob at creation time).
#
# applicationsetcontroller.allowed.scm.providers: applicationsetcontroller.namespaces set
# to anything requires either --enable-scm-providers=false or --allowed-scm-providers, or
# the controller refuses to start at all. ephemeral-envs.yaml's pr-envs ApplicationSet
# uses a pullRequest/github SCM generator, so providers can't just be disabled outright -
# scoped to GitHub's API instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps-install
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-apps
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: @@ARGOCD_CHART_VERSION@@
    helm:
      releaseName: argocd-apps
      valuesObject:
        crds:
          install: false
        dex:
          enabled: false
        # Chart-level flag, separate from the raw configs.params.applicationsetcontroller.
        # namespaces key below - that key alone only tells the controller WHICH namespaces
        # to watch; it does not grant the RBAC needed to do it. Without this, the
        # applicationset-controller's own Role stays namespace-scoped (no ClusterRole/
        # ClusterRoleBinding rendered at all) and it fails outright trying to list
        # Applications across the *-cicd glob: "applications.argoproj.io is forbidden:
        # ... cannot list resource \"applications\" in API group \"argoproj.io\" at the
        # cluster scope" (found live 2026-08-24 moving ephemeral-envs.yaml's watch here).
#@if not isControlPlane
        notifications:
          notifiers:
            service.webhook.glidepath-relay: |
              url: @@RELAY_URL@@
              headers:
              - name: Authorization
                value: Bearer $relay-token
              - name: Content-Type
                value: application/json
          templates:
            template.sync-fact: |
              webhook:
                glidepath-relay:
                  method: POST
                  path: /argocd/@@CLUSTER_NAME@@
                  body: |
                    {"source":"argocd","name":{{toJson .app.metadata.name}},"app":{{toJson (index .app.metadata.labels "hangar.io/app")}},"env":{{toJson (index .app.metadata.labels "hangar.io/env")}},"phase":{{toJson .app.status.operationState.phase}},"retryCount":{{toJson .app.status.operationState.retryCount}},"message":{{toJson .app.status.operationState.message}},"revision":{{toJson .app.status.sync.revision}},"finishedAt":{{toJson .app.status.operationState.finishedAt}}}
          triggers:
            trigger.on-sync-retrying: |
              - when: app.status.operationState != nil and app.status.operationState.phase == "Running" and app.status.operationState.retryCount > 0
                oncePer: string(app.status.operationState.retryCount)
                send: [sync-fact]
            trigger.on-sync-failed: |
              - when: app.status.operationState != nil and app.status.operationState.phase in ["Error", "Failed"]
                oncePer: app.status.operationState.finishedAt
                send: [sync-fact]
          subscriptions:
            - selector: hangar.io/subcomponent=tenant-onboarding
              triggers: [on-sync-retrying, on-sync-failed]
              recipients: ["glidepath-relay:"]
        crds:
          install: false
        dex:
          enabled: false
        # 2026-09-15: argocd-repo-server was found crash-looping live on
        # this cluster's OTHER ArgoCD instance (argocd-platform, the
        # install.yaml-managed one in the `argocd` namespace) - 265
        # restarts, a real sync failing mid-comparison with a plain
        # "connection refused" to its own :8081. Root cause looked like the
        # chart's own stock probe timeouts (both readinessProbe and
        # livenessProbe default to timeoutSeconds: 1 - confirmed via `helm
        # show values argo-cd/argo-cd --version 10.3.2` - far too tight for
        # a repo-server doing real git clone/manifest-render work
        # synchronously) getting a container that's just busy, not actually
        # unhealthy, killed mid-request. Applied here (argocd-apps, this
        # cluster's OTHER instance, also chart 10.3.2) preemptively for the
        # same reason 01-argocd-platform's own install.yaml pins chart
        # version/CRDs to match this instance - keep both instances'
        # operational posture consistent rather than only hardening
        # whichever one happened to be symptomatic first.
        repoServer:
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 15
            failureThreshold: 5
#@end
        repoServer:
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 15
            failureThreshold: 5
        # One controller block for every cluster (it used to sit twice inside the
        # not-isControlPlane branch only). GOMEMLIMIT + memory limit added 2026-10-28,
        # for the reason given at GOMEMLIMIT in 01-argocd-platform/install.yaml. This
        # instance ran at a 0.95 GB heap / 1.6 GB RSS on hangar-dev (23 apps).
        controller:
          env:
            - name: GOMEMLIMIT
              value: 1500MiB
          resources:
            requests:
              cpu: 150m
              memory: 500Mi
            limits:
              memory: 2560Mi
#@if isControlPlane
        applicationSet:
          allowAnyNamespace: true
#@end
        configs:
          params:
            # Added 2026-09-02: the kiac Gateway only has an HTTP/80 listener, no TLS
            # termination in front of this Service - argocd-server's stock default
            # (TLS on, HTTP redirected to HTTPS) meant argocd-apps-ui's HTTPRoute just
            # got a 307 back to a https:// URL the Gateway can't serve. Mirrored onto
            # 01-argocd-platform/install.yaml's own argocd-cmd-params-cm too.
            server.insecure: "true"
            reposerver.repo.cache.expiration: 3m
#@if isControlPlane
            application.namespaces: "*-cicd"
            applicationsetcontroller.namespaces: "*-cicd"
            applicationsetcontroller.enable.tokenref.strict.mode: "true"
            applicationsetcontroller.allowed.scm.providers: "https://api.@@SCM_HOST@@"
#@end
            applicationsetcontroller.enable.new.git.file.globbing: "true"
#@if argocd.light
            # argocd.light: the same as 01-argocd-platform/install.yaml's argocd-cmd-params-cm (see its argocd-cm).
            reposerver.parallelism.limit: "2"
            controller.status.processors: "10"
            controller.operation.processors: "5"
            controller.repo.server.timeout.seconds: "180"
#@end
          # Same health-check customizations as 01-argocd-platform/install.yaml's own
          # argocd-cm (see that ConfigMap's inline comments for rationale/sourcing) -
          # this instance is the one that actually owns the xr-requests-generated
          # Applications wrapping each onboarded app's XRs (checkout-api-xr-requests
          # etc.), so it's the argocd-cm that needs these, not the platform instance's.
          # Two separate ArgoCD installs, two separate ConfigMaps - confirmed live
          # 2026-08-18 chasing exactly this: patching the platform instance's argocd-cm
          # left these XRs' health at None, since this instance never reads that CM.
          cm:
            # Backstage's ArgoCD plugin (idp/docs/backstage-design.md plugin #1):
            # a dedicated local account, `apiKey` capability only (no `login` -
            # can't be used to sign into the UI/CLI with a password, only to hold
            # API tokens minted for it). Bound to the built-in `role:readonly` via
            # configs.rbac below. Token itself is never in git - see
            # the former management cluster's repo/60-backstage/backstage/
            # argocd-dev-apps-token-external-secret.yaml for the one-time manual
            # mint+Infisical-plant step, same "manual by design" posture as
            # backstage-ingestor-rbac's SA token
            # (00-bootstrap/backstage-ingestor-rbac/README.md).
            accounts.backstage: apiKey
#@if argocd.light
            # argocd.light: the same as 01-argocd-platform/install.yaml's argocd-cm.
            timeout.reconciliation: 600s
            timeout.reconciliation.jitter: 120s
#@end
            # resource.exclusions is a single string value: setting it replaces the chart's
            # default list, so the default list is repeated here in full (it is identical to
            # 01-argocd-platform/install.yaml's) and the Upbound block is appended, same as
            # the platform instance. Each instance has its own argocd-cm; both need it.
            resource.exclusions: |
              ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
              - apiGroups:
                - ''
                - discovery.k8s.io
                kinds:
                - Endpoints
                - EndpointSlice
              ### Internal Kubernetes resources excluded reduce the number of watched events
              - apiGroups:
                - coordination.k8s.io
                kinds:
                - Lease
              ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
              - apiGroups:
                - authentication.k8s.io
                - authorization.k8s.io
                kinds:
                - SelfSubjectReview
                - TokenReview
                - LocalSubjectAccessReview
                - SelfSubjectAccessReview
                - SelfSubjectRulesReview
                - SubjectAccessReview
              ### Intermediate Certificate Request excluded reduce the number of watched events
              - apiGroups:
                - certificates.k8s.io
                kinds:
                - CertificateSigningRequest
              - apiGroups:
                - cert-manager.io
                kinds:
                - CertificateRequest
              ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
              - apiGroups:
                - cilium.io
                kinds:
                - CiliumIdentity
                - CiliumEndpoint
                - CiliumEndpointSlice
              ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
              - apiGroups:
                - kyverno.io
                - reports.kyverno.io
                - wgpolicyk8s.io
                kinds:
                - PolicyReport
                - ClusterPolicyReport
                - EphemeralReport
                - ClusterEphemeralReport
                - AdmissionReport
                - ClusterAdmissionReport
                - BackgroundScanReport
                - ClusterBackgroundScanReport
                - UpdateRequest
              ### Crossplane managed resources (Upbound provider MRs) excluded: the compositions create them,
              ### no manifest in git ever does, and there are ~400 kinds (each v2 provider installs both its
              ### cluster-scoped and its namespaced CRDs). Both instances were opening an informer per kind,
              ### which is what tipped @@CLUSTER_NAME@@ over on 2026-10-08 (apiserver 7.5GB, etcd lease storms).
              ### Provider configs stay tracked on purpose: ClusterProviderConfig/ProviderConfig live in the
              ### family groups (aws.m.upbound.io, azure.upbound.io, ...), which the wildcard patterns do not
              ### match, and gitops applies them. Tower reads MRs with its own identity, not through Argo CD.
              - apiGroups:
                - '*.aws.upbound.io'
                - '*.aws.m.upbound.io'
                - '*.azure.upbound.io'
                - '*.azure.m.upbound.io'
                - '*.github.upbound.io'
                - '*.github.m.upbound.io'
                kinds:
                - '*'
              - apiGroups:
                - aws.upbound.io
                - aws.m.upbound.io
                - azure.upbound.io
                - azure.m.upbound.io
                - github.upbound.io
                - github.m.upbound.io
                kinds:
                - ProviderConfigUsage
                - ResourceGroup
                - ResourceProviderRegistration
                - Subscription
            resource.customizations.health.argoproj.io_Rollout: |
              function checkReplicasStatus(obj)
                local hs = {}
                local desiredReplicas = getNumberValueOrDefault(obj.spec.replicas, 1)
                statusReplicas = getNumberValueOrDefault(obj.status.replicas, 0)
                updatedReplicas = getNumberValueOrDefault(obj.status.updatedReplicas, 0)
                local availableReplicas = getNumberValueOrDefault(obj.status.availableReplicas, 0)

                if updatedReplicas < desiredReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: More replicas need to be updated"
                  return hs
                end
                if availableReplicas < updatedReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: updated replicas are still becoming available"
                  return hs
                end
                return nil
              end

              function getStableRS(obj)
                if obj.status.stableRS ~= nil then
                  return obj.status.stableRS
                end
                if obj.status.canary ~= nil then
                    return obj.status.canary.stableRS
                end
                return ""
              end

              function getNumberValueOrDefault(field, default)
                if field ~= nil then
                  return field
                end
                return default
              end

              function checkPaused(obj)
                local hs = {}
                hs.status = "Suspended"
                hs.message = "Rollout is paused"
                if obj.status.pauseConditions ~= nil and table.getn(obj.status.pauseConditions) > 0 then
                  return hs
                end

                if obj.spec.paused ~= nil and obj.spec.paused then
                  return hs
                end
                return nil
              end

              function isGenerationObserved(obj)
                if obj.status == nil then
                  return false
                end
                observedGeneration = tonumber(obj.status.observedGeneration)
                if observedGeneration == nil or observedGeneration > obj.metadata.generation then
                  return true
                end
                return observedGeneration == obj.metadata.generation
              end

              function isWorkloadGenerationObserved(obj)
                if obj.spec.workloadRef == nil or obj.metadata.annotations == nil then
                  return true
                end
                local workloadGen = tonumber(obj.metadata.annotations["rollout.argoproj.io/workload-generation"])
                local observedWorkloadGen = tonumber(obj.status.workloadObservedGeneration)
                return workloadGen == observedWorkloadGen
              end

              local hs = {}
              if not isGenerationObserved(obj) or not isWorkloadGenerationObserved(obj) then
                hs.status = "Progressing"
                hs.message = "Waiting for rollout spec update to be observed"
                return hs
              end

              if obj.status.phase ~= nil then
                if obj.status.phase == "Paused" then
                  hs.status = "Suspended"
                else
                  hs.status = obj.status.phase
                end
                hs.message = obj.status.message
                return hs
              end

              for _, condition in ipairs(obj.status.conditions) do
                if condition.type == "InvalidSpec" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
                if condition.type == "Progressing" and condition.reason == "RolloutAborted" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
                if condition.type == "Progressing" and condition.reason == "ProgressDeadlineExceeded" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
              end

              local isPaused = checkPaused(obj)
              if isPaused ~= nil then
                return isPaused
              end

              if obj.status.currentPodHash == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for rollout to finish: status has not been reconciled."
                return hs
              end

              replicasHS = checkReplicasStatus(obj)
              if replicasHS ~= nil then
                return replicasHS
              end

              local stableRS = getStableRS(obj)

              if obj.spec.strategy.blueGreen ~= nil then
                if obj.status.blueGreen == nil or obj.status.blueGreen.activeSelector ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "active service cutover pending"
                  return hs
                end
                if stableRS ~= "" and stableRS ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "waiting for analysis to complete"
                  return hs
                end
              elseif obj.spec.strategy.canary ~= nil then
                if statusReplicas > updatedReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: old replicas are pending termination"
                  return hs
                end
                if stableRS == "" or stableRS ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "Waiting for rollout to finish steps"
                  return hs
                end
              end

              hs.status = "Healthy"
              hs.message = ""
              return hs
            # Same PVC-health override, and same rationale, as 01-argocd-platform/
            # install.yaml's own argocd-cm - see that ConfigMap's inline comment (right
            # above this same key) for the full write-up. Two separate ArgoCD installs,
            # two separate ConfigMaps (see this file's own comment above
            # accounts.backstage/resource.customizations.health.argoproj.io_Rollout for
            # why both need every override independently), so this one needs it too
            # rather than assuming the platform instance's copy is enough.
            resource.customizations.health.PersistentVolumeClaim: |
              hs = {}
              hs.status = "Healthy"
              hs.message = "Not tracking Bound status - WaitForFirstConsumer PVCs stay Pending until first real consumer schedules, which is expected, not a failure (see comment above this key in argocd-cm)."
              return hs
            # ExternalSecret health check (added 2026-09-14): without this, ArgoCD
            # treats any external-secrets.io/ExternalSecret as "Healthy" the instant
            # the object itself applies - it has no built-in awareness that ESO's own
            # reconcile into a real Secret is a separate, asynchronous step. That gap
            # deadlocked a brand-new env's PreSync outcome-hook Job on the prod cluster
            # (airframe's relay-token-external-secret.yaml, confirmed live): wave-
            # ordering alone got the ExternalSecret object created first, but the next
            # wave's Job still started before ESO had actually populated the Secret.
            # Standard ESO status.conditions[].type == "Ready" check, same
            # Synced/Ready-condition shape as catalog.hangar.io/*'s own health.lua below,
            # just a single specific Kind via the flat resource.customizations.health.
            # key form (like PersistentVolumeClaim above) rather than that block's
            # nested per-group form.
            resource.customizations.health.external-secrets.io_ExternalSecret: |
              hs = {}
              if obj.status ~= nil and obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" then
                    if condition.status == "True" then
                      hs.status = "Healthy"
                      hs.message = condition.message or condition.reason or "Ready"
                    else
                      hs.status = "Degraded"
                      hs.message = condition.message or condition.reason or "Not ready"
                    end
                    return hs
                  end
                end
              end
              hs.status = "Progressing"
              hs.message = "Waiting for ExternalSecret to sync"
              return hs
            resource.customizations: |
              catalog.hangar.io/*:
                health.lua: |
                  health_status = {}
                  if obj.status == nil or obj.status.conditions == nil then
                    health_status.status = "Progressing"
                    health_status.message = "Waiting for status.conditions to be reported"
                    return health_status
                  end
                  local synced = nil
                  local ready = nil
                  for _, condition in ipairs(obj.status.conditions) do
                    if condition.type == "Synced" then
                      synced = condition
                    elseif condition.type == "Ready" then
                      ready = condition
                    end
                  end
                  if synced ~= nil and synced.status == "False" then
                    health_status.status = "Degraded"
                    health_status.message = synced.message or synced.reason or "Not synced"
                    return health_status
                  end
                  if ready ~= nil then
                    if ready.status == "True" then
                      health_status.status = "Healthy"
                      health_status.message = ready.message or ready.reason or "Ready"
                    else
                      health_status.status = "Progressing"
                      health_status.message = ready.message or ready.reason or "Not ready"
                    end
                    return health_status
                  end
                  health_status.status = "Progressing"
                  health_status.message = "No Ready condition yet"
                  return health_status
          rbac:
            # Binds the `backstage` account above to ArgoCD's own built-in
            # read-only role - get/list on every resource in every project,
            # no write verbs. Same scope-minimization principle as every other
            # cross-cluster credential this platform delivers to Backstage
            # (idp/docs/backstage-design.md "Credentials").
            #
            # role:tower-sync (2026-09-14, HANDOFF-tower-write-actions.md
            # Tier 1) adds exactly one write action - `sync` - on top of that,
            # bound to the SAME `backstage` account rather than a second
            # identity/token: no prune, no force (those stay deferred pending
            # this platform's not-yet-built authorization model - see the
            # handoff's per-action verdict table), and Refresh needs no policy
            # line at all here since it piggybacks on the `get` action
            # role:readonly already grants (confirmed against ArgoCD's own
            # API: GET .../applications/{name}?refresh=normal triggers
            # reconciliation as a side effect of a plain read).
            #
            # role:tower-rollout (2026-10-10, glidepath ADR-0021 phase 4) adds Argo CD's built-in Rollout
            # resource actions (abort, pause, resume, promote-full, retry, restart, skip-current-step) for
            # Tower's Rollout controls. Delegated: Argo CD runs the action and checks the Rollout belongs to the
            # Application; Tower holds no Kubernetes RBAC for it. Who may run which action on which app is
            # decided in Backstage (towerPermissions.ts: owning team only; on Flight, promote-full and
            # skip-current-step are audited and announced as a bypass), which is now the authorization model
            # the notes above were waiting for.
            #
            # Narrowed 2026-10-10 (Tower authorization review follow-up): Tower's writes reach app environment
            # Applications only, never the platform projects this instance also holds - `default` (the
            # *-onboarding and *-appproject Applications) and `airframe-onboarding` (*-xr-requests). A deny wins over
            # the allow in Argo CD RBAC, so these stay out whatever the app projects are named (<app>-lower on a
            # Ground cluster, <app> on a Flight one). Terminate and Force sync use the same `sync` action, and
            # Backstage decides who may run each (towerPermissions.ts).
            #
            # role:tower-pod (2026-10-10): Tower's Restart pod deletes one pod through Argo CD (its ReplicaSet
            # replaces it). Fine-grained `delete//Pod/*` (core group, kind Pod, any name): pods only - never a
            # Deployment, Service or the Application. Backstage refuses the last ready pod on Flight, since a delete
            # skips the PodDisruptionBudget (backstage podRestart.ts).
            policy.csv: |
              p, role:tower-sync, applications, sync, */*, allow
              p, role:tower-sync, applications, sync, default/*, deny
              p, role:tower-sync, applications, sync, airframe-onboarding/*, deny
              p, role:tower-rollout, applications, action/argoproj.io/Rollout/*, */*, allow
              p, role:tower-rollout, applications, action/argoproj.io/Rollout/*, default/*, deny
              p, role:tower-rollout, applications, action/argoproj.io/Rollout/*, airframe-onboarding/*, deny
              p, role:tower-pod, applications, delete//Pod/*, */*, allow
              p, role:tower-pod, applications, delete//Pod/*, default/*, deny
              p, role:tower-pod, applications, delete//Pod/*, airframe-onboarding/*, deny
              g, backstage, role:readonly
              g, backstage, role:tower-sync
              g, backstage, role:tower-rollout
              g, backstage, role:tower-pod
        server:
          # Argo Rollouts UI extension: renders the canary/blue-green step timeline
          # inside an Application's resource tree in the web UI. v0.3.7 pinned (not
          # latest v0.4.0) because v0.4.0 externalizes react-dom for React 19, which
          # matches ArgoCD v3.5+'s UI - this instance runs chart 10.2.1 / appVersion
          # v3.4.5, still on React 18.
          extensions:
            enabled: true
            extensionList:
              - name: rollout-extension
                env:
                  - name: EXTENSION_URL
                    value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-apps
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
