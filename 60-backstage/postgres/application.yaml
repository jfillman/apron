# Backstage's dedicated Postgres - see this directory's own README for why a bundled
# instance now rather than waiting on the not-yet-built shared `Database` XRD
# (idp/docs/service-catalog-design.md Item 7).
#
# oci://registry-1.docker.io/bitnamicharts/postgresql, pinned 18.8.13 (confirmed live
# via `helm pull` 2026-08-26 - Bitnami's classic charts.bitnami.com index is
# deprecated, OCI is the only real distribution channel now).
#
# repoURL is the registry+repository WITHOUT the chart name (`.../bitnamicharts`, not
# `.../bitnamicharts/postgresql`) - ArgoCD's OCI Helm source appends `chart:` onto
# `repoURL` itself, so including the chart name in both produced a real, live 401
# (`bitnamicharts/postgresql/postgresql` - doubled segment, not an auth problem despite
# the "unauthorized" wording) the first time this synced on kind-man, 2026-08-26. This
# is this fleet's first Application using an OCI Helm source at all - the platform's
# existing OCI-chart usage (idp/docs's own OCI chart investigation session) is a
# different, already-reverted ApplicationSet path, not this pattern.
#
# auth.existingSecret: confirmed via this chart's own values.yaml documentation that
# setting this makes postgresPassword/password/replicationPassword genuinely ignored,
# read from the Secret instead - unlike Infisical's own install (see
# 10-crds-operators/infisical/application.yaml's header), where that chart's own app
# container reads .Values.postgresql.auth.password directly regardless of
# existingSecret, a real bug in that specific chart. No plaintext credential in this
# file. NOT yet verified: exactly how Backstage's own backend.database config will be
# pointed at this same Secret (postgres-password/password keys) - that's real work for
# whenever the backstage/ Application in this same directory gets written, once the
# app image exists (see this directory's own README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-postgres
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: backstage
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: postgresql
    targetRevision: 18.8.13
    helm:
      releaseName: backstage-postgres
      valuesObject:
        architecture: standalone
        auth:
          existingSecret: backstage-postgres-credentials
          username: backstage
          database: backstage
        primary:
          persistence:
            size: 8Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
