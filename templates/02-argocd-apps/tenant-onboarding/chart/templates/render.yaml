{{- $c := required "defaultChart must be set (cluster-defaults.yaml)" .Values.defaultChart -}}
{{- .Files.Get "applicationset.tmpl.yaml"
  | replace "__DEFAULT_CHART_REPO_URL__" (required "defaultChart.repoURL" $c.repoURL)
  | replace "__DEFAULT_CHART_PATH__" (required "defaultChart.path" $c.path)
  | replace "__DEFAULT_CHART_TARGET_REVISION__" (required "defaultChart.targetRevision" $c.targetRevision)
  | replace "__OBS_NAMESPACE__" (dig "namespace" "" (.Values.observability | default dict))
  | replace "__OBS_INSTRUMENTATION__" (dig "instrumentation" "" (.Values.observability | default dict)) }}
