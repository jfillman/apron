# Crossplane Provider package. Rendered as a plain manifest (not a Helm chart) via
# the crossplane-packages Application's directory source — see
# packages-application.yaml. Pinned to the exact package reference already installed
# (`kubectl get providers.pkg.crossplane.io`).
#
# Split out of a combined providers.yaml (2026-08-19) so hack/customize-cluster.sh can
# include/exclude provider-github.yaml (this same directory) independently per
# components.crossplane.providerGithub — a single multi-doc file couldn't be pruned by
# file deletion alone.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v1.2.1
