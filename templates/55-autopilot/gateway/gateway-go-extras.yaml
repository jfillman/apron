# What only the Go gateway adds (rendered with gateway-go.yaml and autopilot-api-go.yaml when cluster.yaml says
# `autopilot.gateway.implementation: go`; none of it exists on the Python path).
#
#   1. RBAC: `get` on namespaces, cluster-wide: the Go gateway reads a run's or app's namespace to bind it to its app
#      (the `hangar.io/app` label) and fails closed without it. The Python gateway never did. The rest of its access is the Python
#      gateway's, in identity.yaml (the same ServiceAccount): TokenReview, the airframe reader, AgentRuns, argo-sync.
#      Known, left for a decision: it still rides the cluster-wide list on every catalog.hangar.io kind that identity.yaml grants;
#      a Role per autopilot.gateway.go.agentXRs.namespaces entry is the least-privilege shape (docs/admin/go-gateway-release.md).
#   Also rendered with the Go gateway: gateway-go-egress.yaml (egress policies; off with autopilot.gateway.go.egress.enabled: false) and
#   gateway-go-migrate.yaml (the migrate Job; on only with autopilot.gateway.go.migrateJob).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autopilot-gateway-namespace-reader
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autopilot-gateway-namespace-reader
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autopilot-gateway-namespace-reader
subjects:
  - kind: ServiceAccount
    name: autopilot-gateway
    namespace: autopilot-system
