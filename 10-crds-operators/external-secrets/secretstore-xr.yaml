# secretstore-xr.yaml
#
# This cluster's own platform-cicd Infisical project (the one platform-secret-store,
# cluster-secret-store.yaml in this directory, reads), provisioned by airframe's SecretStore
# Composition through provider-infisical. It replaces the InfisicalProject CR
# (infisical-project.yaml, removed) that the retired infisical-secretstore-operator used to
# reconcile.
#
# What the Composition creates in this namespace: the Infisical project + `shared`
# environment, a NEW machine identity with universal auth, and the credentials Secret
# platform-cicd-kind-prod-infisical-creds (<appRef.name>-<cluster>-infisical-creds) that
# platform-secret-store reads. It also composes a ClusterSecretStore named after the slug,
# scoped to ^app-platform-cicd-.*$ - it matches no namespace and is unused.
#
# Needs, in this order (none of it is applied by this file):
#  1. airframe's SecretStore XRD + Composition at v0.3.81 or later (20-service-catalog/ pins
#     it; earlier tags still render the retired operator's InfisicalProject CR).
#  2. provider-infisical Healthy, with a ClusterProviderConfig whose credential Secret
#     (crossplane-system/provider-infisical-creds) was created BY HAND - see
#     10-crds-operators/crossplane/provider-infisical-config.yaml.
#  3. provider-kubernetes (the Composition wraps the credentials Secret and the store in
#     provider-kubernetes Objects).
#
# Remote-consumer clusters only (components.secrets.infisicalHost: false) -
# hack/customize-cluster.sh prunes this file on the Infisical host cluster, whose platform
# project is provisioned by platform-cicd's own control-plane chart instead.
#
# slug = <appRef.name>-<cluster>: with appRef `platform-cicd` and this cluster's name, that
# is platform-cicd-<cluster> - the project slug cluster-secret-store.yaml's secretsScope
# names. If a project with that slug ALREADY exists in Infisical (a rebuilt cluster), a new
# XR would collide with it: adopt it instead through airframe's secretstore-provisioner
# ConfigMap (compositions/secretstore/example/secretstore-provisioner.yaml) - and note that
# the provider's identity must be an admin member of that project first.
#
# The Composition hardcodes the Infisical ORGANIZATION id of the shared instance. That is
# correct for any cluster using the fleet's one Infisical; it is wrong for a cluster that
# brings its own separate Infisical instance.
apiVersion: catalog.idp.io/v1alpha1
kind: SecretStore
metadata:
  name: platform-cicd-kind-prod
  namespace: platform-secrets
  labels:
    hangar.io/subcomponent: "secretstore"
spec:
  appRef:
    name: platform-cicd
  cluster: kind-prod
  environmentSlug: shared
