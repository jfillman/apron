# Performance panel, the canary AnalysisRun charts and the SLO views all query
# kube-prometheus-stack through the kubernetes-plugin's `services/proxy` route on
# the env's own cluster. Confirmed live: from Backstage's pod (the prod cluster) this
# cluster answered /version but 403'd the Prometheus proxy - "services
# kube-prometheus-stack-prometheus:9090 is forbidden" - while the prod cluster's own copy
# of this exact grant (the prod cluster's repo/60-backstage/backstage/rbac.yaml)
