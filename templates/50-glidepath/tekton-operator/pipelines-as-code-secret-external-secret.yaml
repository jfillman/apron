# pipelines-as-code-secret-external-secret.yaml
#
# Added 2026-08-23, same recreate-the dev cluster-from-scratch pass as
# pipelines-as-code-vendored.yaml (this directory) - that file's own header explains why
# PaC is now a standalone install rather than tektoncd/operator-managed. This cluster's
# full etcd-WAL-corruption rebuild took the old hand-created `pipelines-as-code-secret`
# with it, and docs/admin/secrets-management.md (platform-cicd) had deliberately left it
# out of the 2026-08-19 ESO migration as "PaC's own Secret, outside this platform's
# chart boundary" - true of the *chart*, but nothing stops a plain manifest in PaC's own
# install boundary (this directory) from doing the same sync. Revisits that exclusion:
# real operational cost of a manual-recreate-per-cluster-rebuild step outweighs the
# boundary argument, especially since the values are already sitting in
# platform-cicd-<cluster>'s Infisical project for github-app-creds's sake.
#
# github-application-id/github-private-key are the same two keys
# github-app-creds-external-secret.yaml already syncs from the same Infisical project
# (platform-cicd/charts/platform-cicd-control-plane/templates/secretstore/
# github-app-creds-external-secret.yaml), same as the github-app-creds copy
# token-review-interceptor consumes. Genuinely the same source values, two independent
# ExternalSecrets, no copy-from-copy dependency between them.
#
# 2026-08-24: added the third key, webhook.secret - this original ExternalSecret only
# carried the two keys github-app-creds also needed, missing the one PaC's controller
# ALSO requires from this same Secret to validate incoming GitHub webhook signatures
# before it'll mint an installation token (confirmed live: pipelines-as-code-watcher
# logged "[SECURITY] Blocked GitHub App token minting before webhook signature
# validation completed" / "no webhook secret has been set in controller secret" -
# every push/PR event was being rejected). Confirmed the exact key name against
# tektoncd/pipelines-as-code's own v0.49.0 source
# (pkg/secrets/secret.go:defaultPipelinesAscodeSecretWebhookSecretKey =
# "webhook.secret"), not guessed. This value is genuinely new, not a lost copy of
# something that already existed - listed every key already in this Infisical project
# live (ClusterExternalSecret dataFrom.find, scratch-tested and torn down) and confirmed
# no webhook secret was ever planted there; GitHub Apps make a webhook secret
# write-only after the fact anyway, so there was never a way to "recover" the original
# value even if the etcd rebuild hadn't happened. Plant a freshly-generated value as
# github-webhook-secret in platform-cicd-<cluster>'s Infisical project, and update the
# SAME value on the GitHub App's own Settings > Webhook secret field (App id in
# Infisical's github-application-id) - both sides have to agree or every webhook gets
# rejected. Manual by design, same posture as every other credential's ultimate source
# in this platform (docs/admin/secrets-management.md).
#
# namespace: tekton-pipelines, NOT pipelines-as-code - this cluster retargeted every
# PaC resource into the single Tekton namespace (see pipelines-as-code-vendored.yaml's
# own header); PAC_CONTROLLER_SECRET's env var value stays the bare name
# "pipelines-as-code-secret", resolved against SYSTEM_NAMESPACE (the pod's own
# namespace), so what matters is this Secret existing in tekton-pipelines, not the name
# implying a namespace.
#
# secretStoreRef targets platform-secret-store (ClusterSecretStore, cluster-scoped, no
# namespace restriction) - the same store platform-cicd-control-plane's own
# ExternalSecrets use, defined in that chart (templates/secretstore/
# cluster-secret-store.yaml) and installed on this same cluster. Referencing it from a
# manifest outside that chart's own Application is safe precisely because
# ClusterSecretStore, unlike SecretStore, isn't namespace- or Application-scoped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipelines-as-code-secret
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: pipelines-as-code
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: pipelines-as-code-secret
    creationPolicy: Owner
  data:
    - secretKey: github-application-id
      remoteRef:
        key: github-application-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: github-private-key
      remoteRef:
        key: github-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: webhook.secret
      remoteRef:
        key: github-webhook-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
