# Tower's write identity on this cluster (2026-10-12, SPEC-tower-cluster-credentials.md phase 3).
#
# hangar:the prod cluster:tower-actor is the prod cluster's ServiceAccount backstage/tower-actor, accepted through
# 00-bootstrap/cluster-identity/. No pod runs as it. Backstage mints a 10-minute token for it per write action
# (TokenRequest on the prod cluster, audience the dev cluster, bound to the Backstage pod) and drops it after that action.
# Reads use the pod's own projected token instead (hangar:the prod cluster:backstage-ingestor, read bindings in rbac.yaml).
#
# Its one write grant, held to its shape by 30-policy/kyverno-policies/tower-breakglass.yaml, which names this user:
#   - tower-breakglass-binder: create/delete tower-breakglass-* RoleBindings and bind the two debug roles, to this
#     user only.
# Tower's Tekton writes (Re-run, Cancel, release and rollback runs) go through glidepath-api since Glidepath API P6
# (2026-10-30): this user calls the API (tower-actor-glidepath-api-proxy below) and holds no Tekton grant; the
# backstage-tekton-rerun binding it had is gone, and tower-identity-writes.yaml refuses any PipelineRun write from it.
# `view` because break-glass reads what it acts on (the target pod and namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tower-actor-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:tower-actor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tower-actor-breakglass-binder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tower-breakglass-binder
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:tower-actor
---
# Glidepath API spec phase 3 (2026-10-28): Tower's Re-run and Cancel (and since P4, Promote and Roll back) go through
# glidepath-api, called as this identity
# through the API server's service proxy (the proxy drops Authorization; glidepath-api checks the token again from
# X-Glidepath-Authorization and authorizes the write itself, so this only opens the door).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tower-actor-glidepath-api-proxy
  namespace: platform-system
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["glidepath-api", "glidepath-api:8080"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tower-actor-glidepath-api-proxy
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tower-actor-glidepath-api-proxy
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:tower-actor
