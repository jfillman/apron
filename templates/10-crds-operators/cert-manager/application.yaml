apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
#@if certManager.dns01RecursiveNameservers
        # certManager.dns01RecursiveNameservers (docs/cert-manager.md): the DNS-01 propagation self-check asks only these
        # recursive resolvers, not the pod's resolv.conf (split-horizon or unreliable in-cluster DNS).
        dns01RecursiveNameservers: "@@CERT_MANAGER_DNS01_RECURSIVE_NAMESERVERS@@"
        dns01RecursiveNameserversOnly: true
#@end
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
