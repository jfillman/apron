# autopilot-api: the gateway's own read API (autopilot R-3c, `autopilot-gateway api`, read_api.py), a separate
# Deployment of the gateway's image: agents (with their holds), sessions and run trees, a run's result, the inbox and
# its feed, trigger history, the runtime catalog. It reads the gateway's own database (autopilot-pg, the gateway_*
# tables) as the read-only role, never the writer lock, and runs two replicas. Clearance's reads (evidence,
# clearances, policy) are clearance-api's, the Go `clearance api` of 55-clearance, named in /v1/contract.
# Before R-4 this Deployment was autopilot-api, Clearance's Python api.py run from the gateway's image.
#
# Its own service account, `autopilot-api`: TokenReview (to authenticate callers) and the catalog token (a
# person's teams and apps from Tower's catalog), nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autopilot-api-auth-delegator
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: autopilot-api
    namespace: autopilot-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: autopilot-api, hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: autopilot-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: autopilot-api, hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
    spec:
      serviceAccountName: autopilot-api
      automountServiceAccountToken: true
      enableServiceLinks: false
#@if tower.hostAliasIP
      hostAliases:
        - ip: "@@TOWER_HOST_ALIAS_IP@@"
          hostnames: ["backstage.@@TOWER_CLUSTER@@.local"]
#@end
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          # The gateway's image (gateway.yaml pins the same digest); `api` selects its read API.
          image: @@REGISTRY_HOST@@/@@REGISTRY_OWNER@@/autopilot-gateway:gateway-v0.7.0@sha256:e85d06729859a911de13d68567279d1d40538c7f1885fd112ec9e33d7bc68699
          args: [api]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: GATEWAY_API_DSN
              valueFrom: {secretKeyRef: {name: autopilot-pg-reader, key: uri}}
            # Clearance's reads, named in /v1/contract.
            - {name: CLEARANCE_API_URL, value: "http://clearance-api.@@CLEARANCE_NAMESPACE@@.svc:8080"}
            - {name: AUTOPILOT_AUDIENCE, value: clearance}
            - {name: AUTOPILOT_GATEWAY_URL, value: "@@GATEWAY_SCHEME@@://autopilot.@@CLUSTER_DOMAIN@@"}
#@if components.observability and observability.full
            # Its log lines to Loki: a copy of each goes to the cluster's OpenTelemetry collector (40-observability
            # otel-collector, logs pipeline -> Loki /otlp) over OTLP/HTTP (autopilot otlp_logs.py, gateway-v0.4.2+;
            # an older image ignores these). Egress is open from this pod; the collector takes no credential.
            # In Loki: {service_name="autopilot-api"} or {k8s_namespace_name="autopilot-system"}.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: "http://otel-collector-opentelemetry-collector.observability.svc:4318/v1/logs"}
            - {name: OTEL_SERVICE_NAME, value: autopilot-api}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.cluster.name=@@CLUSTER_NAME@@"}
#@end
#@if tower.cluster
            # Tower: its backend reads for the person it names (delegate) and reads the inbox feed (notifier).
            - {name: BACKSTAGE_URL, value: "@@TOWER_BASE_URL@@"}
            - {name: BACKSTAGE_TOKEN_FILE, value: /var/run/clearance/backstage-token}
            - {name: TOWER_ISSUER, value: "@@TOWER_ISSUER@@"}
            - {name: TOWER_CLUSTER, value: "@@TOWER_CLUSTER@@"}
            - {name: TOWER_SERVICE_ACCOUNTS, value: "@@TOWER_NAMESPACE@@/backstage-ingestor"}
            - {name: AUTOPILOT_DELEGATES, value: "@@TOWER_CLUSTER@@/@@TOWER_NAMESPACE@@/backstage-ingestor"}
            - {name: GATEWAY_API_NOTIFIERS, value: "@@TOWER_CLUSTER@@/@@TOWER_NAMESPACE@@/backstage-ingestor"}
#@end
#@if autopilot.customImages
            # Custom runtime images (cluster.yaml autopilot.customImages): globs a definition's runtime.image may match
            # beyond the runtime catalog, listed at GET /v1/runtimes
            # (custom_images) for New agent. The same value as the gateway's. Unset: catalog images only.
            - {name: RUNTIME_IMAGES_EXTRA, value: "@@AUTOPILOT_CUSTOM_IMAGES@@"}
#@end
#@if autopilot.people and components.gatewayRoutes
            # People sign in as at the gateway (people-dex); cluster.yaml autopilot.people are this API's auditors.
            - {name: AUTOPILOT_OIDC_ISSUER, value: "@@GATEWAY_SCHEME@@://dex.@@CLUSTER_DOMAIN@@/dex"}
            - {name: AUTOPILOT_OIDC_AUDIENCE, value: clearance}
            - {name: AUTOPILOT_OIDC_JWKS_URL, value: "http://people-dex.autopilot-system.svc:5556/dex/keys"}
            - {name: AUTOPILOT_OIDC_USER_CLAIM, value: preferred_username}
            - {name: AUTOPILOT_OIDC_ALLOWED_USERS, value: "@@AUTOPILOT_PEOPLE@@"}
            - {name: GATEWAY_API_AUDITORS, value: "@@AUTOPILOT_PEOPLE_PRINCIPALS@@"}
#@end
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: tokens, mountPath: /var/run/clearance, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        # Tower's catalog, as this pod (catalog-token-policy.yaml admits this service account too).
        - name: tokens
          projected:
            sources:
              - serviceAccountToken: {audience: backstage-catalog, expirationSeconds: 3600, path: backstage-token}
---
apiVersion: v1
kind: Service
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: autopilot-api, hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  selector: {app.kubernetes.io/name: autopilot-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: autopilot-api}
---
# Ingress to the read API: the Gateway (its route below) and pods in this cluster that carry the client label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: autopilot-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: @@GATEWAY_NAMESPACE@@}
        - namespaceSelector: {}
          podSelector:
            matchLabels: {hangar.io/autopilot-client: api}
      ports:
        - {protocol: TCP, port: 8080}
#@if components.gatewayRoutes
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: autopilot-api
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway-api}
spec:
  parentRefs:
    - name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
  hostnames:
    - autopilot-api.@@CLUSTER_DOMAIN@@
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: autopilot-api
          port: 8080
#@end
