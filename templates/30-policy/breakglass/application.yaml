# Tower break-glass on Flight (phase 3): the admission policies (wave -1) and Backstage's debug RBAC (wave 0). See
# policies.yaml and rbac.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tower-breakglass
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: policy
spec:
  project: default
  source:
    repoURL: @@REPO_URL@@
    targetRevision: main
    path: 30-policy/breakglass
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
