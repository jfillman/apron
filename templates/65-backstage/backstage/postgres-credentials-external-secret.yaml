# Generates backstage-postgres-credentials (../postgres/application.yaml's
# auth.existingSecret, this Deployment's own POSTGRES_PASSWORD secretKeyRef) entirely
# in-cluster instead of the prior "kubectl create secret by hand before first sync"
# step - no plaintext ever touches git, Infisical, or an assistant.
#
# Why not just drop auth.existingSecret and let the Bitnami chart generate its own
# Secret? That chart's own generation path relies on Helm's `lookup` function to
# reuse a password already present in the live cluster across re-renders - and Helm's
# `lookup` always returns empty when the chart is rendered via `helm template`
# (what ArgoCD's Helm source actually does, not `helm install`/`upgrade`), confirmed
# against Helm's own docs. Combined with this Application's `selfHeal: true`, that
# would mint a brand-new random password on every sync and silently break Postgres
# auth against the already-initialized database. ESO's generatorRef sidesteps this
# because generation happens once, outside Helm's render path entirely.
#
# secretKeys: [postgres-password, password] on the Password generator matches the
# Bitnami chart's own auth.secretKeys.adminPasswordKey/userPasswordKey defaults
# exactly (confirmed via `helm pull oci://registry-1.docker.io/bitnamicharts/
# postgresql --version 18.8.13` and reading templates/secrets.yaml directly) -
# architecture: standalone means replication-password is never read, so it's
# intentionally not generated here.
#
# refreshPolicy: CreatedOnce + target.immutable: true is the load-bearing pair that
# keeps this stable under GitOps: ESO's own generatorRef does NOT track previously
# generated values (unlike Helm's lookup-based reuse) - every reconcile would
# otherwise produce a brand-new password. Live-verified on the former management cluster 2026-09-03:
# applied once, captured the generated values, then both restarted the
# external-secrets controller deployment (simulating a fresh reconcile after
# operator/node restart) and re-applied the identical manifest (simulating ArgoCD's
# selfHeal re-apply) - the target Secret's data was byte-for-byte unchanged both
# times. symbols: 0 keeps the password plain alphanumeric so it never needs
# shell/URI escaping wherever it's consumed.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-postgres-password
  namespace: backstage
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
  secretKeys:
    - postgres-password
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-postgres-credentials
  namespace: backstage
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-postgres-credentials
    creationPolicy: Owner
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-postgres-password
