# Generated by apron hack/cluster-identity.sh render from components.clusterIdentity.trust.
# Installed on the control-plane node as /etc/kubernetes/authn/config.yaml (hack/cluster-identity.sh trust,
# or kind-patch at create time). The API server reloads it on change. Not an Argo CD manifest.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
- issuer:
    url: @@TOWER_ISSUER@@
    audiences:
    - @@CLUSTER_NAME@@
  claimValidationRules:
  - expression: claims["kubernetes.io"].namespace == "@@TOWER_NAMESPACE@@"
    message: only @@TOWER_CLUSTER@@'s @@TOWER_NAMESPACE@@ namespace
  - expression: claims["kubernetes.io"].serviceaccount.name in ["backstage-ingestor", "tower-actor"]
    message: only the listed ServiceAccounts
  - expression: int(claims.exp) - int(claims.iat) <= 600
    message: tokens longer than 600s are refused
  claimMappings:
    username:
      expression: '"hangar:@@TOWER_CLUSTER@@:" + claims["kubernetes.io"].serviceaccount.name'
    groups:
      expression: '["hangar:@@TOWER_CLUSTER@@"]'
    uid:
      expression: claims.sub
    extra:
    - key: hangar.io/pod
      valueExpression: 'has(claims["kubernetes.io"].pod) ? claims["kubernetes.io"].pod.name : ""'
  userValidationRules:
  - expression: '!user.username.startsWith("system:")'
    message: reserved prefix
