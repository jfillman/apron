# ProviderConfig for provider-github (see providers.yaml's own comment for why the
# package is actually named provider-upjet-github, not provider-github).
#
# ClusterProviderConfig (github.m.upbound.io/v1beta1), not the legacy Cluster-scoped
# ProviderConfig (github.upbound.io/v1beta1) this file originally used - corrected after
# a real live failure building NodeJSApplication: Crossplane v2 refuses to let a
# namespaced XR (apiextensions.crossplane.io/v2, scope: Namespaced - every XRD in this
# catalog) compose a Cluster-scoped legacy managed resource at all ("cannot apply
# cluster scoped composed resource ... for a namespaced composite resource"), so
# NodeJSApplication's Composition composes the provider's namespaced managed-resource
# family (repo.github.m.upbound.io - Repository, RepositoryFile) instead. Confirmed live
# against the actual installed CRDs (`kubectl api-resources | grep github`), not the
# provider's own example directory, which was misleading here - its examples/namespaced/
# tree uses a stale, never-filled-in placeholder apiVersion
# (template.m.crossplane.io/v1beta1) that reads like unfinished scaffolding but the real
# CRDs it should have referenced (github.m.upbound.io) are genuinely installed and
# working. ClusterProviderConfig over the namespaced ProviderConfig variant so this one
# credential is referenceable from every namespace's managed resources (every
# app-<name>-cicd namespace, eventually) without duplicating the Secret per namespace -
# same "one credential, cluster-wide" shape the original Cluster-scoped ProviderConfig
# already had.
#
# Credential shape (the Secret itself is never committed here - see
# idp/docs/service-catalog-design.md §1 and this repo's own README for how it's
# provisioned): a classic PAT (repo + delete_repo scopes), NOT platform-cicd's existing
# GitHub App - corrected live, a real design-doc assumption that broke on the actual
# account. GitHub Apps can't create repositories under a personal User account at all
# (jfillman is a User, not an Organization) - a documented GitHub platform restriction,
# 403 "Resource not accessible by integration" on every Repository create, not a fixable
# App-permissions gap. See service-catalog-design.md §1 for the full story and what
# would reopen the App-auth path. Credential JSON: {"owner": "jfillman", "token": "..."}
# - confirmed against the provider's credential-parsing source (setCredentialConfigs in
# internal/clients/github.go), which supports plain token auth as an alternative to
# app_auth, not only alongside it. owner is REQUIRED regardless of which auth type is
# used and is a ProviderConfig-wide setting, not per-repo - confirmed against the
# Repository managed resource's own schema, which has no owner field of its own - every
# repo this ProviderConfig's credential can reach lands under "jfillman", the same
# account every other repo in this project already lives under. delete_repo specifically
# needed for real deprovisioning - without it, Repository deletion 403s and the managed
# resource gets stuck Terminating (hit live during NodeJSApplication's own
# live-verification cleanup).
apiVersion: github.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  credentials:
    source: Secret
    secretRef:
      name: provider-github-creds
      namespace: crossplane-system
      key: credentials
