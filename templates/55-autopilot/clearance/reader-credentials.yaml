# clearance-api's database credentials (AP-B2c): the read-only role `clearance_reader` (postgres.yaml managed role),
# its password generated in-cluster once (an ESO Password generator, as 65-backstage's), never written by hand. One
# Secret serves both sides: CloudNativePG reads username/password (basic-auth) to set the role's password, and the
# read API reads `uri` as CLEARANCE_API_DSN. Read-only twice over: the role (pg_read_all_data, no write grant) and
# every API connection (default_transaction_read_only, clearance api.Pool).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: clearance-pg-reader
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: clearance-api}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
  secretKeys: [password]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clearance-pg-reader
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: clearance-api}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: clearance-pg-reader
    creationPolicy: Owner
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: clearance_reader
        password: "{{ .password }}"
        uri: "postgresql://clearance_reader:{{ .password }}@clearance-pg-rw.autopilot-system.svc:5432/clearance"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: clearance-pg-reader
