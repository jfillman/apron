# The gateway: autopilot-gateway (autopilot repo, Dockerfile), which is Clearance at its pinned release with
# Autopilot's Hangar backends (README "Running the gateway"). One replica: the store is single-writer and clearance.pg
# refuses a second writer. Run pods find it by the label and port function-agentrun's egress allows.
#
# Backends wired here: AgentRuns (Role in agentrun-grants), Airframe and Argo CD Application reads (identity.yaml),
# glidepath-api (its delegates/readers/operators/releasers list this identity), Thanos Query and Loki (no credential).
# Losing Postgres ends the process (exit 70) and the kubelet restarts it; it starts again once the database answers.
# Callers authenticate with a service-account token for the `clearance` audience; people's OIDC sign-in is not
# configured yet. The SA token mounted here (API server audience)
# is what Clearance uses for TokenReview, the Airframe reads, AgentRuns and glidepath-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearance
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: clearance}
  template:
    metadata:
      labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
    spec:
      serviceAccountName: clearance
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          # gateway-v0.3.0 = autopilot 1b77d49 with clearance v0.5.0; multi-arch index digest (amd64, arm64).
          image: @@REGISTRY_HOST@@/@@REGISTRY_OWNER@@/autopilot-gateway:gateway-v0.3.0@sha256:8f9c71f020c68e05c337ef5afb15c4b87e401f0a27723f5b7a2fbb3522ef2a03
          ports:
            - {name: mcp, containerPort: 8080}
            - {name: model, containerPort: 8081}
          env:
            - name: CLEARANCE_DSN
              valueFrom: {secretKeyRef: {name: clearance-pg-app, key: uri}}
            - {name: CLEARANCE_RESOURCE_URL, value: "http://clearance.autopilot-system.svc:8080/mcp"}
            - {name: CLEARANCE_AUDIENCE, value: clearance}
            - {name: GLIDEPATH_API_URL, value: "http://glidepath-api.platform-system.svc:8080"}
            - {name: GLIDEPATH_ON_BEHALF_OF, value: "1"}
            - {name: AIRFRAME_CLUSTER, value: "@@CLUSTER_NAME@@"}
            - {name: AIRFRAME_TENANTS_REPO, value: "@@TENANTS_REPO_NAME@@"}
            # T0 reads: Argo CD Applications through the Kubernetes API (the airframe reader's RBAC), PromQL on Thanos
            # Query, LogQL on Loki (OpenTelemetry labels: k8s_namespace_name, k8s_pod_name, service_name).
            - {name: ARGO_APP_NAMESPACES, value: "argocd,argocd-apps"}
            - {name: PROMETHEUS_URL, value: "http://thanos-query.observability.svc:9090"}
            - {name: LOKI_URL, value: "http://loki-gateway.observability.svc"}
            # repo.pr.open as the agents' GitHub App: a token per PR from Glidepath's broker (/agent-installation-token),
            # asked for with the projected token below. The App's key never reaches this pod.
            - {name: GITHUB_PR_ENABLED, value: "1"}
            - {name: AGENT_TOKEN_FILE, value: /var/run/clearance/agent-installation-token}
            # The model proxy (port 8081, Service model-proxy): runs' model calls, decided and charged here.
            - {name: MODEL_KEY_FILE, value: /etc/clearance-model/anthropic-api-key}
            - {name: MODEL_ROUTES, value: "claude-sonnet-5-5=claude-sonnet-5-5"}
            # The event trigger bridge (glidepath-api /v1/events -> triggered runs). Off until triage-agent's runtime
            # image is in the gateway image (gateway-v0.3.1).
            - {name: EVENTS_ENABLED, value: "0"}
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: clearance-tokens, mountPath: /var/run/clearance, readOnly: true}
            - {name: model-key, mountPath: /etc/clearance-model, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        # Clearance's token toward the broker's /agent-installation-token, rotated by the kubelet.
        - name: clearance-tokens
          projected:
            sources:
              - serviceAccountToken: {audience: agent-installation-token, expirationSeconds: 3600, path: agent-installation-token}
        - name: model-key
          secret:
            secretName: clearance-model-key
---
apiVersion: v1
kind: Service
metadata:
  name: clearance
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
spec:
  selector: {app.kubernetes.io/name: clearance}
  ports:
    - {name: mcp, port: 8080, targetPort: mcp}
---
# The model proxy is Clearance's own pod (function-agentrun's model_proxy_selector, airframe compositions/agentrun):
# runs reach it as MODEL_PROXY_URL, http://model-proxy.autopilot-system.svc:8081.
apiVersion: v1
kind: Service
metadata:
  name: model-proxy
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
spec:
  selector: {app.kubernetes.io/name: clearance}
  ports:
    - {name: model, port: 8081, targetPort: model}
