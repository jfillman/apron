# Closes a real gap found live 2026-08-24 (platform-cicd ADR-0007/ADR-0008): Testkube CE
# runs every onboarded Application's TestWorkflows in ONE shared `testkube` namespace
# (a Pro/Enterprise-only feature gate forces this - see ADR-0007). Kubernetes RBAC alone
# can't stop tenant B's TestWorkflow from declaring env[].valueFrom.secretKeyRef.name
# pointing at tenant A's placeholder Secret - RBAC gates who may read/write a Secret
# OBJECT via the API, not which Secret names a pod spec is allowed to mount. This policy
# is the actual enforcement point: it runs at TestWorkflow CREATE/UPDATE admission time,
# where the real caller identity (that tenant's own pipeline-runner ServiceAccount) is
# still visible - by the time Testkube's own controller creates the execution Job from
# an already-applied TestWorkflow, that identity information is gone (the Job is created
# by testkube-api-server's own ServiceAccount on everyone's behalf alike).
#
# Enforcement rule: a TestWorkflow applied by tenant <appName>'s own pipeline-runner
# (system:serviceaccount:<type>-<appName>-cicd:pipeline-runner) may only reference
# secretKeyRef.name == "<appName>-app-secrets" - exactly the one placeholder Secret
# platform-cicd-app's own onboarding chart pre-seeds for that tenant
# (charts/platform-cicd-app/templates/testkube/rbac-and-secret.yaml). Any other
# secretKeyRef.name is denied outright.
#
# Deliberately excludes non-ServiceAccount callers (human/OIDC kubeconfig users -
# operators debugging live get a bypass, same trust boundary as kubectl access to the
# cluster already implies) and testkube's own ServiceAccounts (its controller's own
# reconcile writes to a TestWorkflow's status/finalizers shouldn't be blocked by a rule
# meant for tenant-submitted specs).
#
# Scope note: only checks spec.container.env and spec.steps[].container.env - the two
# locations this platform's own authoring convention (docs/user/cicd-yaml-reference.md)
# documents. TestWorkflow's schema allows secretKeyRef in other nested locations too
# (services[], setup, after) that this first pass does not cover - a known, accepted gap
# for now, not silently assumed safe.
#
# Generated as a native ValidatingAdmissionPolicy (2026-10-11), like tower-breakglass.yaml: the
# API server enforces it and Kyverno's uptime no longer gates TestWorkflow writes. That needs
# plain Kubernetes CEL, so the ServiceAccount's namespace comes from splitting the username
# (system:serviceaccount:<ns>:<name>) instead of Kyverno's parseServiceAccount().
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: testkube-secret-usage
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["testworkflows.testkube.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["testworkflows"]
  variables:
    - name: isTenantSA
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        !request.userInfo.username.startsWith('system:serviceaccount:testkube:')
    - name: tenantNamespace
      expression: >-
        variables.isTenantSA
          ? request.userInfo.username.split(':')[2]
          : ''
    - name: expectedSecret
      expression: >-
        !variables.isTenantSA
          ? ''
          : (variables.tenantNamespace.startsWith('app-')
              ? variables.tenantNamespace.substring(4, variables.tenantNamespace.size() - 5)
              : variables.tenantNamespace.substring(6, variables.tenantNamespace.size() - 5)
            ) + '-app-secrets'
  validations:
    - expression: >-
        !variables.isTenantSA ||
        !has(object.spec.container) || !has(object.spec.container.env) ||
        object.spec.container.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          e.valueFrom.secretKeyRef.name == variables.expectedSecret
        )
      message: >-
        spec.container.env[].valueFrom.secretKeyRef.name must reference this
        Application's own <appName>-app-secrets - found a reference to a different
        Secret. Use the literal placeholder __APP_SECRETS_NAME__ in platform/<name>.yaml
        instead of hardcoding a secret name (see docs/user/cicd-yaml-reference.md).
    - expression: >-
        !variables.isTenantSA ||
        !has(object.spec.steps) ||
        object.spec.steps.all(s,
          !has(s.container) || !has(s.container.env) ||
          s.container.env.all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            e.valueFrom.secretKeyRef.name == variables.expectedSecret
          )
        )
      message: >-
        spec.steps[].container.env[].valueFrom.secretKeyRef.name must reference this
        Application's own <appName>-app-secrets - found a reference to a different
        Secret. Use the literal placeholder __APP_SECRETS_NAME__ in platform/<name>.yaml
        instead of hardcoding a secret name (see docs/user/cicd-yaml-reference.md).
