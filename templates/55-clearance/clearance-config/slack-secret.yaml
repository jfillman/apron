# clearance-slack's credentials (clearance.slack.enabled; docs/clearance-slack.md). Nothing here is a value: the Slack and IdP
# secrets are the OWNER's, in Infisical (never in git); the Postgres password is generated in the cluster once.
#
# The chart reads one Secret (slack.existingSecret: clearance-slack) as files:
#   bot-token, app-token (socket) or signing-secret (events), client-secret, idp-client-secret   <- Infisical
#   dsn                                                                                           <- the role's generated password
# so the ExternalSecret below merges the two: the Infisical keys by remoteRef, and `dsn` from the Secret clearance-pg-slack
# (the generated one, further down) through templateFrom. The password is generated once (CreatedOnce), as clearance-api's
# reader's is (reader-credentials.yaml): CloudNativePG reads username/password to set the role's password, and the same
# Secret carries the DSN. No `dsn` entry in Infisical, no hand-made DSN.
#
# Network: the pod reaches clearance-pg through clearance-pg's own NetworkPolicy (networkpolicy.yaml), whose pod selector is the
# chart's name and instance labels, which every pod of the release carries (nameOverride is clearance-core for all of
# them). What the pod may do there is its role's: it owns the database clearance_slack and has no grant on the evidence
# tables of the database `clearance`.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: clearance-pg-slack
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance, hangar.io/subcomponent: clearance-slack}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
  secretKeys: [password]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clearance-pg-slack
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance, hangar.io/subcomponent: clearance-slack}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: clearance-pg-slack
    creationPolicy: Owner
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: clearance_slack
        password: "{{ .password }}"
        dsn: "postgresql://clearance_slack:{{ .password }}@clearance-pg-rw.@@CLEARANCE_NAMESPACE@@.svc:5432/clearance_slack"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: clearance-pg-slack
---
# The service's own database, owned by its own role (the role is postgres.yaml's managed role clearance_slack). It creates its
# three clearance_slack_* tables on start. Not part of the nightly dump of `clearance` (backup.yaml): links are re-made with
# /clearance link, nothing here is evidence.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: clearance-slack
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance, hangar.io/subcomponent: clearance-slack}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,SkipDryRunOnMissingResource=true
spec:
  cluster: {name: clearance-pg}
  name: clearance_slack
  owner: clearance_slack
  # Never dropped with the object: deleting this manifest must not delete the links.
  databaseReclaimPolicy: retain
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clearance-slack
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance, hangar.io/subcomponent: clearance-slack}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: clearance-slack
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      # `dsn` is rendered from the generated Secret above (a plain string: the key's value is the template).
      templateFrom:
        - secret:
            name: clearance-pg-slack
            items:
              - key: dsn
  data:
    - secretKey: bot-token
      remoteRef: {key: clearance-slack-bot-token}
#@if clearance.slack.transport != 'events'
    # Socket Mode (default): the app-level token, xapp-, scope connections:write.
    - secretKey: app-token
      remoteRef: {key: clearance-slack-app-token}
#@end
#@if clearance.slack.transport == 'events'
    # Events transport: Slack's signing secret instead of the app token.
    - secretKey: signing-secret
      remoteRef: {key: clearance-slack-signing-secret}
#@end
    - secretKey: client-secret
      remoteRef: {key: clearance-slack-signin-client-secret}
    # The people-dex client's secret (the same Infisical key feeds Dex: 55-identity people-dex/clearance-slack-secret.yaml).
    - secretKey: idp-client-secret
      remoteRef: {key: clearance-slack-idp-client-secret}
