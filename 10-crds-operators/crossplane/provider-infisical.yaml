# Rebuilds airframe's hand-rolled infisical-secretstore-operator (kopf/Python,
# operators/infisical-secretstore-operator/) as a real upjet-generated Crossplane
# provider, wrapping the official Infisical/infisical Terraform provider instead of
# hand-written REST calls. Source: github.com/jfillman/provider-infisical.
#
# Installed alongside the existing operator, not replacing it yet - the Composition
# migration (SecretStore's templates re-pointed at this provider's native
# Project/ProjectEnvironment/Identity/... kinds instead of
# secrets.idp.io/v1alpha1 InfisicalProject/InfisicalEnvironment) is a separate,
# later step, done once this install itself is live-verified. See the plan's Part A
# rollout-safety section.
#
# MVP resource set mirrors the current operator's scope exactly: Project,
# ProjectEnvironment, Identity, IdentityUniversalAuth,
# IdentityUniversalAuthClientSecret, IdentityKubernetesAuth, ProjectIdentity - all
# namespaced (infisical.m.hangar.io). Live-verified 2026-09-17 on kind-dev: full
# create->Ready:True->delete lifecycle for Project/ProjectEnvironment/Identity/
# IdentityUniversalAuth/ProjectIdentity (the last one with adoptExisting: true - the
# native fix for the current operator's known non-idempotent membership-grant bug).
# IdentityKubernetesAuth correctly surfaces a real upstream validation error against
# an incomplete config (expected). IdentityUniversalAuthClientSecret hits a real bug
# in terraform-provider-infisical's own Go SDK (GetIdentityUniversalAuthClientSecretResponse.clientSecretData
# unmarshals an array into a single-object struct field) that blocks its Observe path
# entirely - not fixable from this repo, worth filing upstream; the resource is
# still installed since Create-side generation/config is otherwise correct.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-infisical
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  package: ghcr.io/jfillman/provider-infisical:v0.0.0-5.gc808a9d
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-infisical-runtime
