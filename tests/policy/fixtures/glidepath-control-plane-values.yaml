# A trimmed copy of the part of Glidepath's charts/glidepath-control-plane/values.yaml that tests/run.sh compares
# versions.glidepathRunTasks with (APRON_GLIDEPATH_VALUES), so the offline tests never fetch it. The real comparison is against
# the pinned Glidepath: hack/glidepath_tasks.py, on every `apron render`.
cicdRunAdmission:
  cloudDeployerTasks:
    deploy: [deploy-aws-lambda, deploy-aws-ecs]
  sourceTasks:
    build: [build-source, unit-test, build-image, build-python-wheel-artifact, build-go-binary-artifact]
    test: [run-integration-script]
    policy-validation-check: [render]
    clearance-gate-check: [render]
    values-check: [render]
  pusherTasks:
    build: [push-image]
  recordWriterTasks:
    bypass-merge-check: [mark-release-merged, itsm-implement]
    clearance-gate-check: [join-release]
    itsm-check: [verify-change, verify-change-advisory]
    release: [open-release-pr]
  clearanceTasks:
    agent-definitions-check: [review]
    agent-gates-check: [agent-gates]
    agent-release: [release]
    clearance-gate-check: [fetch, register, register-advisory, render-check]
  testRunnerTasks:
    test: [run-testworkflow]
