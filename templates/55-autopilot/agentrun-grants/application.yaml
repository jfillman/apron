# AgentRun's cluster grants (Autopilot AP-A3, decision D15). A directory source of this folder: everything but this
# file is applied as-is, and the files only ever ship together:
#   provider-kubernetes-agentrun.yaml   the ClusterRole provider-kubernetes needs for an AgentRun's Objects, bound to
#                                       its stable service account (10-crds-operators/crossplane/provider-kubernetes-runtime.yaml)
#   provider-confinement-policy.yaml    the ValidatingAdmissionPolicy that confines that grant to run namespaces
#   clearance-agentruns.yaml            Clearance's one Kubernetes permission: agentruns in autopilot-runs
# Sync wave: the policy (wave -1) is in place before the grant (wave 0), so the grant is never live unconfined.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autopilot-agentrun-grants
  namespace: argocd
  labels:
    hangar.io/component: autopilot
    hangar.io/subcomponent: agentrun-grants
spec:
  project: default
  source:
    repoURL: @@REPO_URL@@
    targetRevision: main
    path: 55-autopilot/agentrun-grants
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
