# hostAPI (updated 2026-09-04): was a raw podman-network IP (10.89.0.2) that is
# non-monotonic and drifts across kind-dev restarts/rebuilds - stale from day one for
# any cluster provisioned off this template. Now the dev.kiac.local hostname, matching
# every other live cluster's copy of this file. That hostname is NOT resolvable
# in-cluster on its own though (CoreDNS never consults the Mac host's /etc/hosts) -
# see this directory's sibling application.yaml, which carries the hostAliases entry
# every consumer of this hostname needs. See idp/docs/local-clusters.md.
#
# Same shape as platform-cicd's own control-plane ClusterSecretStore
# (platform-cicd/charts/platform-cicd-control-plane/templates/secretstore/
# cluster-secret-store.yaml) - deliberately same name (platform-secret-store) so
# idp-application's release-tracking/relay-token mechanism and every app's own
# ServiceAccount (registry-credentials via imagePullSecrets) work identically on
# kind-prod with zero app-side value changes, not a per-cluster rename. kind-prod has
# no platform-cicd control-plane instance of its own to bundle this into, so it's a
# standalone pair of manifests here instead of a Helm chart's templates/ - same
# content, different delivery mechanism.
#
# Infisical-backed (real backend, provisioned by the SecretStore XR in secretstore-xr.yaml
# this same directory, through provider-infisical), not ESO's `kubernetes` provider - that
# mechanism (and the platform-secrets Namespace it needed) is retired: this platform's
# secrets all flow through Infisical now, see platform-cicd's
# docs/admin/secrets-management.md. (Until 2026-09-23 the project was an InfisicalProject
# CR reconciled by a purpose-built operator; that operator is retired.)
#
# universalAuthCredentials, not kubernetesAuthCredentials - kind-prod isn't the
# Infisical host (Infisical only runs on kind-dev), same reason idp's own per-app
# kind-prod SecretStores use Universal Auth cross-cluster (idp/docs/
# service-catalog-design.md Item 8's multi-cluster revision). A real, persisted
# clientId/clientSecret, minted by the SecretStore XR (secretstore-xr.yaml) and written to
# platform-cicd-kind-prod-infisical-creds (the Composition names it <slug>-infisical-creds) -
# same accepted tradeoff idp's own per-app upper-cluster identities already carry.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-secrets
  labels:
    hangar.io/subcomponent: "secretstore"
    hangar.io/purpose: platform-cicd-infisical-creds-home
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secret-store
  labels:
    hangar.io/subcomponent: "secretstore"
spec:
  provider:
    infisical:
      # NodePort address for kind-dev's Infisical, WITH the /api suffix - this is
      # ESO's own hostAPI field. provider-infisical's credential `host` is a DIFFERENT
      # convention: it has NO /api suffix (the Terraform provider appends its own). Same
      # value idp's own per-app kind-prod SecretStores use.
      hostAPI: "http://dev.kiac.local:31800/api"
      auth:
        universalAuthCredentials:
          clientId:
            name: platform-cicd-kind-prod-infisical-creds
            namespace: platform-secrets
            key: clientId
          clientSecret:
            name: platform-cicd-kind-prod-infisical-creds
            namespace: platform-secrets
            key: clientSecret
      secretsScope:
        projectSlug: platform-cicd-kind-prod
        environmentSlug: shared
        secretsPath: "/"
