# Renders ArgoCD's own GitHub-App repo-creds Secret shape (documented under "Repository
# Credentials" in ArgoCD's docs: type/url/githubAppID/githubAppInstallationID/
# githubAppPrivateKey, labeled argocd.argoproj.io/secret-type: repo-creds) from the
# SAME Infisical-stored App id/private key platform-system/github-app-creds already
# pulls (platform-cicd/charts/platform-cicd-control-plane/templates/secretstore/
# github-app-creds-external-secret.yaml) - see this folder's own secret-application.yaml
# for the full "why" this exists.
#
# url: a bare owner URL (https://github.com/jfillman, no repo name/`.git` suffix) -
# ArgoCD's own repo-creds matching is prefix-based, one credential entry covers every
# repo under this owner rather than needing one Secret per app repo.
#
# ClusterSecretStore, not a namespace-local SecretStore - platform-secret-store already
# is one, so it's referenceable from this argocd namespace the same as any other, no new
# SecretStore needed.
#
# githubAppInstallationID pulled from Infisical (github-installation-id), same as the
# App id/private key - not a static literal in this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-repo-creds
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-repo-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: github-app-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/jfillman
        githubAppID: "{{ .githubAppID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppID
      remoteRef:
        key: github-application-id
    - secretKey: githubAppInstallationID
      remoteRef:
        key: github-installation-id
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: github-private-key
