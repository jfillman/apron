# Same shape and same Infisical-stored App id/private key as
# 01-argocd-platform/repo-creds/github-app-repo-creds-external-secret.yaml, targeting
# the argocd-apps instance instead of argocd-platform - that instance had NO repo-creds
# of its own (confirmed live 2026-08-25: zero argocd.argoproj.io/secret-type: repo-creds
# Secrets in the argocd-apps namespace), so every onboarded app's own -onboarding/
# -xr-requests Applications have been syncing only because the repos touched so far
# (the control-plane cluster's repo, <this cluster's tenants repo>, gitops-checkout-api) happen to be
# public. NodeJSApplication's own schema defaults visibility: private, so this was
# always going to bite the next private tenant repo this instance needed to read.
#
# See 01-argocd-platform/repo-creds/github-app-repo-creds-external-secret.yaml for the
# full "why" (ClusterSecretStore, url prefix-matching, installationID sourcing) - not
# repeated here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-repo-creds
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-repo-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: github-app-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://@@SCM_HOST@@/@@SCM_OWNER@@
        githubAppID: "{{ .githubAppID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppID
      remoteRef:
        key: github-application-id
    - secretKey: githubAppInstallationID
      remoteRef:
        key: github-installation-id
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: github-private-key
