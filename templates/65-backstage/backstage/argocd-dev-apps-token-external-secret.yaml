# Delivers the dev cluster's argocd-apps `backstage` account API token into a K8s Secret
# here, which deployment.yaml mounts as ARGOCD_DEV_APPS_TOKEN for app-config.yaml's
# argocd.appLocatorMethods to read via ${ARGOCD_DEV_APPS_TOKEN} substitution. The
# `backstage` account itself (apiKey capability only, role:readonly) is provisioned
# by the control-plane cluster's repo/01-argocd-platform/argocd-apps-install/application.yaml's
# own configs.cm/configs.rbac - this file only delivers the token minted against it.
#
# Same secretStoreRef (platform-secret-store) and "manual by design" posture as
# github-oauth-secret.yaml in this same directory - do this yourself, not through
# an assistant, once argocd-apps-install has synced on the dev cluster:
#   1. argocd login <service>.<domain> --plaintext --grpc-web \
#        --username admin --password "$(kubectl --context the dev cluster -n argocd-apps \
#        get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 --decode)"
#      (--plaintext, not --insecure: server.insecure: true means argocd-server
#      speaks plain HTTP/gRPC, not TLS-with-an-untrusted-cert)
#   2. argocd account generate-token --account backstage --grpc-web
#   3. Plant the printed token into Infisical's `platform-cicd-<cluster>` project
#      (same project backstage-github-oauth-client-id/-secret already live in)
#      under the key: backstage-argocd-dev-apps-token
#
# Re-mint if the dev cluster's argocd-apps release is ever reinstalled from scratch (the
# account exists but carries no tokens until one is generated against it) - same
# live-verification discipline every other credential in this platform needs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-argocd-dev-apps-token
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-argocd-dev-apps-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: backstage-argocd-dev-apps-token
