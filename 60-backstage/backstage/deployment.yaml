# image tag is a real, live-verified digest as of first deploy - NodeJSApplication's
# own onboarding doesn't yet wire a `latest`/`stable` moving tag or a GitOps image-
# update mechanism (Argo CD Image Updater, etc.) for this app, so bumping the version
# after a new CI build is a manual edit here for now, same as this platform's other
# manually-pinned image references (ArgoCD's own install.yaml, the rollout-extension
# version pin in argocd-apps-install/application.yaml). Worth automating later, not
# scoped into this first deploy.
#
# backend.database env vars (POSTGRES_HOST/PORT/USER/PASSWORD) match exactly what
# app-config.production.yaml declares - confirmed by reading that file directly, not
# guessed. POSTGRES_USER is the app-level "backstage" user (auth.username on
# ../postgres/application.yaml), not the postgres-password admin credential - the
# secretKeys.userPasswordKey default (`password`) is what backstage-postgres-
# credentials actually carries for this user, confirmed against the chart's own
# defaults when that Application was written.
#
# imagePullSecrets: registry-credentials - this namespace needs the
# hangar.io/managed-secrets: "true" label for kind-man's registry-credentials
# ClusterExternalSecret to populate it (see the Namespace manifest below) - confirmed
# live the image is genuinely private (src repo's own visibility: private XR field)
# and pulls fail without this.
#
# app.baseUrl / backend.baseUrl are NOT overridden here - still the localhost defaults
# baked into the image's app-config.yaml/app-config.production.yaml. Real ingress
# hostname for kind-man isn't decided yet (idp/docs/backstage-design.md flags this
# explicitly) - reachable today only via `kubectl port-forward`, not a real URL.
# Auth-flow-dependent features (redirects, CORS) will be broken until this is set for
# real; core Catalog/Scaffolder/TechDocs pages work fine without it.
#
# /healthcheck confirmed live (ran the real backend locally, curled it, got a real 200)
# - not guessed from Backstage's own docs alone.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    hangar.io/managed-secrets: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: backstage
          image: ghcr.io/jfillman/backstage:1.0.0-e7695bb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: POSTGRES_HOST
              value: backstage-postgres-postgresql.backstage.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Explicit numeric UID required: the image's own USER directive is the
            # named "node" user, and Kubernetes can't verify runAsNonRoot against a
            # name - real CreateContainerConfigError hit live on first deploy
            # ("image has non-numeric user (node), cannot verify user is non-root").
            # 1000 confirmed against the actual pulled image's /etc/passwd, not
            # assumed from convention alone.
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  selector:
    app: backstage
  ports:
    - name: http
      port: 7007
      targetPort: http
