# Delivers the static service token backstage repo's app-config.yaml
# (backend.auth.externalAccess) requires as ${GLIDEPATH_NOTIFY_TOKEN}, so
# Glidepath's eventual notify-backstage Task (glidepath-cicd, the repo that
# replaced platform-cicd - that Task doesn't exist yet as of this file) can
# authenticate as a real caller when POSTing pipeline-result notifications
# into the notifications plugin's REST API. Scoped to the notifications
# plugin only on the Backstage side (see app-config.yaml's own
# accessRestrictions).
#
# Real incident, not preemptive: commit b07063b added this required config
# key to app-config.yaml without ever wiring the token, so every image built
# from that commit forward crashed on startup ("Missing required config
# value at 'backend.auth.externalAccess[0].options.token'") - unlike this
# Deployment's other tokens (GITHUB_TOKEN, ARGOCD_*_TOKEN),
# this one can't be marked optional: true and degrade gracefully - Backstage's
# own config loader treats an unresolved ${...} substitution here as fatal,
# not an absent feature.
#
# Same secretStoreRef (platform-secret-store) and "manual by design" posture
# as every other credential in this directory - planted by hand in
# Infisical under the key glidepath-backstage-notify (2026-09-09, user-
# confirmed), not generated or minted by an assistant. Generated via the
# same command app-config.yaml's own comment documents:
#   node -p 'require("crypto").randomBytes(24).toString("base64")'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glidepath-backstage-notify
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: glidepath-backstage-notify
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: glidepath-backstage-notify
