# Same shape and same Infisical-stored App id/private key as
# ../../01-argocd-platform/repo-creds/github-app-repo-creds-external-secret.yaml,
# targeting the argocd-apps instance instead of argocd-platform - that instance has NO
# repo-creds of its own otherwise, so every onboarded app's own -onboarding/
# -xr-requests Applications only sync as long as the repos they touch happen to be
# public. NodeJSApplication's own schema defaults visibility: private, so this bites
# the first private tenant repo this instance needs to read.
#
# See ../../01-argocd-platform/repo-creds/github-app-repo-creds-external-secret.yaml
# for the full "why" (ClusterSecretStore, url prefix-matching, installationID
# sourcing) - not repeated here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-repo-creds
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-repo-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: github-app-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/jfillman
        githubAppID: "{{ .githubAppID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppID
      remoteRef:
        key: github-application-id
    - secretKey: githubAppInstallationID
      remoteRef:
        key: github-installation-id
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: github-private-key
