# The fan-out gateway all app telemetry flows through - one OTLP endpoint for apps to
# talk to, exported to Tempo (traces, unless observability.tempo is false), Loki (logs), and
# re-exposed for Prometheus/Thanos to scrape (metrics, including the span metrics and the
# service graph this collector derives from the traces). Depends on tempo/ and loki/ (the
# exporters' endpoints) being up first - metrics export doesn't need kube-prometheus-stack up
# first (Prometheus pulls, it doesn't need to exist before the collector starts exposing :8889).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: observability
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.165.0
    helm:
      releaseName: otel-collector
      valuesObject:
        mode: deployment # gateway, not per-node daemonset - app telemetry only
        image:
          repository: otel/opentelemetry-collector-contrib # need "contrib" for loki/otlphttp exporters
        serviceMonitor:
          enabled: true
          # The chart's default metricsEndpoints targets a Service port literally
          # named "metrics" (the collector's own internal self-telemetry on 8888, not
          # our pipeline's exported app metrics, which is ports.prometheus below) -
          # has to be told explicitly to target that port name or it scrapes nothing.
          metricsEndpoints:
            - port: prometheus
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          prometheus:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            memory_limiter:
              check_interval: 5s
              limit_mib: 400
            # Kubelet probes and Prometheus scrapes are not traffic: without this they were most of every app's
            # "Ingress" in Tower's Airspace (flight-api-dev, 7d: 61k of 75k calls) and showed up as operations
            # (`GET /**` was the 404'd /metrics scrape). Dropped before the connectors, so neither the span
            # metrics nor the service graph count them, and Tempo doesn't store them. Child spans of a dropped
            # probe (Spring's health check pinging the database) are kept. Matched by the caller's user agent
            # (the chart's probes hit `/`, which is also a real page) and by the probe/scrape paths.
            filter/probes:
              error_mode: ignore
              traces:
                span:
                  - kind == SPAN_KIND_SERVER and IsMatch(attributes["user_agent.original"], "^(kube-probe|Prometheus)/")
                  - kind == SPAN_KIND_SERVER and IsMatch(attributes["http.user_agent"], "^(kube-probe|Prometheus)/")
                  - kind == SPAN_KIND_SERVER and IsMatch(attributes["url.path"], "^(/healthz|/actuator/health.*|/metrics)$")
                  - kind == SPAN_KIND_SERVER and IsMatch(attributes["http.target"], "^(/healthz|/actuator/health.*|/metrics)$")
                  - kind == SPAN_KIND_SERVER and IsMatch(attributes["http.route"], "^(/healthz|/actuator/health.*|/metrics)$")
            # Names a database edge after the host the client connected to (postgresql-rw, redis-master, mongodb),
            # as Tempo's service graph did, rather than the database name (CNPG's is "app" for every app); Tower
            # maps those Service names to the app's components. Read by service_graph's database_name_attributes.
            transform/db-peer:
              error_mode: ignore
              trace_statements:
                - context: span
                  statements:
                    - set(attributes["hangar.db.peer"], attributes["server.address"]) where attributes["db.system"] != nil and attributes["server.address"] != nil
                    - set(attributes["hangar.db.peer"], attributes["net.peer.name"]) where attributes["db.system"] != nil and attributes["hangar.db.peer"] == nil and attributes["net.peer.name"] != nil
                    - replace_pattern(attributes["hangar.db.peer"], "^([a-z][a-z0-9-]*)\\..*$", "$$1")
            batch:
              timeout: 5s
              send_batch_size: 1024
            # Enriches every signal with k8s pod/namespace/node metadata.
            k8sattributes:
              passthrough: false
              extract:
                metadata:
                  - k8s.pod.name
                  - k8s.namespace.name
                  - k8s.node.name
          connectors:
            # Feeds platform-cicd's pipelines-overview.json "Stage duration (p50/p95)"
            # panel, which queries traces_span_metrics_duration_milliseconds_bucket -
            # only exists once this connector runs. Ported from platform-cicd's
            # kind-observe-specific patch (observability/kind-observe/
            # otel-collector-values-patch.yaml), which this Application's base config
            # was originally transcribed without. Metric name is
            # "traces_span_metrics_*" (underscore), not matching the connector's own
            # "spanmetrics" key - verified live by scraping :8889/metrics directly.
            spanmetrics:
              histogram:
                explicit:
                  buckets: [100ms, 500ms, 1s, 5s, 15s, 30s, 1m, 5m, 15m, 30m, 1h]
              dimensions:
                - name: platform.stage
                - name: platform.chain_id
                - name: governance.stub
              metrics_flush_interval: 15s
            # Who calls whom, for Tower's Airspace and Grafana's service graph: traces_service_graph_request_total,
            # _failed_total and the _server_seconds/_client_seconds histograms, labelled client, server and
            # connection_type ("" for RPC, messaging_system, database, virtual_node for a peer that sends no
            # spans, and client "user" for a request with no traced caller) - the same series Tempo's
            # metrics-generator wrote, so Tower reads either. Computed here so a cluster needs no Tempo for it
            # (hangar-prod runs without one); Tempo's own service-graphs processor is off so edges aren't counted
            # twice. One collector replica sees both sides of every edge; the store waits 10s for the other side
            # (Tempo's setting) because the SDKs and the batch processor each hold spans up to 5s.
            service_graph:
              latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s]
              database_name_attributes: [hangar.db.peer, db.name, db.namespace]
              # A call to something that sends no spans (Dex, an external API) is named after its host instead of
              # "unknown": the connector's defaults, then server.address / net.peer.name.
              virtual_node_peer_attributes: [peer.service.name, peer.service, db.name, db.namespace, db.system, db.system.name, server.address, net.peer.name]
              store:
                ttl: 10s
                max_items: 10000
              metrics_flush_interval: 15s
          exporters:
#@if observability.tempo != false
            otlp/tempo:
              endpoint: tempo.observability.svc.cluster.local:4317
              tls:
                insecure: true
#@end
#@if observability.full
            otlphttp/loki:
              # Loki's native OTLP log-ingestion endpoint
              endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
              tls:
                insecure: true
#@end
            prometheus:
              endpoint: 0.0.0.0:8889
              # Keeps resource attributes (service.name etc.) as labels on the
              # exported metrics.
              resource_to_telemetry_conversion:
                enabled: true
              enable_open_metrics: true
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, filter/probes, transform/db-peer, k8sattributes, batch]
#@if observability.tempo != false
                exporters: [otlp/tempo, spanmetrics, service_graph]
#@end
#@if observability.tempo == false
                exporters: [spanmetrics, service_graph]
#@end
#@if observability.full
              logs:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [otlphttp/loki]
#@end
              metrics:
                receivers: [otlp, spanmetrics, service_graph]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [prometheus]
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        clusterRole:
          create: true
          rules:
            - apiGroups: [""]
              resources: ["pods", "namespaces", "nodes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apps"]
              resources: ["replicasets"]
              verbs: ["get", "list", "watch"]
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
