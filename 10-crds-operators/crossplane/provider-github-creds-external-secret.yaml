# provider-github-creds-external-secret.yaml
#
# Added 2026-08-24. provider-github-config.yaml (this same directory) documents the
# credential as "the Secret itself is never committed here" - true, but it was still a
# hand-`kubectl create secret`-per-cluster-rebuild step, and this cluster's rebuild just
# hit that cost directly: every RepositoryFile managed resource (NodeJSApplication's and
# ApplicationEnvironment's gitops-repo/identity.yaml/values.yaml/secretstore-xr
# composition targets, all of them) failed with "cannot get credentials secret: Secret
# \"provider-github-creds\" not found", which is what surfaced as the
# checkout-api-xr-requests Application sitting Progressing. Same "manual-recreate cost
# outweighs the out-of-chart-boundary argument" call already made for
# pipelines-as-code-secret (2026-08-23,
# ../../50-platform-cicd/tekton-operator/pipelines-as-code-secret-external-secret.yaml) -
# this is that same reasoning applied to a second, independent credential.
#
# secretStoreRef targets platform-secret-store (ClusterSecretStore, cluster-scoped),
# same store platform-cicd-control-plane's own ExternalSecrets and
# pipelines-as-code-secret use - see docs/admin/secrets-management.md
# (platform-cicd) for the backing Infisical project (platform-cicd-kind-dev,
# environmentSlug: shared). provider-github-creds genuinely fits that doc's "platform-wide
# material" bucket: every onboarded tenant's XRs (not one app's) go through this
# credential.
#
# Single flat-value key, not multiple Infisical fields extracted via dataFrom.extract -
# same posture as registry-credentials-dockerconfigjson (that file's own header): the
# ProviderConfig wants exactly one Secret key ("credentials") holding the whole
# {"owner": "...", "token": "..."} JSON blob, so store that already-shaped JSON as one
# Infisical value rather than templating it back together from separate fields.
#
# Plant it by hand, once, in platform-cicd-kind-dev's Infisical project (UI or API,
# never committed here - same "manual by design" posture as every other credential's
# ultimate source in this platform): key provider-github-creds, value
# {"owner": "jfillman", "token": "<classic PAT, repo + delete_repo scopes>"} - see
# provider-github-config.yaml's own header for why those scopes and why a classic PAT
# rather than the GitHub App platform-cicd already uses elsewhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provider-github-creds
  namespace: crossplane-system
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: provider-github-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials
      remoteRef:
        key: provider-github-creds
