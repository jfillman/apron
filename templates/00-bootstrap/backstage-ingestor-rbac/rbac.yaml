# Tekton Results read (2026-09-17, Tower's Release Record - "pull as much
# build/pipeline data as it can into the record"). Originally shaped like
# backstage-ingestor-rekor-proxy above (proxying straight to
# tekton-results-api-service), but that path was verified live and does NOT
# work: the generic services/proxy subresource never forwards this
# identity's Authorization header to the proxied backend pod, and Results'
# own API server does its own TokenReview/SubjectAccessReview check that
# needs to actually see a bearer token - confirmed by hitting Results'
# ClusterIP directly from an in-cluster debug pod with the same token and
# getting a clean 200, versus `{"code":16,"message":"unable to find
# token"}` through services/proxy. Full isolating test in
# HANDOFF-tower-tekton-results.md.
#
# Fix: this grant now targets `tekton-results-relay` (plain HTTP,
# platform-system - see glidepath's
# charts/glidepath-control-plane/templates/tekton/tekton-results-relay.yaml
# and platform/tekton-results-relay/cmd/tekton-results-relay/main.go), a
# small relay that re-issues the request to the real Results API using ITS
# OWN ServiceAccount token instead of trying to forward this identity's.
# This grant still fully controls who may reach the relay at all; Results'
# own RBAC (granted to the relay's own identity, not this one) decides what
# can actually be read once there. Plain HTTP on the relay's own incoming
# side (unlike Results' TLS-only port) means no `https:` scheme-prefix
# variant is needed here, unlike the original grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-ingestor-tekton-results-proxy
  namespace: platform-system
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - tekton-results-relay
      - tekton-results-relay:8080
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-ingestor-tekton-results-proxy
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-ingestor-tekton-results-proxy
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
