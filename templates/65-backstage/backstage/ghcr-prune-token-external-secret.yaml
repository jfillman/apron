# GHCR_PRUNE_TOKEN for Tower's image pruning (backstage imagePrune.ts, 2026-10-10). A classic GitHub PAT with only
# read:packages + delete:packages, 90-day expiry, planted by hand in Infisical under ghcr-prune-token - not
# generated by an assistant. Same secretStoreRef and manual-by-design posture as every other credential here. The
# backend refuses to touch platform packages and deletes only an app's own (<app>, <app>-pr, <app>/cache), after a
# plan an owner confirmed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-ghcr-prune-token
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-ghcr-prune-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-prune-token
