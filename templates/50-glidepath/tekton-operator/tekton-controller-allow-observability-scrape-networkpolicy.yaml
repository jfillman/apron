# Additive NetworkPolicy - Kubernetes unions ingress rules across every policy
# matching a pod, so this doesn't replace anything, it only adds an allow rule.
#
# tektoncd/operator auto-generates its own NetworkPolicy per component (owned by a
# TektonInstallerSet it actively reconciles, so it can't be hand-patched), which only
# allows scrape traffic from a namespace literally named "monitoring" - a hardcoded
# operator default that doesn't match this platform's actual Prometheus namespace,
# "observability". Confirmed live: tekton-servicemonitor.yaml's target showed
# health=down, lastError="context deadline exceeded" (a NetworkPolicy-shaped
# symptom, not a scrape-config problem) until this was added.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-pipelines-controller-allow-observability-scrape
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: platform-cicd
spec:
  podSelector:
    matchLabels: { app: tekton-pipelines-controller }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - port: 9090
          protocol: TCP
