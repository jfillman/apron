# The Clearance agent's own Namespaces and AppProjects (clearance.gate.agent.ownedProject.create): the namespaces in
# clearance.gate.agent.protectedNamespaces and the Argo CD projects in clearance.gate.agent.projects, for a cluster where
# nothing else makes them (the hangar-dev opt-in rehearsal, W-40). A directory source of this folder, everything but this file.
#
# Order: this Application is wave -1, ahead of clearance-argocd-agent (wave 0), whose chart puts a Role in each protected
# namespace (a missing namespace fails that sync); inside, the Namespaces are wave -1 and the AppProjects wave 0.
# The objects carry Prune=false,Delete=false and this Application has no resources-finalizer: removing the setting leaves
# the namespaces and projects in place, and they are deleted by hand (README, "Clearance gate").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clearance-agent-project
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: policy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: @@REPO_URL@@
    targetRevision: main
    path: 56-clearance-gate/agent-project
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
