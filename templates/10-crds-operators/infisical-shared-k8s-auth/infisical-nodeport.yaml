# Exposes Infisical's API on a NodePort, reachable from OTHER kind clusters (the prod cluster
# today) that need cross-cluster access to it for Universal Auth (see the prod cluster's own
# infisical-secretstore-operator instance, the prod cluster's repo's own copy of this
# operator - still active there, unrelated to the dev cluster's decommission) and the
# SecretStore Composition's authMethod logic. A separate object, not editing
# infisical/application.yaml's own Helm-chart-managed Service directly (that Service
# is ArgoCD/Helm-owned; a second, hand-authored one with the same selector avoids
# fighting that ownership on every sync). Lives in this directory (not infisical/'s
# own - a Helm-chart-source Application, not a directory source, wouldn't pick up a
# sibling raw YAML file at all) purely so it gets applied by GitOps at all. Moved
# here from infisical-secretstore-operator/ 2026-09-18, specifically so
# decommissioning that operator on the dev cluster doesn't take the prod cluster's cross-cluster
# access down with it.
#
# Confirmed live, not assumed: the dev cluster's and the prod cluster's control-plane nodes share
# one L3 network on this podman host (10.89.0.0/24) - a pod on the prod cluster can reach
# the dev cluster's node IP directly (verified: a real 403 from the dev cluster's own API server on
# :6443, proving TCP reachability, not just an assumption from `docker network`
# output). This is a LOCAL-SANDBOX-SPECIFIC path - real, separately-hosted upper-env
# clusters would reach Infisical via a real routable endpoint (ingress/VPN/peering),
# not a raw node IP + NodePort. Flagged as a known, accepted simplification for this
# environment, not a pattern to copy blindly into a real multi-cluster deployment.
apiVersion: v1
kind: Service
metadata:
  name: infisical-nodeport
  namespace: infisical
spec:
  type: NodePort
  selector:
    app: infisical-standalone
    component: infisical
    release: infisical
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: @@INFISICAL_NODEPORT@@
