# The real §5 two-source Application, one per (app, env) - generated from
# gitops-cluster-dev-tenants/tenants/<app>/<env>/identity.yaml. Direct descendant of
# platform-cicd's own tenant-onboarding-applicationset.yaml (CICD onboarding), same
# two-source shape, generalized here to app DEPLOYMENT per gitops-strategy.md §5: source
# 0 renders idp-service-catalog's shared idp-application chart with an operator-owned
# valuesObject (identity/placement only - appName/cluster/envName), source 1 is a
# $ref-only pointer into the app's own gitopsRepoUrl supplying just the env's own
# values.yaml as a developer-owned valueFiles overlay. helm.valuesObject beats
# helm.valueFiles for any overlapping key - live-attack-tested in platform-cicd, not
# just assumed here.
#
# identity.yaml duplicates app.yaml's gitopsRepoUrl/githubOwner (see
# ../tenant-appprojects/applicationset.yaml's own header for why: this ApplicationSet's
# git generator only sees the ONE matched file per entry, and a matrix generator to join
# the coarser app.yaml with each per-env identity.yaml is real added complexity these
# are automation-written files don't need - no hand-maintained-file drift risk).
#
# project: "{{.appName}}" (not default) is the actual enforcement boundary from §6 -
# this Application can only ever sync from the sourceRepos the sibling
# tenant-appprojects ApplicationSet scoped for this same app. No explicit ordering
# between the two ApplicationSets: if the AppProject doesn't exist yet when this
# Application is generated, ArgoCD just reports it can't reconcile and self-heals once
# the AppProject lands - same eventually-consistent pattern relied on elsewhere in this
# repo (root-app-of-apps.yaml's own children).
#
# templatePatch (added 2026-08-18): optional 3rd source, a Kustomize
# configMapGenerator for apps with many config files - the concrete need
# idp-application's own `configMaps: existingConfigMap:` field
# (idp-service-catalog/charts/idp-application/values.yaml) was built for, but never had
# an ApplicationSet source wired up until now. Path convention mirrors source 0's own
# valueFiles path (kind-dev/{{.env}}/configmap/, next to kind-dev/{{.env}}/values.yaml)
# - same repo (gitopsRepoUrl, already an AppProject sourceRepos entry, no boundary
# change needed). Unlike source 1's `directory: {exclude: "*"}` guard, this source
# deliberately wants ArgoCD's kustomization.yaml auto-detection to fire - that's the
# whole point.
#
# This can NOT be a conditional `{{ if }}` block wrapping a 3rd item directly inside
# spec.template.spec.sources above - confirmed against ArgoCD's own docs and source
# (applicationset/utils/utils.go): goTemplate:true still renders each string FIELD of
# the already-YAML-parsed template independently, it never text-templates the whole
# document the way Helm does, so control flow can't span or add array elements there
# (ArgoCD's own GoTemplate.md docs: "Using control keywords across fields" is listed
# under "not possible"). `templatePatch` is the real mechanism for this - a separate
# spec-level string that IS rendered as one whole Go-template document first, then
# merged onto the generated Application via `strategicpatch.StrategicMergePatch`
# (applicationset/controllers/template/patch.go on github.com/argoproj/argo-cd; the
# templatePatch field itself is confirmed present in both this cluster's installed
# v3.4.5 and kind-prod's v3.5.0 (01-argocd-platform/install.yaml's own CRD schema, both
# clusters)). Opt-in via an optional `configMapGenerator: true` field on the per-env
# identity.yaml this ApplicationSet's git generator already parses
# (tenants/<app>/<env>/identity.yaml) -
# `hasKey` guards it (same idiom as the Sprig `hasKey` fix in idp-application's own
# `jobs:` hook field, see service-catalog-design.md) so every existing/future tenant
# that doesn't set the field is completely unaffected: no risk of a sync error from a
# kustomization.yaml path that doesn't exist, since most apps won't ever create one.
# When the field isn't set, the patch renders to a literal `{}` - confirmed against
# StrategicMergePatch's own test suite as the safe, unambiguous no-op (unlike a bare
# `spec:` with nothing under it, which YAML-parses to `spec: null` and risks being read
# as "delete spec" - deliberately avoided). Deliberately repeats sources 0 and 1
# verbatim inside the patch rather than trying to append just the 3rd - StrategicMerge-
# Patch replaces `sources` wholesale (no patchMergeKey on that field), so a patch that
# touches `sources` at all must carry the complete array every time.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-onboarding
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: tenant-onboarding
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: https://github.com/jfillman/gitops-cluster-dev-tenants.git
        revision: main
        files:
          - path: "tenants/*/*/identity.yaml"
  template:
    metadata:
      name: "{{.appName}}-{{.env}}"
      labels:
        hangar.io/component: cluster-config
        hangar.io/subcomponent: tenant-onboarding
        hangar.io/app: "{{.appName}}"
        hangar.io/env: "{{.env}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd-apps
    spec:
      project: "{{.appName}}"
      sources:
        - repoURL: https://github.com/jfillman/airframe.git
          targetRevision: v0.3.85
          path: charts/airframe-application
          helm:
            valuesObject:
              appName: "{{.appName}}"
              cluster: kind-dev
              envName: "{{.env}}"
              # Moved here from managedNamespaceMetadata.labels (removed below) - an
              # explicit Namespace manifest (idp-application v0.3.40+) overwrites
              # managedNamespaceMetadata rather than merging with it, so it's a no-op
              # once the chart renders its own Namespace object.
              namespace:
                labels:
                  hangar.io/managed-secrets: "true"
            valueFiles:
              # $-ref value files resolve relative to that source's checkout ROOT -
              # confirmed live in platform-cicd's own version of this pattern.
              - $appsrc/kind-dev/{{.env}}/values.yaml
        - repoURL: "{{.gitopsRepoUrl}}"
          targetRevision: main
          ref: appsrc
          # Without this, ArgoCD's directory-source auto-detection would try to apply
          # every *.yaml in the app's own gitops repo as a raw manifest - this source
          # exists only to be $ref'd for valueFiles above, confirmed real gotcha already
          # hit and documented in platform-cicd's own version of this pattern.
          directory:
            exclude: "*"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{.appName}}-{{.env}}"
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          # Harmless to leave set - a no-op once idp-application's own Namespace
          # manifest already declares the namespace (only fires when the destination
          # namespace isn't in the source manifests at all).
          - CreateNamespace=true
  templatePatch: |
    {{- if hasKey . "configMapGenerator" }}
    {{- if .configMapGenerator }}
    spec:
      sources:
        - repoURL: https://github.com/jfillman/airframe.git
          targetRevision: v0.3.85
          path: charts/airframe-application
          helm:
            valuesObject:
              appName: "{{.appName}}"
              cluster: kind-dev
              envName: "{{.env}}"
              namespace:
                labels:
                  hangar.io/managed-secrets: "true"
            valueFiles:
              - $appsrc/kind-dev/{{.env}}/values.yaml
        - repoURL: "{{.gitopsRepoUrl}}"
          targetRevision: main
          ref: appsrc
          directory:
            exclude: "*"
        - repoURL: "{{.gitopsRepoUrl}}"
          targetRevision: main
          path: kind-dev/{{.env}}/configmap
    {{- else }}
    {}
    {{- end }}
    {{- else }}
    {}
    {{- end }}
