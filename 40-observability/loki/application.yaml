# Single-binary deployment mode - fine for a local/learning-scale cluster; production
# would want deploymentMode: SimpleScalable instead. Depends on minio/ (the `loki`
# bucket) being up first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: observability
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.1.0
    helm:
      releaseName: loki
      valuesObject:
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: s3
            bucketNames:
              chunks: loki
              ruler: loki
              admin: loki
            s3:
              endpoint: minio:9000
              region: us-east-1
              accessKeyId: admin
              secretAccessKey: minioadmin123
              s3ForcePathStyle: true
              insecure: true
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            # Loki's native OTLP endpoint maps OTel resource/log attributes to Loki
            # labels/structured metadata per this config - keeps cardinality sane by
            # NOT turning every attribute into an indexed label (trace_id ends up as
            # structured metadata, not a label).
            allow_structured_metadata: true
        deploymentMode: SingleBinary
        # The chart's chunks/results caches default to production-scale memcached
        # sizing (chunksCache.allocatedMemory: 8192 -> a ~9.8Gi memory *request*,
        # which pends forever with "Insufficient memory" on a small kind node) - not
        # worth right-sizing for single-binary, just off.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 10Gi
        gateway:
          enabled: true
        # Disable the extra components SimpleScalable mode would otherwise want.
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
