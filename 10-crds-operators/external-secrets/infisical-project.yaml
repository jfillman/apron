# infisical-project.yaml
#
# kind-prod's own copy of platform-cicd's Infisical project - see platform-cicd's
# charts/platform-cicd-control-plane/templates/secretstore/infisical-project.yaml for
# the kind-dev sibling and full rationale (one project PER CLUSTER for this platform's
# own operational secrets, not shared across clusters, not reusing any app's own
# per-(app,cluster) project). Same InfisicalProject CRD (secrets.idp.io/v1alpha1),
# reconciled by this cluster's own infisical-secretstore-operator instance
# (10-crds-operators/infisical-secretstore-operator, already running here for idp's
# own per-app kind-prod SecretStores) - hand-authored here rather than templated from
# a Helm chart, same reason cluster-secret-store.yaml (this directory) already is:
# kind-prod has no platform-cicd-control-plane release of its own.
#
# authMethod: universal - kind-prod isn't the Infisical host, see
# cluster-secret-store.yaml's own header.
#
# Holds this cluster's own registry-credentials (GHCR pull secret) and
# platform-outcome-relay-token (the caller-side copy the release-tracking hook Jobs
# present to platform-cicd's argocd-outcome-relay on kind-dev) - both planted by hand
# once, same "manual by design" posture as every other credential's ultimate source in
# this platform.
apiVersion: secrets.idp.io/v1alpha1
kind: InfisicalProject
metadata:
  name: platform-cicd-kind-prod
  namespace: platform-secrets
  labels:
    hangar.io/subcomponent: "secretstore"
spec:
  projectName: platform-cicd-kind-prod
  slug: platform-cicd-kind-prod
  environmentSlug: shared
  credentialsSecretName: platform-cicd-infisical-creds
  authMethod: universal
