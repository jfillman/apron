# secretstore-xr.yaml
#
# the prod cluster's platform-cicd Infisical project, provisioned by the SecretStore Composition
# through provider-infisical - the the prod cluster sibling of glidepath-control-plane's
# templates/secretstore/infisical-project.yaml on the dev cluster. Replaces the hand-authored
# InfisicalProject CR (infisical-project.yaml, removed) that the old
# infisical-secretstore-operator reconciled.
#
# WHICH project this adopts, and why it is not "platform-cicd-<cluster>-v2": the project
# holding this cluster's real platform secrets (GitHub App keys, registry credentials,
# the Anthropic key, Backstage tokens, ...) is the ORIGINAL `platform-cicd-<cluster>`.
# The `-v2` project the old CR created (see the header of the removed file for why) was
# empty and referenced by nothing; platform-secret-store (cluster-secret-store.yaml, this
# directory) has always read the original one. Slug <appRef.name>-<cluster> below is
# exactly `platform-cicd-<cluster>`, and the ConfigMap entry
# crossplane-system/secretstore-provisioner[platform-cicd-<cluster>] adopts its existing
# project and `shared` environment by id, so no secret moves.
#
# Order matters and is why this file arrived in its own commit AFTER that ConfigMap entry:
# without the entry this Composition renders the OLD operator CR, whose name would collide
# with the CR that used to live here.
#
# Composed here: Project + ProjectEnvironment (adopted), a NEW machine identity with
# universal auth, and the credentials Secret platform-cicd-<cluster>-infisical-creds in
# this namespace. platform-secret-store reads that Secret. The Composition also renders a
# ClusterSecretStore named platform-cicd-<cluster> scoped to ^app-platform-cicd-.*$ - it
# matches no namespace and is unused; it is what the XRD always composes.
# Tier 2 domain-rename migration (see memory project_tier2_domain_rename_plan.md): adopted by id
# via the secretstore-provisioner ConfigMap (crossplane-system, this cluster) - the real Infisical
# project/secrets are untouched, only this wrapper XR's group and its Identity (which
# platform-secret-store's own credentialsSecretName picks up automatically, unchanged) change.
apiVersion: catalog.hangar.io/v1alpha1
kind: SecretStore
metadata:
  name: glidepath-@@CLUSTER_NAME@@
  namespace: glidepath-secrets
  labels:
    hangar.io/subcomponent: "secretstore"
spec:
  appRef:
    name: glidepath
  cluster: @@CLUSTER_NAME@@
  environmentSlug: shared
