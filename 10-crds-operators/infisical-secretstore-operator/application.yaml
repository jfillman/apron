# infisical-secretstore-operator - platform infra, service-catalog-design.md Item 8.
# Reconciles InfisicalProject CRs (secrets.idp.io/v1alpha1) against the Infisical
# instance installed by this directory's sibling `infisical/` Application. Source
# (Dockerfile, kopf operator, CRD) lives in idp-service-catalog/operators/ - this
# directory carries only the deployable manifests (CRD copy + RBAC + Deployment),
# same source-repo/deploy-repo split already used for e.g. crossplane/providers.yaml
# referencing a pinned provider image rather than vendoring provider source here.
#
# Image is NOT yet pushed to a real registry - built locally and `kind load
# image-archive`'d directly into kind-dev's containerd for this first live-verify
# pass (imagePullPolicy: Never below enforces using that local image, not attempting
# a registry pull). A real CI/registry pipeline (mirroring platform-cicd's own
# GHCR chart-publish pattern) is required before this can run on kind-prod or be
# considered production-representative - not built here, flagged rather than silently
# assumed away.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-secretstore-operator
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-dev.git
    targetRevision: main
    path: 10-crds-operators/infisical-secretstore-operator
    directory:
      exclude: "{application.yaml}"
  # Same namespace as the infisical/ Application, deliberately - the operator reads
  # infisical-bootstrap-secret (INFISICAL_ADMIN_TOKEN) via a plain env secretKeyRef,
  # which Kubernetes only supports same-namespace. Simpler than mirroring that Secret
  # cross-namespace for a single-consumer, tightly-coupled-to-this-one-instance case.
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
