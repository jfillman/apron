# Tower break-glass debug recordings (backstage breakglass.ts, phase 2, 2026-10-10). A MinIO access key on the dev cluster
# scoped to put/get on tower-breakglass/* only, planted by hand in Infisical as tower-breakglass-minio-access-key and
# tower-breakglass-minio-secret-key - not generated by an assistant. The backend uploads each session's asciicast
# to tower-breakglass/<app>/<env>/<id>.cast at session end and streams it back to owners and admins.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-breakglass-minio
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-breakglass-minio
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: tower-breakglass-minio-access-key
    - secretKey: secret-key
      remoteRef:
        key: tower-breakglass-minio-secret-key
