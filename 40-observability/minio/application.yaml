# Object storage backing Thanos/Loki/Tempo's long-term buckets - one MinIO instance,
# three buckets, matching /Users/jerf/tech/observability/README.md (the original
# source design this whole stack is transcribed from). Single replica, hardcoded
# dev credentials - fine for a disposable kind cluster, NOT a pattern to reuse
# anywhere real (same caveat the source README states explicitly).
#
# Community `minio/minio` chart (charts.min.io), NOT bitnami/minio - the source
# README documented both as alternatives; kind-observe's real live version (5.4.0,
# per this repo's own README table) only resolves against the community chart's
# version numbering, confirmed via `helm search repo` before picking this one - the
# bitnami chart's current version range (15.x) doesn't overlap at all.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: observability
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      releaseName: minio
      valuesObject:
        mode: standalone
        replicas: 1
        resources:
          requests:
            memory: 512Mi
        rootUser: admin
        rootPassword: minioadmin123
        # Real bug, caught live: the source README's `--set
        # defaultBuckets="thanos\,loki\,tempo"` doesn't match this chart version's
        # actual schema at all (`helm show values minio/minio --version 5.4.0` has
        # no `defaultBuckets` key) - Helm silently ignores unknown value keys rather
        # than erroring. Real field is `buckets:`, a list of {name, policy} objects -
        # set correctly below. Doesn't actually create the buckets though: see
        # create-buckets-job.yaml in this same directory for a SECOND real bug this
        # chart version has (the post-install Job's own createBucket() function is
        # defined but never called), and the workaround.
        buckets:
          - name: thanos
            policy: none
          - name: loki
            policy: none
          - name: tempo
            policy: none
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
