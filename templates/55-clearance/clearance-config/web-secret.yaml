# The Clearance web UI's OIDC client secret (clearance.web.enabled), from the owner's Infisical project; never in git. The
# same Infisical key feeds both ends: clearance web reads it as a file (client-secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clearance-web-oidc
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance, hangar.io/subcomponent: clearance-web}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: clearance-web-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: clearance-web-oidc-client-secret}
