# Infisical Community Edition, self-hosted - idp/docs/service-catalog-design.md Item 8:
# "Infisical itself... is shared platform infrastructure, not a service-catalog item -
# installed once, cluster-admin-owned, in idp-cluster-baseline's 10-crds-operators/
# group alongside ESO's own controller." This Application is that install. It does NOT
# create any per-app project/isolation - that's the not-yet-built SecretStore XRD's job
# (idp-service-catalog), which configures Infisical's API against this instance.
#
# Chart identity confirmed live, not guessed (the repo's own folder name,
# infisical-standalone-postgres, does not match what's actually published - verified via
# the real Cloudsmith index.yaml): repo https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/,
# chart `infisical-standalone` (bundles Bitnami postgresql 14.1.10 + redis 18.14.1 as
# dependency subcharts - the upstream-documented "testing/POC" deployment path, not the
# HA path, matching this being a kind-dev, not a licensed-enterprise, install).
#
# infisical.replicaCount: 1 - chart default is 2 for HA; kind-dev is a single node, so a
# second replica buys no real redundancy, just idle resource cost.
#
# ingress.enabled: false AND ingress.nginx.enabled: false (two separate keys - confirmed
# live via `helm template` that enabled:false alone still installs the entire bundled
# ingress-nginx subchart, gated by its own `condition: ingress.nginx.enabled`, not
# `ingress.enabled`). Skipped for now: nothing in the SecretStore XRD's design needs the
# web UI reachable from outside (ESO and the future SecretStore XRD both talk to
# Infisical's API via its in-cluster ClusterIP Service); use `kubectl port-forward` for
# UI access until there's a real reason to expose it - avoids standing up a second,
# redundant ingress controller next to Contour (already this cluster's real one) for a
# component that doesn't need one yet.
#
# postgresql.auth.password / redis.auth.password: traced through this chart's own
# templates/_helpers.tpl (infisical.postgresDBConnectionString / redisConnectionString) -
# both read .Values.postgresql.auth.password / .Values.redis.auth.password directly to
# build DB_CONNECTION_URI/REDIS_URL as plaintext `env.value`, not a secretKeyRef. Setting
# postgresql.auth.existingSecret instead (the usual Bitnami-chart way to avoid this) does
# NOT work here - it only changes what password the bundled Postgres StatefulSet itself
# is initialized with, while the Infisical app container would still read the separate,
# un-overridden .Values.postgresql.auth.password to build its connection string,
# authenticating with the wrong credential. The only real way to route these through a
# pre-created Secret is postgresql.useExistingPostgresSecret (a fully external, BYO
# Postgres - out of scope for a first kind-dev pass, no such instance exists yet).
# Accepted tradeoff, not an oversight, and flagged rather than hidden: the values below
# ARE plaintext in this committed file, unlike every other credential in this platform.
# Generated with `openssl rand -hex 20` (better than the chart's own literal shipped
# defaults, "root" / "mysecretpassword", but still committed in the clear) because this
# specific chart structurally requires it - see above. Scoped acceptable because these
# protect ClusterIP-only Postgres/Redis instances with zero external exposure and zero
# reuse anywhere else, not because plaintext-in-git is fine in general. Real fix, once it
# exists: point Infisical at an externally-provisioned Postgres/Redis (e.g. a future
# `Database`/`Redis` Attached-tier XRD, service-catalog-design.md Item 7) via
# `postgresql.useExistingPostgresSecret` instead of the bundled dependency subcharts.
#
# infisical.kubeSecretRef stays at the chart's own default, "infisical-secrets" - NOT
# created by this Application. Same "user creates it by hand, never pasted to an
# assistant" convention platform-cicd's secretStore.sourceNamespace already established
# (docs/secrets-management.md) - this Secret holds AUTH_SECRET/ENCRYPTION_KEY/SITE_URL,
# the actual keys to every secret Infisical will ever hold, a different risk class than
# the internal DB/Redis passwords above. Create it before this Application first
# syncs successfully:
#   kubectl create namespace infisical
#   kubectl create secret generic infisical-secrets -n infisical \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -hex 16)" \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=SITE_URL="http://localhost:8080"
# (ENCRYPTION_KEY must be exactly 32 hex chars / 16 bytes - confirmed against Infisical's
# own .env.example, which documents this shape, not guessed.)
#
# infisical.autoBootstrap: enabled so a fresh instance gets its organization and an
# instance-admin machine identity declaratively (infisical bootstrap CLI under the hood),
# rather than by clicking through setup. It was originally wanted for the retired
# infisical-secretstore-operator, which consumed that identity's token; nothing consumes it by
# default any more (provider-infisical uses its own hand-created universal-auth identity), so
# the Instance Admin Identity's token is a leftover - revoke it once the instance is up.
# `--ignore-if-bootstrapped=true` (chart default, unconditional) makes this safe to
# leave enabled permanently - a no-op Job on every sync after the first.
# organization: "idp" overrides the chart default "default-org" - traced through
# templates/bootstrap-job.yaml: --organization is a CLI flag templated from THIS
# values field, not read from the credential Secret's own
# INFISICAL_ADMIN_ORGANIZATION env var (that env var is effectively unused by this
# specific Job) - set here so the real org name is controlled declaratively, matching
# what the credential-secret creation instructions below already say.
# secretDestination.namespace: "infisical" overrides the chart's literal default
# value "default" (not auto-derived from the release namespace despite the
# values.yaml comment implying so for an empty string - the shipped default is a
# non-empty literal) - without this override the bootstrap secret would land in the
# cluster's actual `default` namespace, not here.
#
# Requires a second, one-time manually-created Secret before this can actually run
# (same "never pasted to an assistant" convention as infisical-secrets above):
#   kubectl create secret generic infisical-bootstrap-credentials -n infisical \
#     --from-literal=INFISICAL_ADMIN_EMAIL="platform-admin@idp.local" \
#     --from-literal=INFISICAL_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=INFISICAL_ADMIN_ORGANIZATION="idp"
# (INFISICAL_ADMIN_ORGANIZATION is set here for completeness/CLI-flag-alternative
# safety even though this Job's own --organization flag wins - see above.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: infisical-standalone
    targetRevision: 1.10.0
    helm:
      releaseName: infisical
      valuesObject:
        infisical:
          replicaCount: 1
          kubeSecretRef: infisical-secrets
          extraEnv:
            # Required for provider-infisical's IdentityKubernetesAuth (which sets kubernetesHost to
            # this cluster's in-cluster API address) to work at all - confirmed
            # live: Infisical's backend rejects kubernetesHost with a real "Local IPs
            # not allowed as URL" 400 otherwise, an SSRF guard that has no exception
            # for "this is a self-hosted instance and the target IS the same
            # cluster's own API server, on purpose." Documented, not guessed
            # (infisical-self-host skill's environment-variables reference,
            # ALLOW_INTERNAL_IP_CONNECTIONS, default false, "useful for Kubernetes").
            - name: ALLOW_INTERNAL_IP_CONNECTIONS
              value: "true"
          autoBootstrap:
            enabled: true
            organization: idp
            secretDestination:
              namespace: infisical
            image:
              # Chart default (0.41.86, no arch suffix) crashes on kind-dev - real
              # bug in that published image, not our config: its "arm64" manifest
              # entry actually contains amd64 binary content (confirmed live -
              # `podman inspect` reports Architecture: arm64, but the crash's own
              # stack trace names runtime/asm_amd64.s), which then runs under
              # transparent QEMU emulation and hits a well-known Go-runtime-under-
              # emulation crash (`fatal error: lfstack.push invalid packing`) on
              # every single invocation, even `--version` alone - reproduced
              # directly via podman before ever touching the Job. The explicit
              # `-arm64`-suffixed tag is genuinely native (confirmed: runs clean,
              # `bootstrap --help` shows identical flags to what this chart's Job
              # already passes) - no other chart change needed.
              tag: "0.43.99-arm64"
        ingress:
          enabled: false
          nginx:
            enabled: false
        postgresql:
          enabled: true
          auth:
            # Freshly generated by hack/customize-cluster.sh at repo-generation time
            # (openssl rand -hex 20, same method this file's own header already
            # documents) - never copied from another cluster's real running value.
            password: "__INFISICAL_PG_PASSWORD__"
        redis:
          enabled: true
          auth:
            password: "__INFISICAL_REDIS_PASSWORD__"
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
