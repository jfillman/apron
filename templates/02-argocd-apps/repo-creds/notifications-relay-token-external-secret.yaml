# The bearer token argocd-apps' notifications controller sends to glidepath's
# argocd-outcome-relay (ADR-0021 phase 2). The SAME per-cluster token the hook Jobs and the
# Rollouts notification config use, from the same Infisical key, merged into the
# argocd-notifications-secret the argo-cd chart already creates empty (Merge, not Owner: the
# chart owns that Secret, this only adds one key to it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-relay-token
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-repo-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Merge
  data:
    - secretKey: relay-token
      remoteRef:
        key: platform-outcome-relay-token
