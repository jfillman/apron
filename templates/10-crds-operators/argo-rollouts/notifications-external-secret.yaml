# The bearer token the Rollouts notifications engine sends to glidepath's argocd-outcome-relay
# (ADR-0021). The SAME per-cluster token the hook Jobs use today, from the same Infisical key
# (platform-cicd-<cluster> project, via platform-secret-store), merged into the
# argo-rollouts-notification-secret, which this ExternalSecret owns (install.yaml's empty copy is rendered only
# on the control plane, where notifications are off). It was Merge into install.yaml's Secret before: Argo CD
# kept resetting the Secret to empty and ESO kept refilling it.
#
# The defaults ESO fills in (conversionStrategy, decodingStrategy, metadataPolicy, deletionPolicy) are written
# out so the live object matches git and the Application stops showing it OutOfSync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-rollouts-notification-token
  namespace: argo-rollouts
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: release-facts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: argo-rollouts-notification-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: relay-token
      remoteRef:
        key: platform-outcome-relay-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
