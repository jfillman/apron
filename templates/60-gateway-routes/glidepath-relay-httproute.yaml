# Glidepath's release relay on the hub's gateway (gateway.fleetRoutes, runtime eks): upper clusters' Argo CD and Argo
# Rollouts notifications post release facts here (fleet.relayUrl https://relay.<hub domain>) instead of the
# glidepath-relay NodePort (30880), which only works when every cluster shares one host network. Each cluster presents
# its own relay token (glidepath.relaySecretName), and the load balancer admits only traefik.loadBalancer.sourceRanges.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glidepath-relay
  namespace: platform-system
spec:
  parentRefs:
    - name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
  hostnames:
    - relay.@@CLUSTER_DOMAIN@@
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: glidepath-relay
          port: 8080
