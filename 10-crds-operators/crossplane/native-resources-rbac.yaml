# Crossplane's own controller ServiceAccount has no built-in RBAC for native
# resource kinds a Composition composes directly (only for Crossplane's own
# API types) - each one needs an explicit grant here, aggregated into the
# controller's role via the rbac.crossplane.io/aggregate-to-crossplane label.
# This ClusterRole existed live on kind-dev already (argoproj.io/batch, for
# the ai-rollout Application Composition's Rollout/AnalysisTemplate/Job) but
# was never captured in git - recreated here from live state.
#
# monitoring.coreos.com (PrometheusRule) was added for the SLO Composition's
# original hand-rolled revision, which composed a PrometheusRule directly.
# That revision switched to wrapping Sloth (see service-catalog-design.md
# Item 4) - the SLO Composition now composes a `sloth.slok.dev/v1
# PrometheusServiceLevel` instead, and Sloth's OWN controller (its own
# ServiceAccount/RBAC, installed via 10-crds-operators/sloth/) creates the
# actual PrometheusRule, not Crossplane. Left the monitoring.coreos.com grant
# in place regardless (harmless, and nothing else currently needs it removed)
# and added sloth.slok.dev for the new PrometheusServiceLevel type Crossplane's
# controller now composes directly (ConfigMap needed no such grant either way
# - already covered by Crossplane's own core-API-group role).
#
# (secrets.idp.io InfisicalProject/InfisicalEnvironment were granted here for the retired
# infisical-secretstore-operator path of the SecretStore Composition; removed 2026-09-23 - that
# Composition now composes provider-infisical kinds, whose RBAC the provider package grants.) external-secrets.io/ClusterSecretStore is NOT here,
# deliberately - that Composition wraps it in a provider-kubernetes Object instead
# of composing it directly (Crossplane v2 rejects composing a cluster-scoped native
# resource from this namespaced XR) - see
# 10-crds-operators/crossplane/provider-kubernetes-config.yaml for that RBAC
# instead. objects.kubernetes.m.crossplane.io itself needs no entry here - it's a
# Crossplane-provider-installed type, already covered by the package manager's own
# aggregate-to-crossplane wiring (confirmed live:
# crossplane:provider:provider-kubernetes-*:aggregate-to-edit already carries that
# label).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:native-resources:aggregate-to-crossplane
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status", "analysistemplates", "analysistemplates/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "prometheusrules/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sloth.slok.dev"]
    resources: ["prometheusservicelevels", "prometheusservicelevels/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
