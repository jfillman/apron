# gitops-strategy.md §10: this app's own lower-env self-service tier. A per-app
# ApplicationSet - this chart's second templated-output resource kind after
# appproject-lower.yaml, extending the established "Application renders some other
# kind via a chart" trick one level further (ApplicationSet can't be generated
# directly by an ApplicationSet either, same reason AppProject can't - see
# ../../applicationset.yaml's own header).
#
# Its git `files` generator watches THIS APP'S OWN src repo (.Values.appRepoUrl - a
# different repo per app-instance of this chart, which is what makes per-app fan-out
# to N different app repos possible at all - a single git generator can only ever
# have one static repoURL, so watching every app's own repo from one global
# ApplicationSet isn't achievable; one ApplicationSet PER app, generated here as part
# of that app's own onboarding, is the real shape) for platform/envs/*.yaml,
# live-read, no gitops-<app-name> repo involved at all for this tier - a developer
# commits straight to platform/envs/ in their own repo and pushes, no release
# pipeline, no gitops-cluster-dev-tenants commit, matching platform-cicd's own
# tracked-copy -> live-read precedent for cicd.yaml.
#
# IMPORTANT for future editors: this file's own `template:` block uses ArgoCD
# ApplicationSet's OWN goTemplate syntax (goTemplate: true - .envName, .path.path
# etc, resolved by ArgoCD at generate-time), which collides with THIS chart's Helm
# template engine (this file is rendered by Helm FIRST, when the parent
# tenant-appprojects Application syncs, one layer above ArgoCD's own template
# resolution of the ApplicationSet object this renders). Identical collision
# platform-cicd's own tenant-onboarding-applicationset.yaml already hit and solved
# (charts/platform-cicd-control-plane/templates/argocd/, e.g.
# "{{ "{{" }}.platformIdentity.appName{{ "}}" }}") - every ArgoCD template expression
# below is escaped the same way, as a literal double-curly-brace string, for Helm to
# emit verbatim. Do not "simplify" these - Helm would otherwise try to resolve e.g.
# .envName against ITS OWN (nonexistent) root context and break the render.
#
# envName: read from the matched FILE'S OWN `envName:` field (self-describing), not
# parsed from its path - same self-describing-content idea <env>/identity.yaml
# already uses elsewhere in this design, but a DIFFERENT field name than that
# file's own `env:` - confirmed live and real, not theoretical: THIS file (unlike
# identity.yaml) also gets fed straight into idp-application's own Helm values as
# valueFiles below, where `env:` is already a reserved key (the chart's Embedded-
# tier container env-var list - its own values.yaml explicitly documents choosing
# `envName` over `env` for exactly this collision risk, which a first pass here
# still walked into: `env: dev` in a real platform/envs/dev.yaml produced a real
# "range can't iterate over dev" Helm error inside idp-application's own
# workloadEnv helper). valueFiles below still needs the LITERAL matched path
# though (a developer's file isn't required to be named <env-value>.yaml, e.g.
# `envName: my-sandbox` could live in platform/envs/scratch.yaml) - the
# generator's own path metadata gives that (see valueFiles' own comment for the
# exact fields - confirmed live, not just assumed from ArgoCD's docs).
{{- if .Values.appRepoUrl }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.appName }}-lower-envs
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: tenant-onboarding
    hangar.io/app: {{ .Values.appName }}
    hangar.io/env-tier: lower
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: {{ .Values.appRepoUrl }}
        revision: main
        files:
          - path: "platform/envs/*.yaml"
  template:
    metadata:
      name: "{{ .Values.appName }}-{{ "{{" }}.envName{{ "}}" }}"
      labels:
        hangar.io/component: cluster-config
        hangar.io/subcomponent: tenant-onboarding
        hangar.io/app: {{ .Values.appName }}
        hangar.io/env: "{{ "{{" }}.envName{{ "}}" }}"
        hangar.io/env-tier: lower
      # Cascade-deletes this env's real resources, AND the namespace itself, if the
      # developer removes their own platform/envs/<file>.yaml - idp-application now
      # renders an explicit Namespace object (v0.3.40+, see that chart's own
      # templates/namespace/namespace.yaml header), tracked and pruned like any other
      # resource instead of only existing via CreateNamespace=true. Same finalizer/
      # reasoning used by every other generated Application in this design.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd-apps
    spec:
      project: {{ .Values.appName }}-lower
      sources:
        # Source 0: idp-service-catalog's shared idp-application chart,
        # operator-owned valuesObject - identity/placement only, same
        # helm.valuesObject-beats-helm.valueFiles precedence property
        # tenant-onboarding/applicationset.yaml already relies on (live-attack-tested
        # elsewhere in this project). Pin matches tenant-onboarding/applicationset.yaml's
        # own pin exactly - bumped together, same reasoning both times: no version
        # skew introduced between the two consumers of this chart. Was v0.1.0 for a
        # long stretch (confirmed byte-identical through v0.3.5); bumped to v0.3.9 for
        # the real registryCredentials fix (private-registry pull 401 hit live on
        # checkout-api's dev Rollout); v0.3.17 briefly added an always-on
        # attached/secretstore.yaml chart resource, SUPERSEDED same day - bumped to
        # v0.3.18, which deletes that template entirely (SecretStore provisioning
        # moved to NodeJSApplication/ApplicationEnvironment's own xr-requests
        # commits instead - idp/docs/service-catalog-design.md Item 8's third
        # revision) and fixes external-secret.yaml to actually route through the
        # per-environment stores. v0.3.19 fixes a second, real live bug in the same
        # file: a shared secret on kind-dev still got a "shared/" path prefix even
        # though "shared" is the Infisical ENVIRONMENT's own name now (already
        # selected by the store), not a folder - confirmed live via
        # app-checkout-api-dev's real ExternalSecret (SecretSyncedError) and the
        # real Infisical API (both test secrets live at secretPath "/", no "shared"
        # folder exists). v0.3.35 (2026-08-19): platform-cicd's registry-credentials
        # moved off a per-app opt-in ExternalSecret onto a control-plane-rendered
        # ClusterExternalSecret - a real miss bumping this file's own pin the same day
        # as tenant-onboarding/applicationset.yaml's, caught only once this exact
        # Application (checkout-api-dev) was found still stuck on v0.3.19, unable to
        # sync at all (a separate, pre-existing gap: this ArgoCD instance had no
        # registered git credentials for private app repos like checkout-api - see
        # argocd-repo-creds-jfillman, this namespace).
        - repoURL: {{ .Values.idpServiceCatalogRepoUrl }}
          targetRevision: v0.3.86
          path: charts/airframe-application
          helm:
            valuesObject:
              appName: {{ .Values.appName }}
              cluster: kind-dev
              envName: "{{ "{{" }}.envName{{ "}}" }}"
              # Moved here from managedNamespaceMetadata.labels (removed below) - an
              # explicit Namespace manifest (idp-application v0.3.40+) overwrites
              # managedNamespaceMetadata rather than merging with it, so it's a no-op
              # once the chart renders its own Namespace object.
              namespace:
                labels:
                  hangar.io/managed-secrets: "true"
            valueFiles:
              # Confirmed live (two real failures getting here, both left as history
              # in this comment since the exact shape of ArgoCD's git-files-generator
              # `path` param isn't documented anywhere in this project otherwise):
              # `.path` is a MAP, not a string - {{ "{{" }}.path{{ "}}" }} alone
              # renders Go's default map stringification
              # (`map[basename:envs ... filename:dev.yaml path:platform/envs
              # segments:[platform envs]]`), not a clean path, and produced a real
              # "matched no files" ArgoCD error live. `.path.path` (not `.path`) is
              # the map's own directory-string field ("platform/envs") - an earlier
              # attempt using ONLY `.path.path` (assuming it was the full file path)
              # produced a different real failure first ("is a directory" from helm
              # template, since it's the directory, not the file). `.path.filename`
              # is the bare matched filename ("dev.yaml"). Concatenating both fields
              # is the correct full path - reconstructing it this way rather than a
              # single convenience field because none exists in this generator's
              # param shape.
              - $appsrc/{{ "{{" }}.path.path{{ "}}" }}/{{ "{{" }}.path.filename{{ "}}" }}
        # Source 1: $ref-only into the SAME app repo the generator above already
        # reads from - this tier has no separate gitops repo at all (§10's whole
        # point). directory.exclude: "*" - without it, ArgoCD's directory-source
        # auto-detection would try to apply every *.yaml in the app's own repo as a
        # raw manifest, a real gotcha already hit and documented by
        # tenant-onboarding/applicationset.yaml's own version of this pattern.
        - repoURL: {{ .Values.appRepoUrl }}
          targetRevision: main
          ref: appsrc
          directory:
            exclude: "*"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{ .Values.appName }}-{{ "{{" }}.envName{{ "}}" }}"
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          # Harmless to leave set - a no-op once idp-application's own Namespace
          # manifest already declares the namespace (only fires when the destination
          # namespace isn't in the source manifests at all).
          - CreateNamespace=true
{{- end }}
