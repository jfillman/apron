# Tower's Tekton "Re-run" + "Cancel" actions (2026-09-14/15,
# HANDOFF-tower-write-actions.md Tier 1 - the write-action security
# framework that handoff establishes: a "delegated action" whose blast
# radius is scoped by RESOURCE KIND, not a broad standing grant). This is
# the one deliberate exception to this file's otherwise read-only posture
# (README.md) - `create` + `patch` on PipelineRuns only, nothing else: no
# get/list/watch here because Tower already reads PipelineRuns/TaskRuns
# through the ordinary Kubernetes proxy's ClusterRole `view` binding above,
# and no delete because neither action needs it - re-running submits a
# brand-new PipelineRun (a clone of the failed one, fresh generateName)
# rather than mutating the original, and cancelling is itself a `patch`
# (spec.status -> CancelledRunFinally), never a removal.
#
# Note on `patch`'s real scope: Kubernetes RBAC has no field-level
# granularity - this verb technically lets the identity PATCH any field of
# any PipelineRun, not just spec.status, the same way `create` above
# technically allows any PipelineRun spec, not just a faithful re-run clone.
# What's actually sent is constrained by this repo's own frontend/backend
# code (useCancelPipelineRun.ts sends only a spec.status merge-patch), not
# by RBAC itself - narrowing further would need a validating webhook, which
# doesn't exist here. Same honest-scope posture as every other grant in
# this file.
#
# Cluster-scoped (not namespaced to one app's app-<name>-cicd) for the same
# reason backstage-argo-rollouts-viewer above is cluster-scoped: onboarded
# apps each get their own -cicd namespace and this identity has no way to
# know the full set up front, same as every other resource-kind grant here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Name predates Cancel (2026-09-14, re-run only) - kept as-is rather than
  # renamed to `...-actions` so this stays the same object ArgoCD already
  # manages instead of orphaning it (this Application's syncPolicy has no
  # `prune: true`, so a rename here wouldn't clean up the old name on its
  # own). The rules below are what actually govern scope, not the name.
  name: backstage-tekton-rerun
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "patch"]
---
# Tower's Topology tab "all resources" gallery (2026-09-17) - RBAC objects
# (Roles/RoleBindings/ClusterRoles/ClusterRoleBindings) are deliberately
# excluded from the `view` ClusterRole's own aggregation (Kubernetes never
# lets `view`/`edit` see who-can-do-what by default, for the same reason it
# excludes Secret data), so a dedicated grant is the only way to surface
# them, same reasoning as every other CRD-shaped exception in this file.
# ClusterRole/ClusterRoleBinding added alongside the namespaced pair
# (2026-09-17, same day) once the gallery's RBAC view started resolving a
# RoleBinding's roleRef to its actual rules - that reference is very
# commonly a ClusterRole (bound just within one namespace via a
# RoleBinding), so resolving it needs read access to ClusterRoles too, not
# just Roles. Read-only, no different in spirit from the `view` binding
# this identity already has for every other resource kind - this only adds
# visibility into RBAC *configuration* (which subjects a binding names,
# which rules a Role/ClusterRole grants), never lets this identity exercise
# those grants itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-rbac-viewer
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-rbac-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-rbac-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
