# Live-verified 2026-08-16 against a real throwaway kind cluster before ever touching
# kind-dev - see this directory's own README for the full verification writeup.
#
# targetNamespace: tekton-pipelines - the operator installs EVERY component
# (Pipelines/Triggers/Chains/Dashboard/PaC) into this ONE namespace, confirmed live, not
# each component's own conventional namespace (tekton-chains/pipelines-as-code) a
# raw-manifest install (kind-observe's) uses. platform-cicd's own
# charts/platform-cicd-control-plane and charts/platform-cicd-catalog both consume this
# same value via tektonChainsNamespace (hack/values-kind-dev.yaml) - keep both in sync if
# this ever changes.
#
# dashboard.readonly: true - the operator's own default is false (write-enabled).
# platform-cicd's own bootstrap.sh deliberately installs Tekton Dashboard's read-only
# variant everywhere else, specifically to avoid a standing bypass around the "no
# elevated identity anywhere" posture (see hack/bootstrap.sh's own Dashboard comment) -
# this makes the operator match that same posture explicitly rather than silently
# installing the wrong mode.
#
# result.disabled: false - Tekton Results ENABLED 2026-09-17 for long-term pipeline data
# retention. Grafana/DORA-exporter/CDEvents track metrics and events, not the actual
# PipelineRun/TaskRun objects (full spec+status+step logs) - those previously only lived
# in etcd until pipelinerun-pruner-cronjob (glidepath-control-plane chart) deleted
# everything past the newest-per-pipeline after 24h, with no durable archive at all.
#
# is_external_db: false (unchanged) - no general-purpose Postgres provisioning path
# exists in this stack (Crossplane here only manages GitHub repos), so the operator's own
# auto-managed internal Postgres+PVC is used rather than standing up a dedicated one.
#
# secret_name: tekton-results-s3 (this directory's own tekton-results-s3-secret.yaml) -
# S3 log/result storage reuses the observability MinIO instance (a `tekton-results`
# bucket added to 40-observability/minio/create-buckets-job.yaml's existing
# thanos/loki/tempo bucket job) rather than a dedicated MinIO.
#
# watcher.completed_run_grace_period: "1h" - the Results watcher archives-then-deletes
# each completed run's CR within an hour of completion, well ahead of the separate
# pipelinerun-pruner-cronjob's 24h RETENTION_HOURS, so it becomes a no-op safety net
# rather than racing Results for the same objects. watcher.disable_storing_incomplete_runs:
# true - only finished runs are archived.
#
# Three SEPARATE flags are all required for logs to actually reach the S3 bucket, not
# just the confusingly-similarly-named result.logs_api: (1) result.logs_api: true enables
# the API server's log-retrieval endpoints, (2) result.logs_type: S3 picks the storage
# backend, and (3) watcher.logs_api: true - a DIFFERENT field on the watcher's own config,
# not inherited from result.logs_api - actually makes the watcher push step logs to the
# API at all (confirmed live on kiac-dev: the watcher's own startup log prints "logs
# disable in watcher" verbatim when this is unset, regardless of the other two).
#
# No HTTPRoute for the Results API - it's TLS-only on its single port (gRPC+REST share
# one socket; upstream install docs require generating a TLS cert as a hard
# prerequisite), and a plain-HTTP Gateway listener can't front it. Only add one once the
# target cluster's Gateway has a real TLS/passthrough listener - see
# docs/admin/tekton-results.md (glidepath) for the full writeup.
#
# platforms.kubernetes.pipelinesAsCode.enable: true - explicit, not relied on as an
# undocumented default (it happens to already be on with profile: all on vanilla
# Kubernetes, confirmed live, but this makes it a deliberate choice, not an accident of
# default behavior).
#
# scheduler/tektonpruner: NOT in profile: all's bundle (TektonScheduler/TektonPruner are
# newer, opt-in components - Kueue-based multi-cluster pipeline scheduling and an
# event-based PipelineRun/TaskRun pruner respectively), but v0.81.0's TektonConfig CRD
# marks their sub-fields structurally `-required-` regardless of profile, confirmed live:
# a spec missing them renders fine on a from-scratch install (defaulted by the operator's
# own webhook) but fails real schema validation the moment anything re-applies the CR
# ("spec.scheduler.disabled: Required value" etc.) - hit live on kind-dev, not on the
# throwaway cluster this design was first proven against, because that one only ever went
# through the simpler from-scratch install path once. Both disabled - this platform
# already has its own pipelinerun-pruner-cronjob (platform-cicd's own chart) and has no
# multi-cluster Tekton scheduling need.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  targetNamespace: tekton-pipelines
  profile: all
  dashboard:
    readonly: true
  result:
    disabled: false
    is_external_db: false
    logs_api: true
    logs_type: S3
    secret_name: tekton-results-s3
    watcher:
      completed_run_grace_period: "1h"
      disable_storing_incomplete_runs: true
      logs_api: true
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: true
  scheduler:
    disabled: true
    multi-cluster-disabled: true
    multi-cluster-role: Hub
    config.yaml: {}
  tektonpruner:
    disabled: true
    global-config: {}
