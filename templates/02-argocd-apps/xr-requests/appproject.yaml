# Scopes the xr-requests ApplicationSet's generated Applications (see
# applicationset.yaml in this same directory). Deliberately a SEPARATE, narrowly-scoped
# AppProject from the per-app one (../tenant-appprojects/chart/templates/appproject.yaml)
# - that project can't be reused here because it's itself generated from tenants/<app>/
# app.yaml, which doesn't exist yet for a brand-new app (app.yaml is WRITTEN by
# NodeJSApplication's own Composition - gating on it here would be circular, same reason
# applicationset.yaml's generator uses `directories`, not `files`).
#
# Also deliberately NOT `project: default`, unlike ../tenant-appprojects/
# applicationset.yaml's own onboarding-Application. That one reads from
# the control-plane cluster's repo (this repo, cluster-admin-owned, rare/high-stakes) where `default`'s
# wide-open scope is safe because the source itself is already high-trust. This
# ApplicationSet instead reads from <this cluster's tenants repo> - explicitly the
# lower-trust, PR-reviewed-but-lighter-bar repo (see that repo's own README) - so
# `default`'s wildcard sourceRepos/clusterResourceWhitelist would let anyone who can
# commit an xr-requests/ file sync arbitrary cluster resources. Same problem
# platform-cicd already solved for its own onboarding flow with a dedicated
# `platform-onboarding` AppProject
# (platform-cicd/charts/platform-cicd-control-plane/templates/argocd/
# onboarding-appproject.yaml) - same shape, reused here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: airframe-onboarding
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: xr-requests
spec:
  # Kept under AppProject's 255-byte description limit (hit live, first pass was too
  # long) - full rationale lives in this file's own header comment instead.
  description: "Bootstrap-tier XR onboarding (service-catalog-design.md §0): renders
    @@TENANTS_REPO_NAME@@/tenants/<app>/xr-requests/ into <type>-<appName>-@@XR_NAMESPACE_SUFFIX@@."
  sourceRepos:
    - @@TENANTS_REPO_URL@@
  # infra-*-cicd added 2026-10-17: applicationset.yaml now takes the prefix from the tenant's
  # platformIdentity.type, so infra tenants (InfraService) land in their own infra-<name>-cicd
  # control-plane namespace instead of a stray app-<name>-cicd one.
  destinations:
    - namespace: "app-*-@@XR_NAMESPACE_SUFFIX@@"
      server: https://kubernetes.default.svc
    - namespace: "infra-*-@@XR_NAMESPACE_SUFFIX@@"
      server: https://kubernetes.default.svc
  # Same gap ../tenant-appprojects/chart/templates/appproject.yaml already documents
  # hitting live: an AppProject with no clusterResourceWhitelist implicitly denies every
  # cluster-scoped resource, including the Namespace CreateNamespace=true needs.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Explicit kinds, not a wildcard on the catalog.hangar.io group - Attached-tier XRDs
  # (SLO, future Redis/OAuthServer) are also in this group but are deliberately NOT
  # meant to go through xr-requests/ (they're values.yaml fields in the app's own
  # gitops repo, rendered by the idp-application chart).
  #
  # SecretStore added 2026-08-18 (Item 8's second multi-cluster revision) - real gap
  # caught live the first time NodeJSApplication's own new secretstore-xr.yaml
  # commit actually synced: "resource catalog.idp.io:SecretStore is not permitted in
  # project airframe-onboarding". Unlike SLO/Redis/OAuthServer, SecretStore genuinely does
  # go through xr-requests/ now (NodeJSApplication/ApplicationEnvironment both commit
  # it directly) - not a values.yaml/chart-rendered Attached resource anymore.
  #
  # SpringBootApplication added 2026-08-24 - second Bootstrap-tier language XRD,
  # same shape/locality as NodeJSApplication (dev-only, hence absent from
  # the prod cluster's repo's narrower copy of this file). Hit the same
  # "not permitted in project airframe-onboarding" gap live on the first order-api commit.
  namespaceResourceWhitelist:
    # GoApplication/PythonApplication added 2026-08-27 (Backstage catalog-ingestion
    # work, idp/docs/backstage-design.md): both XRDs/Compositions were already fully
    # built ("Third"/"Fourth Bootstrap-tier stack XRD" per their own headers) but never
    # added here - caught live before it repeated the identical "not permitted in
    # project airframe-onboarding" gap SecretStore/SpringBootApplication already hit.
    # catalog.hangar.io/SecretStore added 2026-09-29 (Tier 2 domain-rename, see memory
    # project_tier2_domain_rename_plan.md) - same "not permitted in project airframe-onboarding" gap
    # every other kind above already hit live, this time for the new-group SecretStore twin.
    - group: catalog.hangar.io
      kind: SecretStore
#@if isControlPlane
    # catalog.hangar.io/{NodeJSApplication,SpringBootApplication,GoApplication,
    # PythonApplication,InfraService,ApplicationEnvironment,TektonCICD} added 2026-09-30
    # (Tier 2 domain-rename, Bootstrap-tier wave) - same recurring gap, hit live migrating
    # skyport-auth's InfraService XR (the very first Bootstrap-tier group flip). All 7 added
    # together since every remaining Bootstrap-tier type needs the same entry this session.
    - group: catalog.hangar.io
      kind: NodeJSApplication
    - group: catalog.hangar.io
      kind: SpringBootApplication
    - group: catalog.hangar.io
      kind: GoApplication
    - group: catalog.hangar.io
      kind: PythonApplication
    - group: catalog.hangar.io
      kind: InfraService
    - group: catalog.hangar.io
      kind: ApplicationEnvironment
    - group: catalog.hangar.io
      kind: TektonCICD
    # LambdaFunction/AzureFunction added 2026-10-04 (container-image function XRDs, airframe
    # lambdafunction.yaml / azurefunction.yaml) - same recurring "not permitted in project
    # airframe-onboarding" gap every other Bootstrap-tier kind hit on its first XR.
    - group: catalog.hangar.io
      kind: LambdaFunction
    - group: catalog.hangar.io
      kind: AzureFunction
    # Cloud targets added 2026-10-08 (airframe v0.3.121+, docs/user/cloud-targets.md): stand-alone,
    # disposable cloud infra for a deploy.target, requested in the app's own cicd namespace so the
    # Lambda bootstrap Job can mount app-secrets. Same "not permitted in project" gap, third time.
    - group: catalog.hangar.io
      kind: AwsLambdaTarget
    - group: catalog.hangar.io
      kind: AwsEcsTarget
    - group: catalog.hangar.io
      kind: AzureContainerAppTarget
    # Cloud dependencies added 2026-10-24 (airframe docs/user/cloud-dependencies.md): requested the same way.
    - group: catalog.hangar.io
      kind: MessageQueue
    - group: catalog.hangar.io
      kind: ObjectStorage
    - group: catalog.hangar.io
      kind: ManagedPostgreSQL
    # Autopilot M4: an app's Agent pins live in its xr-requests folder (airframe xrds/agent.yaml).
    - group: catalog.hangar.io
      kind: Agent
#@end
