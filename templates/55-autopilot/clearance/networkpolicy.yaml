# Who may reach the Autopilot gateway and its database (ingress only; the gateway's own egress is open: the API
# server, the Clearance core, glidepath-api, Prometheus, Loki and an OIDC issuer's JWKS).
#   clearance      the gateway's MCP port and the model proxy's (8081), from agent-run namespaces only. function-agentrun
#                  labels each run namespace hangar.io/agent-run=true and its egress policy allows this pod and port; this
#                  is the other half. kubelet probes and `kubectl port-forward` reach the pod from the node.
#                  The MCP port also from the cluster Gateway's data plane (people's MCP clients through
#                  clearance.<domain>/mcp, routes.yaml); each request still needs a person's ID token.
#                  Glidepath's gates and GitHub's webhooks call the Clearance core since R-4 (55-clearance), not this pod.
#   autopilot-pg   Postgres from the gateway and its read API, and the CloudNativePG operator's ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clearance
  namespace: autopilot-system
  labels: {app.kubernetes.io/name: clearance, hangar.io/component: autopilot, hangar.io/subcomponent: clearance}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: clearance}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {hangar.io/agent-run: "true"}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
#@if components.gatewayRoutes
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: @@GATEWAY_NAMESPACE@@}
      ports:
        - {protocol: TCP, port: 8080}
#@end
---
# autopilot-pg: the gateway (the one writer), the read API (its read-only role) and the CloudNativePG operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autopilot-pg
  namespace: autopilot-system
  labels: {hangar.io/component: autopilot, hangar.io/subcomponent: gateway}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: autopilot-pg}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: clearance}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: autopilot-api}
      ports:
        - {protocol: TCP, port: 5432}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 5432}
