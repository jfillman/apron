# profiles/prod.yaml - WHAT a prod cluster runs, independent of the runtime: the upper zone (only reviewed merges reach
# it, through its own Argo CD), workloads and platform services. It consumes the fleet's Infisical from the hub.
zone: upper
roles: [workloads, platform-services]
infisical:
  host: false
components:
  crossplane:
    providerGithub: false
  cloudTargets: false
  certManager: true
  externalSecrets: true
  argoRollouts: true
  sloth: true
  cloudnativePg: true
  mongodb: true
  rabbitmq: true
  dex: true
  binfmt: false
  serviceCatalog:
    enabled: true
    scope: attached-tier-only
  policy: true
  observability: true
  glidepath: false
  autopilot: false
  gatewayRoutes: true
  aiTriage: true
  backstage: false              # Tower is an Airframe app now; 65-backstage stays for reference only
  towerAccess: true             # cluster-scoped grants for Tower's ServiceAccount in app-backstage-<env>
  towerAccessHub: false
observability:
  full: false                   # no Thanos, Loki, MinIO or Grafana
  tracing: true                 # OTel collector + Operator (auto-instrumentation); the collector derives span metrics and the service graph
  tempo: false                  # no trace store: Tempo was off since the 2026-10-25 load spiral; edges come from the collector (user decision 2026-10-28)
  remoteWrite: true             # send trace metrics to the hub's Thanos (needs fleet.hubApiServer + fleet.hubCaData)
aiTriage:
  cpuRequest: 10m
  memoryRequest: 100Mi
  memoryLimit: 500Mi
cnpg:
  replicas: 1
tower:
  env: prod
admission:
  flight:                       # glidepath ADR-0029 phase 4; needs registries.flight.namespace + promotion.promoter.repo
    enabled: false              # render flight-only-images + flight-images (Audit+Warn) and the Kyverno Flight read secret
    enforce: false              # Deny + failurePolicy Fail; only once every app's prod release runs from Flight
    pullFromFlight: false       # tenant registry-credentials reads Flight (read-only) instead of Ground
    allowedPrefixes:            # third-party images tenants run; no Glidepath build produces them, so nothing promotes them
      - ghcr.io/cloudnative-pg/
      - ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-
      - docker.io/bitnamilegacy/
