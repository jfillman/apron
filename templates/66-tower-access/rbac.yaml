# Read-only access for Tower's kubernetes-ingestor ServiceAccount (backstage-ingestor in @@TOWER_NAMESPACE@@), the same
# grants the prod cluster's Backstage carried: native workloads (view), CRDs, Crossplane XRDs/Compositions/XRs
# (crossplane-browse), Argo Rollouts, the Prometheus proxy for the SLOs tab, and (below) the Topology tab's extra
# kinds: Gateway API, ExternalSecrets, ServiceMonitors and RBAC objects. The hub grants the same kinds to Tower's
# federated identity (00-bootstrap/backstage-ingestor-rbac/rbac.yaml); these are this cluster's own copies, named
# tower-local-* so a cluster carrying both never has two Applications owning one ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-crd-viewer
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crd-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-crd-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crossplane-browse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-browse
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-argo-rollouts-viewer
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-argo-rollouts-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-argo-rollouts-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
# services/proxy is not in `view`; resourceNames match the exact "name:port" the proxy path is checked against.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-ingestor-prometheus-proxy
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["kube-prometheus-stack-prometheus", "kube-prometheus-stack-prometheus:9090"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-ingestor-prometheus-proxy
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-ingestor-prometheus-proxy
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
# Break-glass on this cluster: Tower may bind the two tower-breakglass ClusterRoles (30-policy/breakglass/rbac.yaml),
# and the admission policies there admit only the RoleBindings and debug containers Tower is allowed to make.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-breakglass-binder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tower-breakglass-binder
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tower-local-gateway-api-viewer
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-local-gateway-api-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tower-local-gateway-api-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tower-local-topology-resource-viewer
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-local-topology-resource-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tower-local-topology-resource-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tower-local-rbac-viewer
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-local-rbac-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tower-local-rbac-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: @@TOWER_NAMESPACE@@
