# clearance-api.<domain>: Clearance's read API, for Tower (hangar-prod reaches it through a hostAlias) and people.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clearance-api
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance}
spec:
  parentRefs:
    - name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
  hostnames:
    - clearance-api.@@CLUSTER_DOMAIN@@
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: clearance-api
          port: @@CLEARANCE_BACKEND_PORT@@
---
# The deployment gate's people actions on clearance.<domain>: a person, or Tower's backend as the delegate, clears or
# denies a held change (backstage plugins/clearance-backend proxy.ts WRITE_ROUTES). The Autopilot gateway's routes on
# the same host (/mcp, the inbox, person controls, runs) are 55-autopilot's.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clearance-gate
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance}
spec:
  parentRefs:
    - name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
  hostnames:
    - clearance.@@CLUSTER_DOMAIN@@
  rules:
    - matches:
        - path: {type: RegularExpression, value: "^/v1/clearances/[A-Za-z0-9-]+/(clear|deny)$"}
          method: POST
        # An admin's resolution of an observed change (O-5; Tower's Exceptions tab, clearance.coreUrl). The core checks
        # CLEARANCE_ADMINS for the person the delegate names.
        - path: {type: RegularExpression, value: "^/v1/observations/[0-9]+/resolution$"}
          method: POST
        # The same, in bulk (up to 200 items; one resolution record per item, one batch id).
        - path: {type: Exact, value: /v1/observations/resolutions}
          method: POST
        # The core's health, for a remote `clearance-cmp doctor` reachability check (I-58). Reveals nothing. Unconditional,
        # so it holds without feedReaders, and an Exact match beats the web UI's PathPrefix / when that is on.
        - path: {type: Exact, value: /healthz}
          method: GET
      backendRefs:
        - name: clearance-core
          port: @@CLEARANCE_BACKEND_PORT@@
#@if clearance.targets.publishers
    # Another cluster's Map target publisher (59-clearance-targets): its own source only. The core checks the provider's
    # `targets` right; this route only lets the PUT reach it (it 404'd at the Gateway before, 2026-11-13).
    - matches:
        - path: {type: RegularExpression, value: "^/v1/targets/[a-z0-9][a-z0-9-]*$"}
          method: PUT
      backendRefs:
        - name: clearance-core
          port: @@CLEARANCE_BACKEND_PORT@@
#@end
#@if clearance.feedReaders
    # A protected cluster's Argo CD agent: its deploy.outcome and deploy.exception records, and the break-glass windows.
    # The feed and the keys it verifies are clearance-api's, on that host's route above.
    - matches:
        - path: {type: Exact, value: /v1/records}
          method: POST
        - path: {type: Exact, value: /v1/breakglass}
          method: GET
        # Its protected app/environment pairs (the annotation opt-in, clearance G-ARGO-10c): what the core holds, and its
        # own cluster's report. The core takes a report only from a principal its provider's `protection` list pairs with
        # that exact cluster (clearance internal/server/protection.go), so this route only lets the call reach it (I-81:
        # both 404'd at the Gateway, and no remote Application was ever switched).
        - path: {type: Exact, value: /v1/protection}
          method: GET
        - path: {type: RegularExpression, value: "^/v1/protection/[a-z0-9][a-z0-9-]*$"}
          method: PUT
      backendRefs:
        - name: clearance-core
          port: @@CLEARANCE_BACKEND_PORT@@
#@end
#@if clearance.web.enabled
---
# The standalone web UI (clearance web) on clearance.<domain>: the UI, /auth/* and /api/*. Every path, but the gate route above
# matches its POST patterns more specifically and keeps them; /v1/* is not the UI's.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clearance-web
  namespace: @@CLEARANCE_NAMESPACE@@
  labels: {hangar.io/component: clearance, hangar.io/subcomponent: clearance-web}
spec:
  parentRefs:
    - name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
  hostnames:
    - clearance.@@CLUSTER_DOMAIN@@
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: clearance-web
          port: 8080
#@end
