# Vendored, pinned manifest (install.yaml in this directory,
# https://raw.githubusercontent.com/projectcontour/contour/release-1.32/examples/render/contour.yaml)
# - the cluster's ingress controller, namespace `projectcontour` (confirmed live
# from this exact manifest - idp-application's own
# networkPolicy.ingressControllerNamespaceSelector had `ingress-nginx` as an
# explicitly-flagged, unconfirmed placeholder guess; this is the real value,
# see idp-service-catalog's fix for that chart).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contour
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  project: default
  # No `directory:` block (was `exclude: "{application.yaml}"`) - this directory now
  # carries a kustomization.yaml (patches envoy's Service to NodePort, see that file's
  # own header), which ArgoCD auto-detects and uses instead of plain-directory mode.
  # kustomization.yaml's own `resources: [install.yaml]` already excludes
  # application.yaml by simply not listing it, so the exclude pattern is redundant now.
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-dev.git
    targetRevision: main
    path: 10-crds-operators/contour
  destination:
    server: https://kubernetes.default.svc
    namespace: projectcontour
  # Contour's own vendored install.yaml (see this file's header) predates the
  # apiextensions.k8s.io/v1 CRD schema: it still carries the deprecated
  # spec.preserveUnknownFields: false field, and omits spec.conversion entirely. The
  # API server drops the former and defaults the latter to {strategy: None} on every
  # CRD it stores, so live-vs-git never matches on these two fields no matter how many
  # times this Application syncs - confirmed live on kind-dev/kind-prod 2026-08-22,
  # identical byte-for-byte diff on all 5 contour CRDs, permanently stuck OutOfSync/
  # Progressing (dragging the root app-of-apps health down with it). Cosmetic
  # API-server normalization, not a real drift - ignored rather than hand-edited into
  # the vendored file, which would just be overwritten on the next re-vendor.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
        - /spec/preserveUnknownFields
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
