apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: holmesgpt-creds
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: ai-triage
spec:
  project: default
  source:
    repoURL: @@REPO_URL@@
    targetRevision: main
    path: 70-ai-triage/holmesgpt
    directory:
      exclude: "{application.yaml,secret-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: holmesgpt
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
