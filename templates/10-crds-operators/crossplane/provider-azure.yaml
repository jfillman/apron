# Crossplane Azure providers (AzureContainerAppTarget): the family core and provider-azure-containerapp.
# Their own file so a cluster can drop them: components.crossplane.azure (templates/MANIFEST), which also gates
# provider-azure-config.yaml, provider-azure-creds-external-secret.yaml and provider-cloud-runtime.yaml.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-azure
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
    hangar.io/origin: cloud-targets
spec:
  package: xpkg.upbound.io/upbound/provider-family-azure:v2.8.0
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-cloud-runtime
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-containerapp
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
    hangar.io/origin: cloud-targets
spec:
  package: xpkg.upbound.io/upbound/provider-azure-containerapp:v2.8.0
  # Its family package (provider-family-aws/-azure) is declared above, with the runtime config the
  # family needs. Without this, Crossplane also installs the family as a dependency, the lock holds the
  # same package twice ("node ... already exists") and every package on the cluster stops resolving.
  skipDependencyResolution: true
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-cloud-runtime
---
