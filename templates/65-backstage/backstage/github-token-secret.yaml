# A dedicated classic PAT for Backstage's own git-write operations (app-config.yaml's
# integrations.github[0].token, consumed by the scaffolder's publish:github:pull-request
# action, e.g. the terasky:claim-template create-pull-request step - see
# idp/docs/backstage-design.md). Not the fleet's GitHub App (platform-cicd, the dev cluster,
# App ID + private key for installation-token minting), not provider-github's classic
# PAT (the former management cluster Crossplane, JSON-blob-shaped value {"owner":...,"token":...} - wrong
# shape for Backstage's flat-string integrations.github.token), and not
# backstage-github-oauth-creds (this directory - that's a client id/secret OAuth App
# for user sign-in, no git-write capability at all). Same "dedicated per consumer"
# posture already established for the OAuth App (github-oauth-secret.yaml, this
# directory).
#
# Found live 2026-08-28: integrations.github[0].token has referenced ${GITHUB_TOKEN}
# since this app-config.yaml was first written, but no such env var/Secret ever
# existed - every scaffolder PR-creation call failed with "No token available for
# host: github.com" the first time one was actually exercised end-to-end (all prior
# runs either only checked the generated Template's schema in Postgres, or crashed
# earlier in claim-templating.cjs.js's deleteNested bug, before ever reaching this
# step).
#
# Same secretStoreRef (platform-secret-store, the former management cluster's shared ClusterSecretStore)
# as every other credential in this directory. Plant it by hand, once, in
# platform-cicd-<cluster>'s Infisical project - never committed here, same
# "manual by design" posture as every other credential's ultimate source in this
# platform:
#   1. github.com -> Settings -> Developer settings -> Personal access tokens ->
#      Tokens (classic) -> Generate new token
#      - Scope: repo (full control of private repositories - covers branch push +
#        PR creation, which is all this consumer needs; no delete_repo, unlike
#        provider-github-creds, since Backstage never deletes repos)
#   2. Infisical key: backstage-github-token, value: <the token string, nothing else -
#      flat value, not JSON, unlike provider-github-creds>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-token
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: backstage-github-token
