# Same minimum scope as the former management cluster's own backstage-ingestor RBAC (view + CRD read +
# crossplane-browse, no crossplane-view/managed-resource or secrets access) - see that
# file's own header for the full rationale (TeraSky-OSS/backstage-plugins
# kubernetes-ingestor/K8S_RBAC.md). The one real difference: this ServiceAccount's
# token is minted as a long-lived Secret (below), not a kubelet-projected in-cluster
# mount, because the consumer (Backstage) runs on a different cluster (the former management cluster) and
# has no pod here to project a token into. The token value itself is never read or
# handled by an assistant - see this directory's README for how it's planted into
# Infisical and delivered to the former management cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-crd-viewer
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crd-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-crd-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crossplane-browse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-browse
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# Argo Rollouts visualization (2026-09-04, redhat-argocd plugin's Rollouts
# feature - app-config.yaml's kubernetes.customResources in the backstage repo).
# Explicit grant, not assumed covered by the `view` ClusterRole above -
# argoproj.io's Rollout/AnalysisRun CRDs aren't part of Kubernetes' own
# aggregation labels `view` matches by default, same reasoning as the dedicated
# CRD-viewer and crossplane-browse grants above rather than assuming `view`
# is broader than it is.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-argo-rollouts-viewer
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-argo-rollouts-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-argo-rollouts-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# Gateway API (2026-09-06, Glidepath's Config-tab route URL - app-config.yaml's
# kubernetes.customResources in the backstage repo). Same reasoning as the Argo
# Rollouts grant above: gateway.networking.k8s.io's HTTPRoute/Gateway CRDs
# aren't part of `view`'s aggregation either. Gateway is included alongside
# HTTPRoute because HTTPRoute carries no TLS info of its own - the actual
# http-vs-https scheme is only knowable from the Gateway listener a route's
# parentRefs point at.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-gateway-api-viewer
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-gateway-api-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-gateway-api-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# Crossplane GitHub managed resources (Tower's Provisioning tab). A new
# application XR composes Repository and RepositoryFile objects; the XR itself
# only turns Ready once every one of them has, so without this grant Tower can
# only say "repositories and starter files: not ready yet". With it, the tab
# shows how many are done. Read-only (no create/update/delete), and only these
# two kinds: not the wider `crossplane-view` role, which would also expose every
# other managed resource. Neither kind holds secret values - file contents are
# starter code and pipeline config, and credentials live in the ProviderConfig
# Secret, which this does not touch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-github-mr-viewer
rules:
  - apiGroups: ["repo.github.m.upbound.io"]
    resources: ["repositories", "repositoryfiles"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-github-mr-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-github-mr-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# Infisical project read (2026-10-03, Tower's Provisioning tab). The "Infisical secrets
# resources" step links the app's Infisical project, whose id is the Project managed
# resource's external-name annotation. Read-only on that one kind: it holds the project's
# name, slug and id, not secret values (those live in Infisical, reached only through
# the ESO-backed stores). Separate from backstage-github-mr-viewer because it is a
# different provider group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-infisical-project-viewer
rules:
  - apiGroups: ["project.infisical.m.hangar.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-infisical-project-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-infisical-project-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# Prometheus query proxy (2026-09-24 bug: "the workload performance metrics/graphs
# are not working for ground and preview envs"). Tower's Topology-tab
# Performance panel, the canary AnalysisRun charts and the SLO views all query
# kube-prometheus-stack through the kubernetes-plugin's `services/proxy` route on
# the env's own cluster. Confirmed live: from Backstage's pod (the prod cluster) this
# cluster answered /version but 403'd the Prometheus proxy - "services
# kube-prometheus-stack-prometheus:9090 is forbidden" - while the prod cluster's own copy
# of this exact grant (the prod cluster's repo/60-backstage/backstage/rbac.yaml)
# already existed, which is why only Flight-tier envs worked. Same shape as the
# glidepath-api grant below (and the Rekor grant, removed in P6): a namespaced Role
# on the single Service, not a cluster-wide proxy grant. Both `name` and `name:port` forms, since the checked resourceName is
# the literal string in the proxy URL path.
# thanos-query-frontend (2026-10-07): Tower's Ops Wall reads DORA (dora-exporter's
# series, 7-90 day windows) through the long-term query layer, not the local
# Prometheus, whose retention is hours. Configured in Backstage as tower.dora.metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-ingestor-prometheus-proxy
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - kube-prometheus-stack-prometheus
      - kube-prometheus-stack-prometheus:9090
      - thanos-query-frontend
      - thanos-query-frontend:9090
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-ingestor-prometheus-proxy
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-ingestor-prometheus-proxy
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# Tower's Topology tab "all resources" gallery (2026-09-17) - RBAC objects
# (Roles/RoleBindings/ClusterRoles/ClusterRoleBindings) are deliberately
# excluded from the `view` ClusterRole's own aggregation (Kubernetes never
# lets `view`/`edit` see who-can-do-what by default, for the same reason it
# excludes Secret data), so a dedicated grant is the only way to surface
# them, same reasoning as every other CRD-shaped exception in this file.
# ClusterRole/ClusterRoleBinding added alongside the namespaced pair
# (2026-09-17, same day) once the gallery's RBAC view started resolving a
# RoleBinding's roleRef to its actual rules - that reference is very
# commonly a ClusterRole (bound just within one namespace via a
# RoleBinding), so resolving it needs read access to ClusterRoles too, not
# just Roles. Read-only, no different in spirit from the `view` binding
# this identity already has for every other resource kind - this only adds
# visibility into RBAC *configuration* (which subjects a binding names,
# which rules a Role/ClusterRole grants), never lets this identity exercise
# those grants itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-rbac-viewer
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-rbac-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-rbac-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# Same Topology-tab resource gallery, the two CRD kinds it also wants:
# ExternalSecret (external-secrets.io - this platform's Infisical-backed
# secret sync, see infisical-secretstore-operator) and ServiceMonitor
# (monitoring.coreos.com - what wires an app's metrics into
# kube-prometheus-stack). Neither group is covered by `view` or any
# existing grant here, same reasoning as backstage-argo-rollouts-viewer/
# backstage-gateway-api-viewer above - grouped into one ClusterRole since
# both were added for the same feature, rather than two more separate
# ClusterRole/ClusterRoleBinding pairs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-topology-resource-viewer
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-topology-resource-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-topology-resource-viewer
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# glidepath-api through the API server's services/proxy (2026-10-25, glidepath docs/admin/api.md): Tower's every CI/CD
# read (runs, live runs and logs, release state, image evidence, tests). glidepath-api checks the token again itself
# (sent in X-Glidepath-Authorization, since the proxy drops Authorization) and authorizes every read, so this grant
# only opens the door. Until P6 (2026-10-30) it also opened tekton-results-relay, which Tower read Tekton Results
# through itself, and this file granted the Rekor and Testkube service proxies and create/patch on PipelineRuns
# (backstage-tekton-rerun) the same way; glidepath-api reads and writes all of that now. The Role keeps its name so
# this Application (no prune) updates it in place.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-ingestor-tekton-results-proxy
  namespace: platform-system
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - glidepath-api
      - glidepath-api:8080
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-ingestor-tekton-results-proxy
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-ingestor-tekton-results-proxy
subjects:
  # Federated reader (2026-10-12, SPEC-tower-cluster-credentials.md phase 2): the prod cluster's Backstage pod
  # presenting its own short-lived projected token, accepted by 00-bootstrap/cluster-identity/.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: hangar:@@TOWER_CLUSTER@@:backstage-ingestor
---
# ArgoCD Applications in the platform instance (2026-10-04, Tower's Provisioning tab). The
# "CI/CD onboarded" step is only true once the <app>-cicd Application is Synced and Healthy:
# the XR's CicdOnboarded condition just means the identity file was committed. That app lives
# in the `argocd` namespace (the platform instance); Backstage's ArgoCD plugin only reads the
# argocd-apps instances, so it cannot see it, and the step never went green (air-traffic-api).
# Read-only, one namespace, one kind. An Application holds repo URLs, Helm values and sync
# status, not secret values (repository credentials are Secrets, which this does not touch).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-argocd-application-viewer
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
