# versions.yaml - the one place Apron pins Hangar's own products and the installs it renders. Bump a pin here after
# cutting the tag, then `apron render` every cluster repo. Defaults are what the lab clusters ran on 2026-10-17.
#
# The name-free Airframe and Glidepath changes (no hardcoded cluster names or owner) are on their
# no-hardcoded-cluster-names branches: cut new tags from them and set those tags here before rebuilding.
versions:
  airframe:
    catalog: v0.3.174 # 20-service-catalog/airframe-service-catalog: XRDs + Compositions. v0.3.172..v0.3.173 adds xrds/agentrepository.yaml + compositions/agentrepository (Autopilot M4) and a comment in xrds/agentrun.yaml; v0.3.173..v0.3.174 (airframe#145): the AgentRun Composition names the gateway autopilot-gateway (gateway_service, clearance_selector, model_proxy_selector)
    clusterRegistry: v0.3.154 # 00-bootstrap/cluster-registry: charts/cluster-registry
    analysisCatalog: v0.3.135 # 20-service-catalog/analysis-catalog: ClusterAnalysisTemplates
    defaultChart: v0.3.173 # cluster-defaults.yaml defaultChart: the app chart every environment renders
  # Clearance (55-clearance): the chart from oci://ghcr.io/jfillman/charts, and the image index it runs (the chart's
  # default tag pinned by digest). Cut by the clearance release workflow; bump both together.
  clearance:
    chart: 0.41.0
    imageDigest: sha256:921baf8a6d80ef510818d7ccf52099bdaae161d6370122afc190f301c4781148
    # The Argo CD gate's images (clearance.gate.enabled; G-ARGO-4/5): ghcr.io/<owner>/clearance-cmp and clearance-wait
    # by digest, first published by clearance v0.33.0. Used only where clearance.gate.enabled.
    cmpImage: ghcr.io/jfillman/clearance-cmp@sha256:e09f0beda56e12467b27d43c92c1e6130acac95b1ea3624d720a606ba7b0de2f
    waitImage: ghcr.io/jfillman/clearance-wait@sha256:386260bbe86d049979f94f66d9c7c4b43ec1a5bb07cc3fe8623a531015d6718e
    # The Argo CD agent (G-ARGO-3): image and chart, for the protected cluster (hangar-prod).
    argocdAgentImage: ghcr.io/jfillman/clearance-argocd-agent@sha256:d48a5e9513c239d37d357f8631f7461d38af8813f3c54fe396fb3def5dcec6a9
    argocdAgentChart: 0.41.0
    # The Kubernetes audit collector (O-3; clearance.observe.enabled), first published by clearance v0.38.0.
    observeK8sImage: ghcr.io/jfillman/clearance-observe-k8s@sha256:313a7c324176f71e653d1abf2a9c0de5d0b87a7e68d4aca8c24d23b5697a08f1
    observeK8sChart: 0.41.0
    # The AWS collector (clearance.observeAWS.enabled), first published by clearance v0.39.2; 0.39.3 renders its own rule set.
    observeAWSImage: ghcr.io/jfillman/clearance-observe-aws@sha256:a5b7c6030e252c29e6b3ad51d4e308f97abd0ca4ddf56a6b8f215af82ebf2d35
    observeAWSChart: 0.41.0
    # The ledger witness (C-3; clearance.witness.enabled): ghcr.io/<owner>/clearance-witness by digest, first published by
    # clearance v0.36.0. Rendered as plain manifests (templates/56-clearance-witness): its chart is not published.
    witnessImage: ghcr.io/jfillman/clearance-witness@sha256:6085ba8c99a71e4a45e0564f2385bf8428572580165f37612c0af18eaa170a31
  # Autopilot: the gateway image's tag, named as the registered provider's version in Clearance's providers list.
  autopilot:
    gateway: gateway-v0.5.1
  glidepath: main # 50-glidepath: control plane, catalog, Rekor values (a tag once one is cut)
  argocdChart: 10.3.2 # argo-cd chart for the second instance (argocd-apps); the first instance is the
  # vendored 01-argocd-platform/install.yaml (Argo CD v3.5.0)
infisical:
  nodePort: 31800 # the Infisical host's NodePort, how other clusters reach it
  bootstrapImageTag: "0.43.99-arm64" # autoBootstrap Job image; arm64 nodes need the -arm64 tag (see the template)
