# tenant-identity - installs airframe's `airframe-identity` chart once per (app, env), as its
# own ArgoCD Application, from the identity.yaml files in this cluster's tenants repo
# (gitops-cluster-dev-tenants/tenants/<app>/<env>/identity.yaml, written by
# ApplicationEnvironment).
#
# Why this exists (added to the template 2026-09-23, mirroring gitops-cluster-kind-prod): from
# airframe v0.3.69 the release-tracking hooks' identity - the `platform-outcome-hook`
# ServiceAccount/Role/RoleBinding and the relay-token ExternalSecret - moved OUT of the
# `airframe-application` chart into `airframe-identity`. ArgoCD's operation-retry logic deletes
# every hook-annotated resource before retrying a failed sync, so keeping that identity as
# PreSync hooks inside the release Application let every retry wipe it out from under a
# still-running PostSync Job (confirmed live: ~19 retried syncs in under an hour). As a plain,
# non-hook resource in a separate Application it is immune to that sweep.
#
# CONSEQUENCE for this template: tenant-onboarding pins airframe-application at v0.3.83, whose
# hooks reference `platform-outcome-hook` but no longer create it. Without THIS ApplicationSet,
# any env with releaseTracking enabled (every upper-cluster env, via values.yaml) would fail its
# PostSync/SyncFail hooks with a missing ServiceAccount. Lower environments (releaseTracking:
# null by default) do not depend on it; on a dev cluster this ApplicationSet simply finds no
# identity.yaml files and creates nothing.
#
# Same shape as gitops-cluster-kind-prod's live copy, which runs it at v0.3.76 - the chart is
# byte-identical from v0.3.76 through v0.3.83.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-identity
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: tenant-identity
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: https://github.com/jfillman/gitops-cluster-dev-tenants.git
        revision: main
        files:
          - path: "tenants/*/*/identity.yaml"
  template:
    metadata:
      name: "{{.appName}}-{{.env}}-identity"
      labels:
        hangar.io/component: cluster-config
        hangar.io/subcomponent: tenant-identity
        hangar.io/app: "{{.appName}}"
        hangar.io/env: "{{.env}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd-apps
    spec:
      project: "{{.appName}}"
      sources:
        - repoURL: https://github.com/jfillman/airframe.git
          targetRevision: v0.3.87
          path: charts/airframe-identity
          helm:
            valuesObject:
              appName: "{{.appName}}"
              cluster: kind-dev
              envName: "{{.env}}"
            valueFiles:
              - $appsrc/kind-dev/{{.env}}/values.yaml
        - repoURL: "{{.gitopsRepoUrl}}"
          targetRevision: main
          ref: appsrc
          directory:
            exclude: "*"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{.appName}}-{{.env}}"
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
