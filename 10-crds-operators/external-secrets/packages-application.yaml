# Companion to this directory's own application.yaml (the ESO Helm chart itself) -
# same two-Application-per-directory shape ../crossplane/ already establishes
# (application.yaml for the chart, packages-application.yaml for raw manifests in the
# same directory - the ONLY two Application filenames root-app-of-apps.yaml's own
# discovery glob recognizes, alongside applicationset.yaml). A Helm-chart source can't
# also sweep up sibling raw YAML files in its own directory, hence the split.
#
# Applies cluster-secret-store.yaml/infisical-project.yaml/
# registry-credentials-cluster-external-secret.yaml (this same directory). Depends on
# ESO's own CRDs/webhook already being installed (application.yaml, this same
# directory) - if this Application's own sync races that one on a from-scratch
# bootstrap, it self-heals once ESO's CRD exists, same eventually-consistent pattern
# root-app-of-apps.yaml's own header already documents for AppProject-before-
# Application races.
#
# 2026-08-19: automated selfHeal was always the intent (see the paragraph above,
# written before this was actually added) but the syncPolicy never actually declared
# it - a real bug, not a deliberate manual gate: this Application sat at
# operationState.phase Succeeded from its very first, day-one sync and never synced
# again on its own, silently missing every push since (including the Infisical
# migration, only picked up after a manual sync trigger). Fixed - same automated
# shape as this repo's own tenant-facing ApplicationSets
# (02-argocd-apps/xr-requests/applicationset.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-packages
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-kind-prod.git
    targetRevision: main
    path: 10-crds-operators/external-secrets
    directory:
      exclude: "{application.yaml,packages-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
