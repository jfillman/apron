# registry-credentials-cluster-external-secret.yaml
#
# kind-prod's own copy of platform-cicd's registry-credentials ClusterExternalSecret -
# see platform-cicd's charts/platform-cicd-control-plane/templates/secretstore/
# registry-credentials-cluster-external-secret.yaml for the full rationale. Replaces
# the standalone, hand-applied ghcr-pull-secret Secret this cluster's checkout-api-prod
# namespace used as a stopgap (gitops-cluster-kind-prod/README.md's documented gap -
# this mechanism had never actually been exercised on this cluster before) with the
# same automatic, namespace-label-selected dissemination kind-dev now has.
#
# Namespace selector matches 02-argocd-apps/tenant-onboarding/applicationset.yaml's own
# managedNamespaceMetadata label, applied to every app-<appName>-<env> namespace this
# ApplicationSet creates on this cluster.
#
# v1, not v1beta1 - real sync failure caught live on kind-dev (v1beta1 is served: false
# on this ESO version, 2.8.0) - see platform-cicd's own copy of this file for the full
# story.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: registry-credentials
  labels:
    hangar.io/subcomponent: "secretstore"
spec:
  externalSecretName: registry-credentials
  namespaceSelectors:
    - matchLabels:
        hangar.io/managed-secrets: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: platform-secret-store
      kind: ClusterSecretStore
    target:
      name: registry-credentials
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: registry-credentials-dockerconfigjson
