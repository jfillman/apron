# Kyverno's own access for the tower-breakglass policies (tower-breakglass.yaml), aggregated by label like
# testkube-rbac.yaml. Its controllers ship with RBAC for built-in kinds but not these subresources and deletes.
#
# Reading Pod/ephemeralcontainers: the admission and reports controllers need it for the debug-container policy
# (the dry run warned: "kyverno-reports-controller requires permissions get,list,watch for resource
# Pod/ephemeralcontainers").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-tower-breakglass-viewer
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
#@if isControlPlane
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
#@end
rules:
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "list", "watch"]
---
# Kyverno's cleanup controller deletes expired tower-breakglass RoleBindings (cleanup.kyverno.io/ttl) and leftover
# copy-mode pods; it has no delete on these kinds by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-cleanup-tower-breakglass
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
