# Depends on minio/ (the `tempo` bucket, observability.full only; tracing alone stores on the PVC) and
# kube-prometheus-stack/ (metricsGenerator's remoteWriteUrl target) both being up first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: observability
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          storage:
            trace:
#@if observability.full
              backend: s3
              s3:
                bucket: tempo
                endpoint: minio:9000
                access_key: admin
                secret_key: minioadmin123
                insecure: true
                forcepathstyle: true
#@end
#@if not observability.full
              # Tracing without the full stack has no MinIO: blocks on the PVC below, kept for retention.
              backend: local
              local:
                path: /var/tempo/traces
              wal:
                path: /var/tempo/wal
#@end
          # Tempo can receive OTLP directly - no collector hop strictly required, but
          # the OTel Collector goes through it anyway so the app has one export target
          # for traces+metrics+logs.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          # Powers the "Traces -> Metrics" link in Grafana: Tempo derives RED metrics from spans and remote-writes
          # them. The service graph (traces_service_graph_*) comes from the OTel collector's service_graph connector
          # instead, so clusters without Tempo have it too; generating it here as well would count every edge twice.
          metricsGenerator:
            enabled: true
            remoteWriteUrl: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write"
            processor:
              span_metrics:
                enable_target_info: true
          # Turns the processors on for every tenant. Chart 1.24 reads tempo.overrides.defaults (the new overrides
          # format); the old tempo.global_overrides key was silently ignored, so no service-graph or span metric was
          # ever generated (found 2026-10-23: spans reached Tempo, traces_service_graph_* stayed empty).
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - span-metrics
        persistence:
          enabled: true
          size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
