# Tower's write verbs on the dev cluster, held to what Tower actually does (2026-10-11; spec
# SPEC-tower-cluster-credentials.md section 3.5, phase 0).
#
# Backstage's identity (backstage-system/backstage-ingestor) holds create+patch on pipelineruns and create+delete on
# rolebindings cluster-wide. Unguarded, that is cluster-admin: a PipelineRun in argocd naming
# argocd-application-controller (bound to */*/*) with an inline taskSpec has Tekton start a pod holding that token, and
# any RoleBinding anywhere can be deleted.
#
# - glidepath-api-pipelinerun-shape (tower-pipelinerun-shape until P6): the PipelineRuns written for Tower are Glidepath's own shape (every TriggerTemplate and run on this
#   cluster, checked 2026-10-11): an app -cicd namespace, a cluster-resolver pipelineRef into platform-catalog, SA
#   pipeline-runner, no inline spec, no per-task overrides, a podTemplate of hostAliases only, and emptyDir or
#   volumeClaimTemplate workspaces. An update (Cancel) may change spec.status and nothing else.
# - tower-rolebinding-delete: Backstage may delete only tower-breakglass-* RoleBindings (tower-breakglass.yaml guards
#   their creation).
#
# Same conventions as tower-breakglass.yaml: compiled to a native ValidatingAdmissionPolicy (vpol-<name>), failurePolicy
# Fail, matchConditions keep each policy to Backstage's own requests, every optional field read behind has().
# Phase 3 of the spec (2026-10-12) added the federated writer identity, hangar:the prod cluster:tower-actor; phase 4 removed the
# old backstage-system/backstage-ingestor ServiceAccount, so it is the only username left.
#
# 2026-10-28 (Glidepath API spec phase 3): glidepath-api's ServiceAccount starts and cancels PipelineRuns for Tower and
# Clearance (POST /v1/apps/{app}/pipelineruns/{name}/rerun, /cancel; since P4 the release and rollback runs too), so
# the shape policy holds it to the same shape.
#
# 2026-10-30 (Glidepath API spec phase 6): Tower writes PipelineRuns only through glidepath-api, and tower-actor lost
# its Tekton grant (00-bootstrap/backstage-ingestor-rbac). The policy is glidepath-api's now
# (glidepath-api-pipelinerun-shape, formerly tower-pipelinerun-shape): it admits an InfraService's -cicd namespace as
# well as an app's, and still matches tower-actor only to refuse it, should a grant ever come back.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: glidepath-api-pipelinerun-shape
  annotations:
    policies.kyverno.io/title: glidepath-api PipelineRun shape
    policies.kyverno.io/description: glidepath-api may only start Glidepath-shaped PipelineRuns in app and InfraService -cicd namespaces, and only cancel them; Tower may not write PipelineRuns.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelineruns"]
  matchConditions:
    - name: writers
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username in ['@@TOWER_USER_ACTOR@@', 'system:serviceaccount:platform-system:glidepath-api']
  variables:
    - name: isCreate
      expression: request.operation == 'CREATE'
    # Tekton's PipelineRun CRD keeps spec as unknown fields, so nothing below can assume a field has the type it should:
    # each variable reads a field only if it has that type, and a rule says so when it does not.
    - name: ref
      expression: "has(object.spec.pipelineRef) && type(object.spec.pipelineRef) == map ? object.spec.pipelineRef : {}"
    - name: refParams
      expression: "has(variables.ref.params) && type(variables.ref.params) == list ? variables.ref.params : []"
    - name: pipelineName
      expression: >-
        variables.refParams.exists(p, type(p) == map && has(p.name) && p.name == 'name' && has(p.value) && type(p.value) == string) ?
        variables.refParams.filter(p, type(p) == map && has(p.name) && p.name == 'name' && has(p.value) && type(p.value) == string)[0].value : ''
    - name: trt
      expression: "has(object.spec.taskRunTemplate) && type(object.spec.taskRunTemplate) == map ? object.spec.taskRunTemplate : {}"
    - name: rawSpecs
      expression: "has(object.spec.taskRunSpecs) && type(object.spec.taskRunSpecs) == list ? object.spec.taskRunSpecs : []"
    - name: specs
      expression: "variables.rawSpecs.filter(s, type(s) == map)"
    - name: rawWorkspaces
      expression: "has(object.spec.workspaces) && type(object.spec.workspaces) == list ? object.spec.workspaces : []"
    - name: anns
      expression: "has(object.metadata.annotations) && type(object.metadata.annotations) == map ? object.metadata.annotations : {}"
    # The per-task accounts the platform defines, by Pipeline: Glidepath's glidepath-control-plane values
    # cicdRunAdmission.sourceTasks / pusherTasks / cloudDeployerTasks, from versions.yaml glidepathRunTasks (hack/render.py
    # refuses a render when they differ from the pinned Glidepath's values). source-runner and image-pusher have no Role and no
    # token; glidepath-cloud-deployer holds a cloud identity, so it is allowed on exactly the cloud deploy tasks.
    - name: sourceTasks
      expression: '@@GLIDEPATH_SOURCE_TASKS@@'
    - name: pusherTasks
      expression: '@@GLIDEPATH_PUSHER_TASKS@@'
    - name: cloudTasks
      expression: '@@GLIDEPATH_CLOUD_DEPLOYER_TASKS@@'
    - name: storageClasses
      expression: '@@GLIDEPATH_API_STORAGE_CLASSES@@'
  validations:
    - expression: request.userInfo.username != '@@TOWER_USER_ACTOR@@'
      message: Tower writes PipelineRuns only through glidepath-api (Glidepath API P6).
    - expression: request.namespace.matches('^(app|infra)-[a-z0-9-]+-cicd$')
      message: glidepath-api may only start or cancel PipelineRuns in an app's or InfraService's -cicd namespace.
    - expression: "!variables.isCreate || !has(object.spec.pipelineSpec)"
      message: No inline pipelineSpec.
    - expression: >-
        !variables.isCreate || (
          has(variables.ref.resolver) && variables.ref.resolver == 'cluster' &&
          size(variables.refParams) == 3 &&
          variables.refParams.all(p, type(p) == map) &&
          variables.refParams.exists(p, has(p.name) && p.name == 'kind' && has(p.value) && p.value == 'pipeline') &&
          variables.refParams.exists(p, has(p.name) && p.name == 'name') &&
          variables.refParams.exists(p, has(p.name) && p.name == 'namespace' && has(p.value) && p.value == 'platform-catalog')
        )
      message: pipelineRef must be the cluster resolver for a Pipeline in platform-catalog.
    # Per-task accounts (pipeline trust T5). A build run must carry taskRunSpecs that put the tasks running the repository's
    # code on source-runner and push-image on image-pusher (Glidepath's cicd-run-shape / cicd-run-source-isolation), so a rerun
    # must be able to carry them: but only those pairs, or a rerun could give a task that runs repo code a credentialed account.
    - expression: >-
        !variables.isCreate || !has(object.spec.taskRunSpecs) || (
          type(object.spec.taskRunSpecs) == list && size(variables.specs) == size(variables.rawSpecs) &&
          variables.specs.all(s, s.all(k, k in ['pipelineTaskName', 'serviceAccountName']) &&
            has(s.serviceAccountName) && type(s.serviceAccountName) == string &&
            has(s.pipelineTaskName) && type(s.pipelineTaskName) == string)
        )
      message: taskRunSpecs entries may name only a task and a serviceAccountName (both strings), with no other override (no podTemplate, computeResources, stepSpecs, sidecarSpecs or metadata).
    - expression: >-
        !variables.isCreate || variables.specs.all(s, !has(s.pipelineTaskName) || type(s.pipelineTaskName) != string ||
          variables.specs.filter(t, has(t.pipelineTaskName) && t.pipelineTaskName == s.pipelineTaskName).size() == 1)
      message: taskRunSpecs may name a task once per task.
    - expression: >-
        !variables.isCreate || variables.specs.all(s, !has(s.serviceAccountName) || !has(s.pipelineTaskName) ||
          type(s.serviceAccountName) != string || type(s.pipelineTaskName) != string ||
          (s.serviceAccountName == 'source-runner' && variables.pipelineName in variables.sourceTasks &&
            s.pipelineTaskName in variables.sourceTasks[variables.pipelineName]) ||
          (s.serviceAccountName == 'image-pusher' && variables.pipelineName in variables.pusherTasks &&
            s.pipelineTaskName in variables.pusherTasks[variables.pipelineName]) ||
          (s.serviceAccountName == 'glidepath-cloud-deployer' && variables.pipelineName in variables.cloudTasks &&
            s.pipelineTaskName in variables.cloudTasks[variables.pipelineName]))
      message: >-
        taskRunSpecs entries (pipelineTaskName, serviceAccountName) may be only the platform's own pairs for this Pipeline:
        a task that runs repository code as source-runner, the push task as image-pusher, a cloud deploy task as
        glidepath-cloud-deployer (Glidepath cicdRunAdmission.sourceTasks, pusherTasks, cloudDeployerTasks); any other task runs as
        pipeline-runner and needs no entry.
    - expression: >-
        !variables.isCreate || (
          has(object.spec.taskRunTemplate) && has(variables.trt.serviceAccountName) &&
          variables.trt.serviceAccountName == 'pipeline-runner'
        )
      message: taskRunTemplate.serviceAccountName must be pipeline-runner.
    - expression: >-
        !variables.isCreate || !has(variables.trt.podTemplate) ||
        (type(variables.trt.podTemplate) == map && variables.trt.podTemplate.all(k, k == 'hostAliases'))
      message: taskRunTemplate.podTemplate may only set hostAliases.
    - expression: >-
        !variables.isCreate || !has(object.spec.workspaces) || (
          type(object.spec.workspaces) == list &&
          variables.rawWorkspaces.all(w, type(w) == map && w.all(k, k in ['name', 'subPath', 'emptyDir', 'volumeClaimTemplate']))
        )
      message: Workspaces may only be emptyDir or volumeClaimTemplate.
    # A volumeClaimTemplate is a PVC the run creates: accessModes and a bounded storage request, nothing that names or clones
    # another volume (dataSource, dataSourceRef, volumeName, selector). storageClassName only if the cluster allowlists it
    # (glidepath.runStorageClasses). Tekton may store metadata.creationTimestamp: null and status: {}; nothing else.
    - expression: >-
        !variables.isCreate || variables.rawWorkspaces.all(w, type(w) != map || !has(w.volumeClaimTemplate) || (
          type(w.volumeClaimTemplate) == map &&
          w.volumeClaimTemplate.all(k, k in ['metadata', 'spec', 'status']) &&
          (!has(w.volumeClaimTemplate.metadata) || (type(w.volumeClaimTemplate.metadata) == map &&
            w.volumeClaimTemplate.metadata.all(k, k == 'creationTimestamp'))) &&
          (!has(w.volumeClaimTemplate.status) || (type(w.volumeClaimTemplate.status) == map && size(w.volumeClaimTemplate.status) == 0)) &&
          has(w.volumeClaimTemplate.spec) && type(w.volumeClaimTemplate.spec) == map &&
          w.volumeClaimTemplate.spec.all(k, k in ['accessModes', 'resources', 'storageClassName', 'volumeMode']) &&
          (!has(w.volumeClaimTemplate.spec.accessModes) || (type(w.volumeClaimTemplate.spec.accessModes) == list &&
            w.volumeClaimTemplate.spec.accessModes.all(m, m == 'ReadWriteOnce'))) &&
          (!has(w.volumeClaimTemplate.spec.volumeMode) || w.volumeClaimTemplate.spec.volumeMode == 'Filesystem') &&
          (!has(w.volumeClaimTemplate.spec.storageClassName) || w.volumeClaimTemplate.spec.storageClassName in variables.storageClasses) &&
          has(w.volumeClaimTemplate.spec.resources) && type(w.volumeClaimTemplate.spec.resources) == map &&
          w.volumeClaimTemplate.spec.resources.all(k, k == 'requests') &&
          has(w.volumeClaimTemplate.spec.resources.requests) && type(w.volumeClaimTemplate.spec.resources.requests) == map &&
          w.volumeClaimTemplate.spec.resources.requests.all(k, k == 'storage') &&
          has(w.volumeClaimTemplate.spec.resources.requests.storage) &&
          type(w.volumeClaimTemplate.spec.resources.requests.storage) == string &&
          w.volumeClaimTemplate.spec.resources.requests.storage.matches('^([1-9]|[1-4][0-9]|50)Gi$')
        ))
      message: A workspace volumeClaimTemplate may set only accessModes (ReadWriteOnce) and a storage request of 1Gi to 50Gi (no dataSource, dataSourceRef, volumeName, selector, limits, or a storageClassName the cluster does not allow).
    - expression: >-
        !variables.isCreate || !variables.anns.exists(k, k.startsWith('pipelinesascode.tekton.dev/'))
      message: A run glidepath-api starts must not carry Pipelines-as-Code annotations (it would report status for a trigger it is not).
    # An explicit allowlist, so a new prefix cannot slip in: the origin stamps the ref-protection guard (verify-ref-protection)
    # checks against the git host (Glidepath refuses them on a run a .tekton file creates), the rerun/idempotency markers
    # glidepath-api sets, and the initiator the promote and rollback TriggerTemplates record.
    - expression: >-
        !variables.isCreate || variables.anns.all(k, k in ['glidepath.io/origin-ref', 'glidepath.io/origin-sha',
          'glidepath.io/origin-event', 'glidepath.hangar.io/rerun-of', 'glidepath.hangar.io/idempotency-key-sha256',
          'hangar.io/initiator', 'glidepath.io/origin-chain-id', 'glidepath.io/origin-chain-slug', 'glidepath.io/origin-trace-id',
          'glidepath.io/origin-traceparent', 'glidepath.io/origin-flow-start-time', 'glidepath.io/origin-finished-at'])
      message: A run glidepath-api starts may carry only the annotations glidepath.io/origin-ref, origin-sha and origin-event, the promotion-lineage annotations glidepath.io/origin-chain-id, origin-chain-slug, origin-trace-id, origin-traceparent, origin-flow-start-time and origin-finished-at, glidepath.hangar.io/rerun-of and idempotency-key-sha256, and hangar.io/initiator.
    # Promotion lineage (glidepath docs/admin/api.md#promotion-lineage): the flow that built the image a promote or rollback releases.
    # Information, not authority, but the catalog's trace join and release record read them, so each carries only the shape glidepath-api
    # writes: a chain id (UUID), the chain's two-word slug, a trace id (32 hex), a W3C traceparent, and RFC 3339 times.
    - expression: >-
        !variables.isCreate || (
          (!('glidepath.io/origin-chain-id' in variables.anns) ||
            variables.anns['glidepath.io/origin-chain-id'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')) &&
          (!('glidepath.io/origin-chain-slug' in variables.anns) ||
            variables.anns['glidepath.io/origin-chain-slug'].matches('^[a-z]{2,20}-[a-z]{2,20}$')) &&
          (!('glidepath.io/origin-trace-id' in variables.anns) ||
            variables.anns['glidepath.io/origin-trace-id'].matches('^[0-9a-f]{32}$')) &&
          (!('glidepath.io/origin-traceparent' in variables.anns) ||
            variables.anns['glidepath.io/origin-traceparent'].matches('^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$')) &&
          (!('glidepath.io/origin-flow-start-time' in variables.anns) ||
            variables.anns['glidepath.io/origin-flow-start-time'].matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]{1,9})?Z$')) &&
          (!('glidepath.io/origin-finished-at' in variables.anns) ||
            variables.anns['glidepath.io/origin-finished-at'].matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]{1,9})?Z$'))
        )
      message: The promotion-lineage annotations must have the shape glidepath-api writes - origin-chain-id a UUID, origin-chain-slug two lowercase words joined by a hyphen, origin-trace-id 32 hex characters, origin-traceparent a W3C traceparent (00-<32 hex>-<16 hex>-01), origin-flow-start-time and origin-finished-at an RFC 3339 UTC time.
    - expression: >-
        variables.isCreate || (
          object.spec.all(k, k == 'status' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
          oldObject.spec.all(k, k == 'status' || k in object.spec)
        )
      message: glidepath-api may only change spec.status on an existing PipelineRun.
    - expression: >-
        variables.isCreate || !has(object.spec.status) ||
        (has(oldObject.spec.status) && object.spec.status == oldObject.spec.status) ||
        object.spec.status in ['Cancelled', 'CancelledRunFinally', 'StoppedRunFinally']
      message: spec.status may only be set to Cancelled, CancelledRunFinally or StoppedRunFinally.
    - expression: >-
        variables.isCreate || (
          has(object.metadata.labels) == has(oldObject.metadata.labels) &&
          (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
          has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
          (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)
        )
      message: glidepath-api may not change an existing PipelineRun's labels or annotations.
---
# The required side of the per-task accounts, held to the same rule as Glidepath's cicd-run-source-isolation (glidepath
# control plane) holds a Pipelines-as-Code run to: a run of a Pipeline that runs the repository's code (sourceTasks) must give
# those tasks to source-runner, and its push task (pusherTasks) to image-pusher. Without it a rerun that dropped taskRunSpecs
# would run repository code as pipeline-runner, with the platform's token. Separate policy so its action can follow Glidepath's
# sourceIsolationActions: glidepath.sourceIsolation (default deny) sets both. While a cluster upgrades to a Glidepath that
# generates the entries, set it to warn: runs without them are admitted with a warning, and the first policy still refuses
# any credentialed account on a task that runs repository code.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: glidepath-api-pipelinerun-source-isolation
  annotations:
    policies.kyverno.io/title: glidepath-api source isolation
    policies.kyverno.io/description: A PipelineRun glidepath-api starts for a Pipeline that runs repository code must run those tasks as source-runner and the push task as image-pusher.
spec:
  validationActions: @@GLIDEPATH_SOURCE_ISOLATION_ACTIONS@@
  failurePolicy: Fail
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["*"]
        operations: ["CREATE"]
        resources: ["pipelineruns"]
  matchConditions:
    - name: a-glidepath-api-run-of-a-pipeline-that-runs-repository-code
      expression: >-
        has(request.userInfo.username) && request.userInfo.username == 'system:serviceaccount:platform-system:glidepath-api' &&
        has(request.namespace) && request.namespace.matches('^(app|infra)-[a-z0-9-]+-cicd$') &&
        has(object.spec.pipelineRef) && type(object.spec.pipelineRef) == map &&
        has(object.spec.pipelineRef.params) && type(object.spec.pipelineRef.params) == list &&
        object.spec.pipelineRef.params.exists(p, type(p) == map && has(p.name) && p.name == 'name' && has(p.value) &&
          type(p.value) == string && p.value in @@GLIDEPATH_SOURCE_TASK_PIPELINES@@)
  variables:
    - name: sourceTasks
      expression: '@@GLIDEPATH_SOURCE_TASKS@@'
    - name: pusherTasks
      expression: '@@GLIDEPATH_PUSHER_TASKS@@'
    - name: pipelineName
      expression: "object.spec.pipelineRef.params.filter(p, type(p) == map && has(p.name) && p.name == 'name' && has(p.value) && type(p.value) == string)[0].value"
    - name: specs
      expression: "has(object.spec.taskRunSpecs) && type(object.spec.taskRunSpecs) == list ? object.spec.taskRunSpecs.filter(s, type(s) == map) : []"
  validations:
    - expression: >-
        variables.sourceTasks[variables.pipelineName].all(t,
          variables.specs.exists(s, has(s.pipelineTaskName) && s.pipelineTaskName == t &&
            has(s.serviceAccountName) && s.serviceAccountName == 'source-runner'))
      message: This Pipeline runs the repository's own code, so its tasks listed in Glidepath's cicdRunAdmission.sourceTasks must run as source-runner (taskRunSpecs). A rerun of a run that has no such entries is refused (or, with glidepath.sourceIsolation warn, warned about); start a new run from the repository instead.
    - expression: >-
        !(variables.pipelineName in variables.pusherTasks) ||
        variables.pusherTasks[variables.pipelineName].all(t,
          variables.specs.exists(s, has(s.pipelineTaskName) && s.pipelineTaskName == t &&
            has(s.serviceAccountName) && s.serviceAccountName == 'image-pusher'))
      message: This Pipeline pushes the image it built, so its tasks listed in Glidepath's cicdRunAdmission.pusherTasks must run as image-pusher (taskRunSpecs).
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: tower-rolebinding-delete
  annotations:
    policies.kyverno.io/title: Tower RoleBinding deletes
    policies.kyverno.io/description: Backstage may only delete tower-breakglass-* RoleBindings.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: backstage
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username in ['@@TOWER_USER_ACTOR@@']
  validations:
    - expression: oldObject != null && oldObject.metadata.name.startsWith('tower-breakglass-')
      message: Backstage may only delete RoleBindings named tower-breakglass-*.
