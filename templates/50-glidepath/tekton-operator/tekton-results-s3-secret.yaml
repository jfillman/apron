# S3 credentials for the Tekton Results API's object storage backend (step logs +
# result blobs), referenced by tektonconfig.yaml's result.secret_name. Reuses the
# existing observability MinIO instance (40-observability/minio) and its
# tekton-results bucket (added to that directory's create-buckets-job.yaml), same
# static admin/minioadmin123 creds already used by that job - not an ExternalSecret,
# matching how the other observability buckets' creds are handled in this repo.
#
# Key names are fixed by tektoncd/results' API server, not this platform's choice.
apiVersion: v1
kind: Secret
metadata:
  name: tekton-results-s3
  namespace: tekton-pipelines
type: Opaque
stringData:
  S3_BUCKET_NAME: tekton-results
  S3_ENDPOINT: http://minio.observability.svc.cluster.local:9000
  S3_HOSTNAME_IMMUTABLE: "false"
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: admin
  S3_SECRET_ACCESS_KEY: minioadmin123
