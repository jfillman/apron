# Separate from application.yaml (the Crossplane Helm chart itself) because Providers/
# Functions are plain manifests, not part of that chart's own templates - a directory
# source pointed at this same folder, excluding the Application objects themselves so
# ArgoCD doesn't try to interpret them as plain resources to apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-packages
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-dev.git
    targetRevision: main
    path: 10-crds-operators/crossplane
    directory:
      exclude: "{application.yaml,packages-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
