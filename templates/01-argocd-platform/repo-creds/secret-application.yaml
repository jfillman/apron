# Same split as 40-observability/minio/{application.yaml,secret-application.yaml}: a
# directory-sourced plain manifest (the ExternalSecret in this same folder) that isn't
# part of any Helm chart's own templates, via a directory source excluding this
# Application object itself so ArgoCD doesn't try to interpret it as a plain resource.
#
# Fixes a real, previously-unnoticed gap: this cluster's argocd-platform instance
# (01-argocd-platform/install.yaml, release namespace `argocd` - this Application's own
# destination) has never had ANY GitHub repository credential configured -
# `argocd-cm`'s repository.credentials/repositories are both empty, and no
# `argocd.argoproj.io/secret-type: repo-creds` Secret has ever existed. Every
# onboarded app's own CICD Application (e.g. search-api-cicd) sources one of its two
# `sources` directly from that app's own src repo (to read cicd.yaml as a Helm values
# file - platform-cicd/charts/platform-cicd-app's own convention) - for a PRIVATE repo
# (this platform's actual XRD default), that source has been failing with
# "authentication required: Repository not found" (GitHub's own generic 404 for
# unauthenticated access to a private repo) since before this was ever noticed: it
# only went undetected because checkout-api and order-api both happen to be public
# repos, dodging the bug entirely. Found live 2026-08-25 onboarding search-api/
# process-api (both private, the real default) - nodejs-demo-app-cicd (private, onboarded
# 2026-08-16) already carried the identical ComparisonError, unnoticed until now.
#
# GitHub App auth (githubAppID/githubAppInstallationID/githubAppPrivateKey), not a PAT -
# reuses the SAME App this platform's own token-review-interceptor already uses
# (platform-system/github-app-creds, itself ESO-synced from Infisical) rather than
# minting or storing a second credential. installationID (150673499) is NOT sensitive -
# just the numeric id of this App's one installation on <scm-host>/<owner> - but isn't
# stored anywhere in this platform today: platform/broker/internal/githubapp.go
# deliberately resolves it per-repo at runtime via the App's own JWT instead of storing
# it statically (avoids assuming an installation exists before it does). ArgoCD's own
# repo-creds Secret shape has no such per-repo resolution, so it's a static value here -
# supplied out-of-band (not looked up by any automation in this session), matching
# every other credential's "one real, human-provisioned root" posture this platform
# already uses (docs/admin/secrets-management.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-platform-repo-creds
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-repo-creds
spec:
  project: default
  source:
    repoURL: @@REPO_URL@@
    targetRevision: main
    path: 01-argocd-platform/repo-creds
    directory:
      exclude: "secret-application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
