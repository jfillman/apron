# Same split as 10-crds-operators/crossplane/{application.yaml,packages-application.yaml}:
# the Helm chart (application.yaml) vs. a plain manifest that isn't part of that chart's own
# templates (thanos-objstore-secret.yaml), via a directory source excluding the two
# Application objects themselves so ArgoCD doesn't try to interpret them as plain resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-secrets
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: observability
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-dev.git
    targetRevision: main
    path: 40-observability/minio
    directory:
      exclude: "{application.yaml,secret-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
