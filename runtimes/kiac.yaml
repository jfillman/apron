# runtimes/kiac.yaml - a local single-node kiac cluster (Apple `container` VMs). `apron up` runs
#   kiac create cluster --name <name> --workers W --cni C --kernel K --cpus N --cp-memory M
# Never with --gateway: Traefik (10-crds-operators/traefik) is Apron's one gateway on every runtime. kiac brings Cilium,
# so no CNI step. Hosts reach Traefik on the node's IP and its NodePorts (see README "Local clusters").
runtime:
  type: kiac
  nodeExec: container exec -i   # + <node>, for apron identity
  controlPlane:
    # kube-controller-manager and kube-scheduler leader election (defaults 15s/10s/2s): a slow etcd or API server made the
    # lease call miss 10s and both crash-looped (hangar-dev 2026-11: 362/348 restarts), each restart re-listing everything.
    # Whole seconds; lease > renew > 1.2 x retry. kind: rendered into hack/kind-config.yaml. kiac has no kubeadm hook:
    # run hack/control-plane-tuning.sh apply after `apron up` (docs/control-plane-tuning.md).
    leaderElection:
      leaseDuration: 60s
      renewDeadline: 40s
      retryPeriod: 10s
  kiac:
    workers: 0
    cni: cilium
    kernel: full
    cpus: 10
    cpMemory: 32G               # --cp-memory, not --memory (worker-only, ignored with --workers 0)
    maxPods: 250                # kubelet default is 110; set on each node after create (apron up/resume), as kind's config does
traefik:
  serviceType: NodePort
  fixedNodePorts: true
  httpNodePort: 30080
  httpsNodePort: 30443
components:
  metricsServer: true          # kiac ships no metrics-server
