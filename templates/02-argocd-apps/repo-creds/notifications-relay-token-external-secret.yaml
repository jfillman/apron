# The bearer token argocd-apps' notifications controller sends to glidepath's
# argocd-outcome-relay (ADR-0021 phase 2). The SAME per-cluster token the hook Jobs and the
# Rollouts notification config use, from the same Infisical key. This ExternalSecret is
# the SOLE owner of argocd-notifications-secret (creationPolicy: Owner); the argo-cd chart
# no longer creates it (notifications.secret.create: false in argocd-apps-install). Until
# 2026-11-10 it was Merge into a chart-created Secret, which gave the Secret two writers.
# On an existing Secret, Owner adopts it in place (ESO v2.8 applyOwnership sets the
# controller reference); deletionPolicy Retain keeps it if the provider key goes missing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-relay-token
  namespace: argocd-apps
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-repo-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: relay-token
      remoteRef:
        key: platform-outcome-relay-token
