# Full stack, mirroring kind-observe (per direct instruction 2026-08-13, superseding
# an earlier, deliberately-minimal version of this file that skipped Thanos/Loki/
# Tempo) - values transcribed from /Users/jerf/tech/observability/
# kube-prometheus-stack-values.yaml, the same source this repo's README table cites
# for kind-observe's own install. Depends on minio/ (the thanos-objstore-config
# Secret) being up first - Prometheus's Thanos sidecar container won't start without it.
#
# Release name is exactly `kube-prometheus-stack` deliberately - the chart's own
# default ruleSelector/serviceMonitorSelector (serviceMonitorSelectorNilUsesHelmValues/
# ruleSelectorNilUsesHelmValues left at their chart defaults, true) matches
# `release: kube-prometheus-stack` on ServiceMonitor/PrometheusRule objects, which
# both idp-service-catalog's SLO Composition (sloth/application.yaml's own
# extraLabels) and idp-application's own serviceMonitor.additionalLabels default
# already assume - confirmed against this real install, not left as an
# unconfirmed placeholder anymore (see idp-application chart README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: observability
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.19.1
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        prometheus:
          prometheusSpec:
            retention: 6h # short - Thanos owns long-term retention via MinIO
            walCompression: true
            thanos:
              # Turns on the Thanos sidecar container in every Prometheus pod.
              objectStorageConfig:
                existingSecret:
                  name: thanos-objstore-config
                  key: objstore.yml
            # Let Prometheus discover the OTel Collector's metrics endpoint.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            # Tempo's metrics-generator remote-writes span/service-graph metrics in -
            # Prometheus doesn't accept remote-write by default.
            enableFeatures:
              - remote-write-receiver
          # Exposes the sidecar's gRPC port so Thanos Query can find it.
          thanosService:
            enabled: true
          thanosServiceMonitor:
            enabled: true
        alertmanager:
          enabled: true
        grafana:
          enabled: true
          adminPassword: prom-operator # change this for anything beyond local learning
          sidecar:
            dashboards:
              enabled: true
              # label/labelValue left at chart defaults (grafana_dashboard: "1") -
              # matches idp-service-catalog's SLO Composition dashboard ConfigMap
              # exactly (compositions/slo/templates/dashboard-configmap.yaml). NOT
              # part of the original kind-observe source values file - added for
              # idp's SLO work, kept here alongside the rest of the transcription.
          # Provisions Loki + Tempo as datasources alongside the stack's own
          # Prometheus datasource, and wires the trace<->log<->metric links.
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.observability.svc.cluster.local
              uid: loki
              jsonData:
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: 'trace_id=(\w+)'
                    name: TraceID
                    url: '$${__value.raw}'
            - name: Tempo
              type: tempo
              access: proxy
              url: http://tempo.observability.svc.cluster.local:3200
              uid: tempo
              jsonData:
                tracesToLogsV2:
                  datasourceUid: 'loki'
                  spanStartTimeShift: '-5m'
                  spanEndTimeShift: '5m'
                  filterByTraceID: true
                  filterBySpanID: false
                tracesToMetrics:
                  datasourceUid: 'thanos-query'
                  spanStartTimeShift: '-5m'
                  spanEndTimeShift: '5m'
                  queries:
                    - name: 'Span latency (p99)'
                      query: 'histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))'
                serviceMap:
                  datasourceUid: 'thanos-query'
                nodeGraph:
                  enabled: true
            - name: Thanos-Query
              type: prometheus
              access: proxy
              url: http://thanos-query.observability.svc.cluster.local:9090
              uid: thanos-query
              isDefault: false
              jsonData:
                exemplarTraceIdDestinations:
                  - datasourceUid: tempo
                    name: trace_id
                httpMethod: POST
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Same annotation-size limit hit on ArgoCD's and external-secrets' own CRDs
      # (see 01-argocd-platform/README.md) - kube-prometheus-stack's CRDs (Prometheus,
      # Alertmanager, PrometheusRule, ServiceMonitor, ThanosRuler, Probe, ...) are
      # large enough to hit it too. Confirmed necessary live.
      - ServerSideApply=true
