# Syncs the provider-azure-creds Secret for provider-azure-config.yaml from the platform-cicd-<cluster>
# Infisical project (what platform-secret-store reads), key provider-azure-creds - same pattern as
# provider-github-creds-external-secret.yaml. Until that Infisical secret exists this stays
# SecretSyncedError and the cloud providers report they cannot get credentials; nothing else breaks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provider-azure-creds
  namespace: crossplane-system
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
    hangar.io/origin: cloud-targets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: provider-azure-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials
      remoteRef:
        key: provider-azure-creds
