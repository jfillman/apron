# Directory-source Application applying this folder's own AppProject as a plain
# manifest - same pattern as ../../00-bootstrap/cluster-registry/application.yaml
# (excludes itself and applicationset.yaml, everything else in the directory gets
# applied as-is). root-app-of-apps.yaml's include glob already matches both
# **/application.yaml and **/applicationset.yaml, so this file and applicationset.yaml
# in this same directory are both discovered independently - no change needed there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xr-requests-appproject
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: xr-requests
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-dev.git
    targetRevision: main
    path: 02-argocd-apps/xr-requests
    directory:
      exclude: "{application.yaml,applicationset.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-apps
  syncPolicy:
    automated:
      selfHeal: true
