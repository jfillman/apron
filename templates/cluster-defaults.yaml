# This cluster's defaults, in one place (ADR-0023 slice 1).
#
# defaultChart: the chart every environment on this cluster renders unless the app pins its own (deploy.chart, a
# later ADR-0023 slice). Read by: the Flight tenant-onboarding ApplicationSet (02-argocd-apps/tenant-onboarding/application.yaml),
# the Glidepath control plane (forwarded to every app's glidepath-app: PR previews, and Ground environments once
# ADR-0023 slice 3 lands) and the Glidepath catalog (the values gate runs airframe-validate at this same tag).
#
# Upgrading it: glidepath docs/admin/adr/0023-per-app-chart-deploy-chart.md "Upgrading the cluster default" - render every
# live env file on the old and new chart and diff first; one PR bumps this file; rollback = revert it.
defaultChart:
  repoURL: https://@@SCM_HOST@@/@@SCM_OWNER@@/airframe.git
  path: charts/airframe-application
  targetRevision: @@AIRFRAME_CHART_VERSION@@

# observability: this cluster's observability facts, passed to every environment as airframe-application's
# platform-owned `observability` values (Glidepath's control plane forwards it to Ground environments and previews;
# the tenant-onboarding ApplicationSet sets the same for Flight environments). namespace is where Prometheus runs:
# the app's NetworkPolicy admits it on the scrape port. instrumentation names the OpenTelemetry Operator
# Instrumentation (40-observability/otel-instrumentation/) that the app's pods are injected with for their runtime.
# Needs airframe-application with the `observability` key (Airframe v0.3.163+): an older chart refuses it.
observability:
#@if components.observability
  namespace: observability
#@end
#@if components.observability and observability.full and components.certManager
  instrumentation: observability/hangar
#@end
