# Same shape as platform-cicd's own control-plane ClusterSecretStore
# (platform-cicd/charts/platform-cicd-control-plane/templates/secretstore/
# cluster-secret-store.yaml) - deliberately same name (platform-secret-store) so
# idp-application's release-tracking/relay-token mechanism and every app's own
# ServiceAccount (registry-credentials via imagePullSecrets) work identically on
# the prod cluster with zero app-side value changes, not a per-cluster rename. the prod cluster has
# no platform-cicd control-plane instance of its own to bundle this into, so it's a
# standalone pair of manifests here instead of a Helm chart's templates/ - same
# content, different delivery mechanism.
#
# Infisical-backed now (real backend, provisioned by the SecretStore XR in
# secretstore-xr.yaml this same directory via provider-infisical; before 2026-09-23 it
# was the infisical-secretstore-operator's InfisicalProject CR), not ESO's `kubernetes` provider - that
# mechanism (and the platform-secrets Namespace it needed) is retired: this platform's
# secrets all flow through Infisical now, see platform-cicd's
# docs/admin/secrets-management.md.
#
# universalAuthCredentials, not kubernetesAuthCredentials - the prod cluster isn't the
# Infisical host (Infisical only runs on the dev cluster), same reason idp's own per-app
# the prod cluster SecretStores use Universal Auth cross-cluster (idp/docs/
# service-catalog-design.md Item 8's multi-cluster revision). A real, persisted
# clientId/clientSecret, minted by the SecretStore XR (secretstore-xr.yaml) and written to
# platform-cicd-<cluster>-infisical-creds - same accepted tradeoff idp's own per-app
# upper-cluster identities already carry. (Before 2026-09-23 this read
# platform-cicd-infisical-creds, holding an older operator-made identity's credentials;
# that identity and Secret are retired.)
apiVersion: v1
kind: Namespace
metadata:
  name: glidepath-secrets
  labels:
    hangar.io/subcomponent: "secretstore"
    hangar.io/purpose: glidepath-infisical-creds-home
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secret-store
  labels:
    hangar.io/subcomponent: "secretstore"
spec:
  provider:
    infisical:
      # NodePort address for the dev cluster's Infisical, WITH the /api suffix - this is
      # ESO's own hostAPI field (different convention from the operator's own
      # INFISICAL_API_URL env var in infisical-secretstore-operator/deployment.yaml,
      # which deliberately has NO /api suffix - see that file's own header for the
      # real double-/api/api/v1 bug that distinction fixed). Same value idp's own
      # per-app the prod cluster SecretStores use.
      hostAPI: "@@INFISICAL_URL@@"
      auth:
        universalAuthCredentials:
          clientId:
            name: glidepath-@@CLUSTER_NAME@@-infisical-creds
            namespace: glidepath-secrets
            key: clientId
          clientSecret:
            name: glidepath-@@CLUSTER_NAME@@-infisical-creds
            namespace: glidepath-secrets
            key: clientSecret
      secretsScope:
        # platform-cicd-<cluster>-v2, not platform-cicd-<cluster> - see
        # infisical-project.yaml's own header (2026-09-02 orphaned-slug fix), must
        # stay in sync with that file's spec.slug.
        projectSlug: glidepath-@@CLUSTER_NAME@@
        environmentSlug: shared
        secretsPath: "/"
