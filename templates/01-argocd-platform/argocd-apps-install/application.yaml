# gitops-strategy.md §2/§4: the app-owner-facing ArgoCD instance, installed and owned
# by argocd-platform (this Application lives in argocd-platform's own `argocd`
# namespace - it's the installer, not the thing being installed). "Let ArgoCD manage
# ArgoCD" applied to the SECOND instance rather than the first: the first instance's own
# self-management (vendoring 01-argocd-platform/install.yaml into a self-referential
# Application) stays deliberately deferred - see that directory's own README - real
# bootstrap-ordering risk if that goes wrong takes down the only thing running this
# repo's own sync. Standing up argocd-apps fresh via a normal Application carries none of
# that risk: it's a brand-new instance with zero live workload on it yet.
#
# Chart version 10.2.1 (appVersion v3.4.5) deliberately matches the exact version
# already running on the dev cluster's platform instance (confirmed live via
# `kubectl get deployment argocd-server -n argocd -o jsonpath='{.spec.template.spec.
# containers[0].image}'`), not the newer 10.3.2/v3.5.0 bootstrap-upper-cluster.sh uses
# for the prod cluster's single-instance install - both instances on THIS cluster share the
# same CRDs (installed once, cluster-wide, by 01-argocd-platform/install.yaml's own
# v3.4.5-pinned manifest), so keeping both ArgoCD versions identical avoids any
# controller/CRD-schema skew risk between them.
#
# crds.install: false - the CRDs are already cluster-wide from 01-argocd-platform's own
# install.yaml; a second Helm-managed CRD install would fight over ownership of the same
# CustomResourceDefinition objects.
#
# configs.params."reposerver.repo.cache.expiration": 3m - same fix 01-argocd-platform/
# install.yaml's own argocd-cmd-params-cm already carries (found live chasing the
# xr-requests/ deadlock), applied here too after hitting the identical symptom live on
# THIS instance: checkout-api-dev's Application reported Synced immediately after a
# platform/envs/dev.yaml commit, but the live Rollout still ran the previous image until
# a manual hard-refresh busted the stale cached manifest render. The two instances don't
# share a repo-server, so patching one never fixed the other - each needs its own.
#
# application.namespaces / applicationsetcontroller.namespaces: scoped to the *-cicd glob
# (2026-08-24) so THIS instance's Application/ApplicationSet controllers reconcile
# platform-cicd-app's ephemeral-envs.yaml (the pr-envs ApplicationSet and its generated
# per-PR Applications, which live in each tenant's own -cicd namespace rather than
# argocd-apps's own) - matches this instance's stated role (gitops-strategy.md §2:
# "argocd-apps ... watches per-app Applications generated by an ApplicationSet"), since
# PR-based ephemeral environments are app-owner/PR-driven, not cluster-admin work.
# Initially built on argocd-platform instead (2026-08-23) since that instance already
# fully owns the `-cicd` namespace class; moved here once it was clear nothing else on
# argocd-platform needed the wider watch (see 01-argocd-platform/install.yaml's own
# comment) and that per gitops-strategy.md §2 this was always argocd-apps's job.
#
# This is still a narrower opt-in than it looks: ArgoCD's stock default (no
# application.namespaces configured) scopes an instance's controllers to objects
# physically inside its OWN release namespace only - that default is what keeps
# argocd-platform and argocd-apps from seeing or reconciling each other's objects without
# one of them opting in. Widening argocd-apps's watch to `*-cicd` doesn't cross into
# argocd-platform's territory (argocd-platform doesn't watch `*-cicd` at all any more) or
# grant any new capability beyond reconciling this one already-scoped ApplicationSet kind.
#
# applicationsetcontroller.enable.tokenref.strict.mode: required once an ApplicationSet
# generator's tokenRef Secret (see ephemeral-envs.yaml's pr-generator-token) can live
# outside argocd-apps - without strict mode a generator could read ANY Secret in its own
# namespace, not just ones meant for it. Requires the referenced Secret to carry
# `argocd.argoproj.io/secret-type: scm-creds` (set by ephemeral-envs.yaml's
# pr-token-refresher CronJob at creation time).
#
# applicationsetcontroller.allowed.scm.providers: applicationsetcontroller.namespaces set
# to anything requires either --enable-scm-providers=false or --allowed-scm-providers, or
# the controller refuses to start at all. ephemeral-envs.yaml's pr-envs ApplicationSet
# uses a pullRequest/github SCM generator, so providers can't just be disabled outright -
# scoped to GitHub's API instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps-install
  namespace: argocd
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: argocd-apps
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: @@ARGOCD_CHART_VERSION@@
    helm:
      releaseName: argocd-apps
      valuesObject:
        crds:
          install: false
        dex:
          enabled: false
        # Chart-level flag, separate from the raw configs.params.applicationsetcontroller.
        # namespaces key below - that key alone only tells the controller WHICH namespaces
        # to watch; it does not grant the RBAC needed to do it. Without this, the
        # applicationset-controller's own Role stays namespace-scoped (no ClusterRole/
        # ClusterRoleBinding rendered at all) and it fails outright trying to list
        # Applications across the *-cicd glob: "applications.argoproj.io is forbidden:
        # ... cannot list resource \"applications\" in API group \"argoproj.io\" at the
        # cluster scope" (found live 2026-08-24 moving ephemeral-envs.yaml's watch here).
#@if not isControlPlane
        notifications:
          # argocd-notifications-secret has ONE owner: the ExternalSecret
          # argocd-notifications-relay-token (creationPolicy: Owner). With the chart also
          # creating it, ESO's hourly refresh and this app's selfHeal each rewrote the
          # Secret, and the Clearance collector saw two out-of-band writes every hour
          # (2026-11-10). ESO adopts the existing Secret in place (sets its
          # ownerReference), and Argo CD stops tracking an object that has one, so the
          # switch needs no delete and no gap.
          secret:
            create: false
          notifiers:
            service.webhook.glidepath-relay: |
              url: @@RELAY_URL@@
              headers:
              - name: Authorization
                value: Bearer $relay-token
              - name: Content-Type
                value: application/json
          templates:
            template.sync-fact: |
              webhook:
                glidepath-relay:
                  method: POST
                  path: /argocd/@@CLUSTER_NAME@@
                  body: |
                    {"source":"argocd","name":{{toJson .app.metadata.name}},"app":{{toJson (index .app.metadata.labels "hangar.io/app")}},"env":{{toJson (index .app.metadata.labels "hangar.io/env")}},"phase":{{toJson .app.status.operationState.phase}},"retryCount":{{toJson .app.status.operationState.retryCount}},"message":{{toJson .app.status.operationState.message}},"revision":{{toJson .app.status.sync.revision}},"finishedAt":{{toJson .app.status.operationState.finishedAt}}}
          triggers:
            trigger.on-sync-retrying: |
              - when: app.status.operationState != nil and app.status.operationState.phase == "Running" and app.status.operationState.retryCount > 0
                oncePer: string(app.status.operationState.retryCount)
                send: [sync-fact]
            trigger.on-sync-failed: |
              - when: app.status.operationState != nil and app.status.operationState.phase in ["Error", "Failed"]
                oncePer: app.status.operationState.finishedAt
                send: [sync-fact]
          subscriptions:
            - selector: hangar.io/subcomponent=tenant-onboarding
              triggers: [on-sync-retrying, on-sync-failed]
              recipients: ["glidepath-relay:"]
        crds:
          install: false
        dex:
          enabled: false
        # 2026-09-15: argocd-repo-server was found crash-looping live on
        # this cluster's OTHER ArgoCD instance (argocd-platform, the
        # install.yaml-managed one in the `argocd` namespace) - 265
        # restarts, a real sync failing mid-comparison with a plain
        # "connection refused" to its own :8081. Root cause looked like the
        # chart's own stock probe timeouts (both readinessProbe and
        # livenessProbe default to timeoutSeconds: 1 - confirmed via `helm
        # show values argo-cd/argo-cd --version 10.3.2` - far too tight for
        # a repo-server doing real git clone/manifest-render work
        # synchronously) getting a container that's just busy, not actually
        # unhealthy, killed mid-request. Applied here (argocd-apps, this
        # cluster's OTHER instance, also chart 10.3.2) preemptively for the
        # same reason 01-argocd-platform's own install.yaml pins chart
        # version/CRDs to match this instance - keep both instances'
        # operational posture consistent rather than only hardening
        # whichever one happened to be symptomatic first.
        repoServer:
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 15
            failureThreshold: 5
#@end
        repoServer:
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 15
            failureThreshold: 5
#@if clearance.gate.enabled
          # (clearance.gate.hostAlias reaches the repo-server through global.hostAliases, below.)
          # Clearance's Config Management Plugin (G-ARGO-4; clearance docs/gate.md, "The Argo CD plugin"): the sidecar
          # that renders a protected tenant Application, hashes the tree and asks the core whether it is cleared. It
          # is its own minimal image, and the only container that mounts the clearance token (a projected
          # service-account token, audience clearance: the core sees this repo-server's account,
          # argocd-apps/argocd-apps-repo-server, as a verifier); it mounts no repository credential (the gitops repo
          # is Argo CD's to fetch). plugin.yaml is baked into the image.
          extraContainers:
            - name: clearance-cmp
              image: @@CLEARANCE_CMP_IMAGE@@
              command: [/var/run/argocd/argocd-cmp-server]
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              env:
                - {name: CLEARANCE_URL, value: "@@CLEARANCE_GATE_URL@@"}
                - {name: CLEARANCE_TOKEN_FILE, value: /var/run/secrets/tokens/clearance}
                - {name: CLEARANCE_WAIT_IMAGE, value: "@@CLEARANCE_WAIT_IMAGE@@"}
                - {name: CLEARANCE_WAIT_HOST_ALIAS, value: "@@CLEARANCE_GATE_HOST_ALIAS@@"}
                - {name: CLEARANCE_CMP_CACHE_DIR, value: /tmp/clearance-cmp-cache}
                # The repositories a chart may be fetched from: the plugin, not Argo CD, fetches it, so the AppProject's
                # sourceRepos do not apply and the plugin refuses any other chartRepo. The same repository as the cluster's
                # defaultChart and the tenant AppProjects' idpServiceCatalogRepoUrl, plus cluster.yaml allowedChartRepos
                # (which the AppProjects also allow): what Argo CD allowed an app before the gate. Comma-separated.
                - {name: CLEARANCE_CHART_REPOS, value: "@@CLEARANCE_GATE_CHART_REPOS@@"}
#@end
#@if clearance.gate.enabled and clearance.gate.caConfigMap
                # clearance.gate.caConfigMap (I-43, A-19): extra roots for an https clearance.gate.url, the cluster CA's ConfigMap
                # (trust-manager's Bundle target in argocd-apps), read once at start: a missing ConfigMap keeps the pod from starting.
                - {name: CLEARANCE_CA_FILE, value: /etc/clearance-ca/ca.crt}
#@end
#@if clearance.gate.enabled and clearance.gate.fsSandbox
                # clearance.gate.fsSandbox (A-24): the plugin's Landlock filesystem sandbox mode (try, require or off); unset, the plugin's default (try).
                - {name: CLEARANCE_CMP_FS_SANDBOX, value: "@@CLEARANCE_GATE_FS_SANDBOX@@"}
#@end
#@if clearance.gate.enabled and clearance.gate.waitCAInject
                # clearance.gate.waitCAInject (plan step 5b): the injected wait Job mounts this ConfigMap (key ca.crt) at /etc/clearance-ca,
                # which clearance-protected-writes admits only with clearance.gate.waitCAConfigMap (the same name; apron check).
                - {name: CLEARANCE_WAIT_CA_CONFIGMAP, value: "@@CLEARANCE_GATE_WAIT_CA_CONFIGMAP@@"}
#@end
#@if clearance.gate.enabled
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                # I-78: CLEARANCE_CMP_MAX_RENDERS (4) renders at once, each bounded at CLEARANCE_CMP_RENDER_MAX_MEMORY (512Mi): 2Gi,
                # plus 512Mi for the plugin processes and the cmp-server (clearance docs/examples/argo-cd-repo-server-values.yaml;
                # `clearance-cmp doctor` render-limits). Needs clearance-cmp from 0.57.1+.
                limits: {memory: 2560Mi}
              volumeMounts:
                - {name: var-files, mountPath: /var/run/argocd}
                - {name: plugins, mountPath: /home/argocd/cmp-server/plugins}
                - {name: cmp-tmp, mountPath: /tmp}
                - {name: clearance-token, mountPath: /var/run/secrets/tokens, readOnly: true}
#@end
#@if clearance.gate.enabled and clearance.gate.caConfigMap
                - {name: clearance-ca, mountPath: /etc/clearance-ca, readOnly: true}
#@end
#@if clearance.gate.enabled and clearance.gate.canary.image
            # The canary sidecar (clearance.gate.canary; clearance docs/gate.md, "Rolling out a plugin release"): the same
            # plugin from another image, registered as `clearance-canary` (the image's config-canary/plugin.yaml, which
            # sets version: canary, so the socket is plugins/clearance-canary.sock). Only the Applications listed in
            # clearance.gate.canary.apps name it. Settings and security context are the first sidecar's; its /tmp (the
            # render cache and work directory) is its own volume, so the two never share state.
            - name: clearance-cmp-canary
              image: @@CLEARANCE_CMP_CANARY_IMAGE@@
              command: [/var/run/argocd/argocd-cmp-server, --config-dir-path, /home/argocd/cmp-server/config-canary]
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              env:
                - {name: CLEARANCE_URL, value: "@@CLEARANCE_GATE_URL@@"}
                - {name: CLEARANCE_TOKEN_FILE, value: /var/run/secrets/tokens/clearance}
                - {name: CLEARANCE_WAIT_IMAGE, value: "@@CLEARANCE_WAIT_IMAGE@@"}
                - {name: CLEARANCE_WAIT_HOST_ALIAS, value: "@@CLEARANCE_GATE_HOST_ALIAS@@"}
                - {name: CLEARANCE_CMP_CACHE_DIR, value: /tmp/clearance-cmp-cache}
                - {name: CLEARANCE_CHART_REPOS, value: "@@CLEARANCE_GATE_CHART_REPOS@@"}
#@end
#@if clearance.gate.enabled and clearance.gate.canary.image and clearance.gate.caConfigMap
                - {name: CLEARANCE_CA_FILE, value: /etc/clearance-ca/ca.crt}
#@end
#@if clearance.gate.enabled and clearance.gate.canary.image and clearance.gate.fsSandbox
                - {name: CLEARANCE_CMP_FS_SANDBOX, value: "@@CLEARANCE_GATE_FS_SANDBOX@@"}
#@end
#@if clearance.gate.enabled and clearance.gate.canary.image and clearance.gate.waitCAInject
                - {name: CLEARANCE_WAIT_CA_CONFIGMAP, value: "@@CLEARANCE_GATE_WAIT_CA_CONFIGMAP@@"}
#@end
#@if clearance.gate.enabled and clearance.gate.canary.image
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                # I-78: CLEARANCE_CMP_MAX_RENDERS (4) renders at once, each bounded at CLEARANCE_CMP_RENDER_MAX_MEMORY (512Mi): 2Gi,
                # plus 512Mi for the plugin processes and the cmp-server (clearance docs/examples/argo-cd-repo-server-values.yaml;
                # `clearance-cmp doctor` render-limits). Needs clearance-cmp from 0.57.1+.
                limits: {memory: 2560Mi}
              volumeMounts:
                - {name: var-files, mountPath: /var/run/argocd}
                - {name: plugins, mountPath: /home/argocd/cmp-server/plugins}
                - {name: cmp-tmp-canary, mountPath: /tmp}
                - {name: clearance-token, mountPath: /var/run/secrets/tokens, readOnly: true}
#@end
#@if clearance.gate.enabled and clearance.gate.canary.image and clearance.gate.caConfigMap
                - {name: clearance-ca, mountPath: /etc/clearance-ca, readOnly: true}
#@end
#@if clearance.gate.enabled
          volumes:
            - {name: cmp-tmp, emptyDir: {}}
#@end
#@if clearance.gate.enabled and clearance.gate.canary.image
            - {name: cmp-tmp-canary, emptyDir: {}}
#@end
#@if clearance.gate.enabled
            - name: clearance-token
              projected:
                sources:
                  - serviceAccountToken: {audience: clearance, expirationSeconds: 3600, path: clearance}
                # I-78: not world-readable (`clearance-cmp doctor` token check). The pod's fsGroup 999 (global.securityContext below) is the
                # sidecar's (uid 999) group, so 0440 leaves the token readable by the sidecar alone.
                defaultMode: 0440
#@end
#@if clearance.gate.enabled and clearance.gate.caConfigMap
            - name: clearance-ca
              configMap:
                name: "@@CLEARANCE_GATE_CA_CONFIGMAP@@"
                items: [{key: ca.crt, path: ca.crt}]
#@end
#@if clearance.gate.enabled
        # The core on another cluster, for the sidecar (it shares the repo-server pod's hosts). The chart has no
        # repo-server-only key; the other components never use the name.
        global:
          hostAliases: @@CLEARANCE_GATE_HOST_ALIASES@@
          # I-78: the pod's fsGroup, so the token volume's group is the sidecar's (999). Chart 10.3.2 has no repo-server-only
          # key for the pod securityContext (repoServer has no podSecurityContext), so this is global: every Argo CD pod of this
          # instance gets supplementary group 999 and its volumes' group (clearance docs/examples/argo-cd-repo-server-values.yaml).
          securityContext:
            fsGroup: 999
#@end
#@if _rolloutOrder
        # I-77, the rollout order of a Clearance release (README.md, "Rollout order for Clearance releases"). A release that
        # changes the wait image changes three things that sync on their own: the policies that admit the wait Job
        # (clearance-gate's clearance-protected-writes and, with Flight admission, kyverno-policies' flight-only-images), the
        # agent (clearance-argocd-agent) and this repo-server's CLEARANCE_WAIT_IMAGE. The repo-server must go last: before the
        # policies, a new-image wait Job is refused where admission enforces; before the agent, an old agent reports it as
        # out-of-band. The root's sync waves cannot order them (the policies change inside their own Applications' sources, not
        # in any Application the root applies, and Argo CD has no Application health since 1.8), so this Application holds its
        # own sync: a PreSync hook Job that passes at once unless this sync changes the repo-server's wait image (or the
        # repo-server is not there yet), and otherwise waits until every policy admits the new image and every agent
        # Deployment runs it, rolled out and available. It fails after CLEARANCE_ROLLOUT_ORDER_TIMEOUT seconds; syncPolicy.retry
        # below tries again. Off with clearance.gate.rolloutOrder: false. Helm runs extraObjects through tpl: no double
        # opening braces anywhere below (tests/run.sh checks). I-79: the ServiceAccount, its ClusterRole and binding and the
        # ConfigMap are deleted when each sync operation ends, passed or failed (Argo CD deletes a hook only then, after
        # every hook has finished), and created again by the next sync; the Job is deleted with them when it passed. A
        # revert of the hook leaves no RBAC behind: Argo CD never prunes a live hook, and this Application does not prune.
        extraObjects:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: clearance-rollout-order
              namespace: argocd-apps
              labels: {hangar.io/component: cluster-config, hangar.io/subcomponent: clearance-rollout-order}
              annotations:
                argocd.argoproj.io/hook: PreSync
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
                argocd.argoproj.io/sync-wave: "-1"
          # Read only, and only the named objects: the repo-server and agent Deployments and the policies it checks.
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: clearance-rollout-order
              labels: {hangar.io/component: cluster-config, hangar.io/subcomponent: clearance-rollout-order}
              annotations:
                argocd.argoproj.io/hook: PreSync
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
                argocd.argoproj.io/sync-wave: "-1"
            rules:
              - apiGroups: [apps]
                resources: [deployments]
                verbs: [get]
                resourceNames: @@CLEARANCE_ROLLOUT_ORDER_DEPLOYMENTS@@
              - apiGroups: [admissionregistration.k8s.io]
                resources: [validatingadmissionpolicies]
                verbs: [get]
                resourceNames: [clearance-protected-writes]
#@end
#@if _rolloutOrderFlight
              - apiGroups: [policies.kyverno.io]
                resources: [validatingpolicies]
                verbs: [get]
                resourceNames: [flight-only-images]
#@end
#@if _rolloutOrder
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: clearance-rollout-order
              labels: {hangar.io/component: cluster-config, hangar.io/subcomponent: clearance-rollout-order}
              annotations:
                argocd.argoproj.io/hook: PreSync
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
                argocd.argoproj.io/sync-wave: "-1"
            roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: clearance-rollout-order}
            subjects:
              - {kind: ServiceAccount, name: clearance-rollout-order, namespace: argocd-apps}
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: clearance-rollout-order
              namespace: argocd-apps
              labels: {hangar.io/component: cluster-config, hangar.io/subcomponent: clearance-rollout-order}
              annotations:
                argocd.argoproj.io/hook: PreSync
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
                argocd.argoproj.io/sync-wave: "-1"
            data:
              order.py: |
                """Hold argocd-apps-install's sync until a new Clearance wait image is safe for the repo-server (apron I-77).

                CHECKS (JSON): waitImage, the image this sync gives the repo-server's clearance-cmp sidecar; repoServer and
                container, where the live one is read; policies, each {name, kind (vap or kyverno), path}; agent, null or
                {image, deployments}. Passes at once when the repo-server is not there (a first install: no old wait image
                runs) or already has waitImage (this sync does not change it). Otherwise waits until every policy's spec
                names waitImage and is loaded (a ValidatingAdmissionPolicy's observedGeneration, Kyverno's ready, then SETTLE for both),
                and every agent Deployment passes --wait-image=waitImage on the agent's image, rolled out and available. A transient
                read error (5xx, 429, a timeout, a dropped connection) is read again with backoff; nothing runs or is accepted past
                TIMEOUT_SECONDS, then it exits 1. Standard library only; reads with the pod's own token.
                """

                import http.client
                import json
                import os
                import ssl
                import sys
                import time
                import urllib.error
                import urllib.request

                SA = "/var/run/secrets/kubernetes.io/serviceaccount"
                API = "https://kubernetes.default.svc"
                # A policy counts only once this hook has seen the same object (uid) at the same generation name the image, loaded, for
                # SETTLE seconds, timed from after each read; a delete, a re-create or any later spec change restarts it. Kyverno's status
                # has no observedGeneration (conditionStatus.ready is about its webhook and RBAC, not which spec it loaded). A
                # ValidatingAdmissionPolicy's observedGeneration is set by kube-controller-manager's status controller once it has type
                # checked that generation, but each API server's admission plugin loads the policy from its own informer, so it can still
                # be on the previous spec for a moment (watch latency, under a second). SETTLE is longer than either informer takes: a
                # heuristic, not proof. A server-side dry-run create of a wait Job was not used instead (apron I-79): the gate policy
                # matches only Argo CD's application controller (its matchConditions), so a dry run as this hook is never evaluated by it,
                # and one as the controller needs `impersonate` on that service account, which is the controller's cluster-wide write
                # rights (RBAC cannot limit a create to dry runs); it would also need a protected namespace with an active grant and would
                # still reach only one API server.
                SETTLE = 30
                seen = {}
                # Set by main: the transient-error retries stop at the deadline. Without one (a direct call) nothing is retried.
                CLOCK, SLEEP, DEADLINE = time.monotonic, time.sleep, None


                def get(path, timeout=30):
                    """The object at path, or None when it does not exist."""
                    with open(f"{SA}/token") as f:
                        token = f.read().strip()
                    req = urllib.request.Request(API + path, headers={"Authorization": f"Bearer {token}"})
                    ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
                    try:
                        with urllib.request.urlopen(req, context=ctx, timeout=timeout) as r:
                            return json.load(r)
                    except urllib.error.HTTPError as e:
                        if e.code == 404:
                            return None
                        raise


                def transient(e):
                    """An error worth reading again: the API server busy or briefly away. A refusal (401, 403, 4xx) or a bad
                    certificate is not."""
                    if isinstance(e, urllib.error.HTTPError):
                        return e.code == 429 or e.code >= 500
                    if isinstance(e, urllib.error.URLError):
                        return not isinstance(e.reason, ssl.SSLCertVerificationError)
                    return isinstance(e, (TimeoutError, ConnectionError, http.client.HTTPException))


                def read(path):
                    """get, a transient error read again after 1s, doubling to 8s, while the deadline leaves room; then it raises.
                    No read starts once the deadline has passed, and none is given longer than what is left."""
                    delay = 1
                    while True:
                        left = None if DEADLINE is None else DEADLINE - CLOCK()
                        if left is not None and left <= 0:
                            raise TimeoutError(f"{path}: not read, the deadline has passed")
                        try:
                            return get(path, timeout=30 if left is None else min(30, left))
                        except Exception as e:
                            left = None if DEADLINE is None else DEADLINE - CLOCK()
                            if not transient(e) or left is None or left <= delay:
                                raise
                            print(f"{path}: {e}; reading again in {delay}s", flush=True)
                            SLEEP(delay)
                            delay = min(2 * delay, 8)


                def deployment(ref):
                    ns, name = ref.split("/", 1)
                    return read(f"/apis/apps/v1/namespaces/{ns}/deployments/{name}")


                def live_wait_image(dep, container):
                    """The sidecar's CLEARANCE_WAIT_IMAGE, "" without one, None without the sidecar."""
                    for c in dep["spec"]["template"]["spec"].get("containers") or []:
                        if c.get("name") == container:
                            for e in c.get("env") or []:
                                if e.get("name") == "CLEARANCE_WAIT_IMAGE":
                                    return e.get("value", "")
                            return ""
                    return None


                def change(cfg):
                    """Why this sync needs the order, or None when it does not."""
                    dep = deployment(cfg["repoServer"])
                    if dep is None:
                        return None
                    live = live_wait_image(dep, cfg["container"])
                    if live == cfg["waitImage"]:
                        return None
                    return f"repo-server wait image {live or '(none)'} -> {cfg['waitImage']}"


                def policy_pending(p, image, clock):
                    obj = read(p["path"])
                    now = clock()
                    if obj is None:
                        seen.pop(p["name"], None)
                        return f"{p['name']}: not found"
                    if image not in json.dumps(obj.get("spec") or {}):
                        seen.pop(p["name"], None)
                        return f"{p['name']}: does not admit {image} yet"
                    st = obj.get("status") or {}
                    if p["kind"] == "vap" and st.get("observedGeneration") != obj["metadata"].get("generation"):
                        seen.pop(p["name"], None)
                        return f"{p['name']}: generation {obj['metadata'].get('generation')} not observed yet"
                    if p["kind"] == "kyverno" and (st.get("conditionStatus") or {}).get("ready") is not True:
                        seen.pop(p["name"], None)
                        return f"{p['name']}: not ready"
                    ident = (obj["metadata"].get("uid"), obj["metadata"].get("generation"))
                    if seen.get(p["name"], (None, 0))[0] != ident:
                        seen[p["name"]] = (ident, now)
                    first = seen[p["name"]][1]
                    if now - first < SETTLE:
                        return f"{p['name']}: admits {image}; settling ({int(now - first)}s of {SETTLE}s)"
                    return None


                def agent_pending(ref, dep, image, wait):
                    if dep is None:
                        return f"{ref}: not found"
                    cs = [c for c in dep["spec"]["template"]["spec"].get("containers") or []
                          if any(a.startswith("--wait-image=") for a in c.get("args") or [])]
                    if not cs:
                        return f"{ref}: no container passes --wait-image"
                    for c in cs:
                        got = [a.split("=", 1)[1] for a in c["args"] if a.startswith("--wait-image=")]
                        if got != [wait]:
                            return f"{ref}: {c.get('name')} has --wait-image={','.join(got)}, not {wait}"
                        if image and c.get("image") != image:
                            return f"{ref}: {c.get('name')} runs {c.get('image')}, not {image}"
                    want = dep["spec"].get("replicas", 1)
                    st = dep.get("status") or {}
                    if st.get("observedGeneration", 0) < dep["metadata"].get("generation", 0):
                        return f"{ref}: generation {dep['metadata'].get('generation')} not observed yet"
                    for k in ("updatedReplicas", "availableReplicas", "replicas"):
                        if st.get(k, 0) != want:
                            return f"{ref}: {k} {st.get(k, 0)} of {want}"
                    return None


                def pending(cfg, clock):
                    """What still stands between the policies and the agent and this sync, in rollout order."""
                    out = []
                    for p in cfg.get("policies") or []:
                        out.append(policy_pending(p, cfg["waitImage"], clock))
                    agent = cfg.get("agent") or {}
                    for ref in agent.get("deployments") or []:
                        out.append(agent_pending(ref, deployment(ref), agent.get("image"), cfg["waitImage"]))
                    return [r for r in out if r]


                def main(cfg, timeout, interval=10, clock=time.monotonic, sleep=time.sleep):
                    global CLOCK, SLEEP, DEADLINE
                    deadline = clock() + timeout
                    CLOCK, SLEEP, DEADLINE = clock, sleep, deadline
                    try:
                        why = change(cfg)
                    except Exception as e:  # unreadable past its retries: fail closed, the repo-server does not roll
                        print(f"cannot read the repo-server: {e}", file=sys.stderr)
                        return 1
                    if why is None:
                        print("no wait-image change for the repo-server: nothing to order")
                        return 0
                    print(f"{why}: waiting for the policies, then the agent")
                    last = None
                    while True:
                        if clock() >= deadline:  # no poll starts once the budget is spent
                            print(f"gave up after {timeout}s: " + "; ".join(last or ["no poll finished in time"]), file=sys.stderr)
                            return 1
                        try:
                            left = pending(cfg, clock)
                        except Exception as e:  # past its retries, or not transient: one more wait, not a failed sync
                            left = [f"API error: {e}"]
                        now = clock()
                        if now > deadline:  # a result that came in late is not accepted, ready or not
                            print(f"gave up after {timeout}s: " + ("; ".join(left) or "ready only after the deadline"), file=sys.stderr)
                            return 1
                        if not left:
                            print("policies admit the new wait image and the agent runs it: the repo-server may roll")
                            return 0
                        if left != last:
                            print("waiting: " + "; ".join(left), flush=True)
                            last = left
                        if now >= deadline:
                            print(f"gave up after {timeout}s: " + "; ".join(left), file=sys.stderr)
                            return 1
                        sleep(min(interval, deadline - now))


                if __name__ == "__main__":
                    sys.exit(main(json.loads(os.environ["CHECKS"]), int(os.environ.get("TIMEOUT_SECONDS", "600"))))
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: clearance-rollout-order
              namespace: argocd-apps
              labels: {hangar.io/component: cluster-config, hangar.io/subcomponent: clearance-rollout-order}
              annotations:
                argocd.argoproj.io/hook: PreSync
                # Deleted when a sync it let through ends. One that failed is kept, with its log of what it waited for, until
                # the next sync replaces it or a day has passed (ttlSecondsAfterFinished), so a revert leaves nothing for long.
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
            spec:
              backoffLimit: 0
              ttlSecondsAfterFinished: 86400
              activeDeadlineSeconds: @@CLEARANCE_ROLLOUT_ORDER_DEADLINE@@
              template:
                metadata:
                  labels: {hangar.io/component: cluster-config, hangar.io/subcomponent: clearance-rollout-order}
                spec:
                  serviceAccountName: clearance-rollout-order
                  automountServiceAccountToken: true
                  restartPolicy: Never
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65534
                    runAsGroup: 65534
                    seccompProfile: {type: RuntimeDefault}
                  containers:
                    - name: order
                      # Multi-arch index digest (linux/amd64 + linux/arm64 among others), the agentrun-reaper's.
                      image: docker.io/library/python:3.13.18-alpine@sha256:bbc0290146ebe0a8b9a8ed07d3f2c7bdeb4d917fc93300a4e47490c8b5a11b48
                      command: ["python3", "-I", "/order/order.py"]
                      env:
                        - {name: CHECKS, value: @@CLEARANCE_ROLLOUT_ORDER_CHECKS@@}
                        - {name: TIMEOUT_SECONDS, value: "@@CLEARANCE_ROLLOUT_ORDER_TIMEOUT@@"}
                      resources:
                        requests: {cpu: 10m, memory: 32Mi}
                        limits: {memory: 64Mi}
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities: {drop: ["ALL"]}
                      volumeMounts:
                        - {name: order, mountPath: /order, readOnly: true}
                  volumes:
                    - name: order
                      configMap: {name: clearance-rollout-order}
#@end
        # One controller block for every cluster (it used to sit twice inside the
        # not-isControlPlane branch only). GOMEMLIMIT + memory limit added 2026-10-28,
        # for the reason given at GOMEMLIMIT in 01-argocd-platform/install.yaml. This
        # instance ran at a 0.95 GB heap / 1.6 GB RSS on hangar-dev (23 apps).
        controller:
          env:
            - name: GOMEMLIMIT
              value: 1500MiB
          resources:
            requests:
              cpu: 150m
              memory: 500Mi
            limits:
              memory: 2560Mi
#@if isControlPlane
        applicationSet:
          allowAnyNamespace: true
#@end
        configs:
          params:
            # Added 2026-09-02: the kiac Gateway only has an HTTP/80 listener, no TLS
            # termination in front of this Service - argocd-server's stock default
            # (TLS on, HTTP redirected to HTTPS) meant argocd-apps-ui's HTTPRoute just
            # got a 307 back to a https:// URL the Gateway can't serve. Mirrored onto
            # 01-argocd-platform/install.yaml's own argocd-cmd-params-cm too.
            server.insecure: "true"
            reposerver.repo.cache.expiration: 3m
#@if isControlPlane
            application.namespaces: "*-cicd"
            applicationsetcontroller.namespaces: "*-cicd"
            applicationsetcontroller.enable.tokenref.strict.mode: "true"
            applicationsetcontroller.allowed.scm.providers: "https://api.@@SCM_HOST@@"
#@end
            applicationsetcontroller.enable.new.git.file.globbing: "true"
#@if argocd.light
            # argocd.light: the same as 01-argocd-platform/install.yaml's argocd-cmd-params-cm (see its argocd-cm).
            reposerver.parallelism.limit: "2"
            controller.status.processors: "10"
            controller.operation.processors: "5"
            controller.repo.server.timeout.seconds: "180"
#@end
          # Same health-check customizations as 01-argocd-platform/install.yaml's own
          # argocd-cm (see that ConfigMap's inline comments for rationale/sourcing) -
          # this instance is the one that actually owns the xr-requests-generated
          # Applications wrapping each onboarded app's XRs (checkout-api-xr-requests
          # etc.), so it's the argocd-cm that needs these, not the platform instance's.
          # Two separate ArgoCD installs, two separate ConfigMaps - confirmed live
          # 2026-08-18 chasing exactly this: patching the platform instance's argocd-cm
          # left these XRs' health at None, since this instance never reads that CM.
          cm:
            # Backstage's ArgoCD plugin (idp/docs/backstage-design.md plugin #1):
            # a dedicated local account, `apiKey` capability only (no `login` -
            # can't be used to sign into the UI/CLI with a password, only to hold
            # API tokens minted for it). Bound to the built-in `role:readonly` via
            # configs.rbac below. Token itself is never in git - see
            # the former management cluster's repo/60-backstage/backstage/
            # argocd-dev-apps-token-external-secret.yaml for the one-time manual
            # mint+Infisical-plant step, same "manual by design" posture as
            # backstage-ingestor-rbac's SA token
            # (00-bootstrap/backstage-ingestor-rbac/README.md).
            accounts.backstage: apiKey
#@if argocd.light
            # argocd.light: the same as 01-argocd-platform/install.yaml's argocd-cm.
            timeout.reconciliation: 600s
            timeout.reconciliation.jitter: 120s
#@end
            # resource.exclusions is a single string value: setting it replaces the chart's
            # default list, so the default list is repeated here in full (it is identical to
            # 01-argocd-platform/install.yaml's) and the Upbound block is appended, same as
            # the platform instance. Each instance has its own argocd-cm; both need it.
            resource.exclusions: |
              ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
              - apiGroups:
                - ''
                - discovery.k8s.io
                kinds:
                - Endpoints
                - EndpointSlice
              ### Internal Kubernetes resources excluded reduce the number of watched events
              - apiGroups:
                - coordination.k8s.io
                kinds:
                - Lease
              ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
              - apiGroups:
                - authentication.k8s.io
                - authorization.k8s.io
                kinds:
                - SelfSubjectReview
                - TokenReview
                - LocalSubjectAccessReview
                - SelfSubjectAccessReview
                - SelfSubjectRulesReview
                - SubjectAccessReview
              ### Intermediate Certificate Request excluded reduce the number of watched events
              - apiGroups:
                - certificates.k8s.io
                kinds:
                - CertificateSigningRequest
              - apiGroups:
                - cert-manager.io
                kinds:
                - CertificateRequest
              ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
              - apiGroups:
                - cilium.io
                kinds:
                - CiliumIdentity
                - CiliumEndpoint
                - CiliumEndpointSlice
              ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
              - apiGroups:
                - kyverno.io
                - reports.kyverno.io
                - wgpolicyk8s.io
                kinds:
                - PolicyReport
                - ClusterPolicyReport
                - EphemeralReport
                - ClusterEphemeralReport
                - AdmissionReport
                - ClusterAdmissionReport
                - BackgroundScanReport
                - ClusterBackgroundScanReport
                - UpdateRequest
              ### Crossplane managed resources (Upbound provider MRs) excluded: the compositions create them,
              ### no manifest in git ever does, and there are ~400 kinds (each v2 provider installs both its
              ### cluster-scoped and its namespaced CRDs). Both instances were opening an informer per kind,
              ### which is what tipped @@CLUSTER_NAME@@ over on 2026-10-08 (apiserver 7.5GB, etcd lease storms).
              ### Provider configs stay tracked on purpose: ClusterProviderConfig/ProviderConfig live in the
              ### family groups (aws.m.upbound.io, azure.upbound.io, ...), which the wildcard patterns do not
              ### match, and gitops applies them. Tower reads MRs with its own identity, not through Argo CD.
              - apiGroups:
                - '*.aws.upbound.io'
                - '*.aws.m.upbound.io'
                - '*.azure.upbound.io'
                - '*.azure.m.upbound.io'
                - '*.github.upbound.io'
                - '*.github.m.upbound.io'
                kinds:
                - '*'
              - apiGroups:
                - aws.upbound.io
                - aws.m.upbound.io
                - azure.upbound.io
                - azure.m.upbound.io
                - github.upbound.io
                - github.m.upbound.io
                kinds:
                - ProviderConfigUsage
                - ResourceGroup
                - ResourceProviderRegistration
                - Subscription
            resource.customizations.health.argoproj.io_Rollout: |
              function checkReplicasStatus(obj)
                local hs = {}
                local desiredReplicas = getNumberValueOrDefault(obj.spec.replicas, 1)
                statusReplicas = getNumberValueOrDefault(obj.status.replicas, 0)
                updatedReplicas = getNumberValueOrDefault(obj.status.updatedReplicas, 0)
                local availableReplicas = getNumberValueOrDefault(obj.status.availableReplicas, 0)

                if updatedReplicas < desiredReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: More replicas need to be updated"
                  return hs
                end
                if availableReplicas < updatedReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: updated replicas are still becoming available"
                  return hs
                end
                return nil
              end

              function getStableRS(obj)
                if obj.status.stableRS ~= nil then
                  return obj.status.stableRS
                end
                if obj.status.canary ~= nil then
                    return obj.status.canary.stableRS
                end
                return ""
              end

              function getNumberValueOrDefault(field, default)
                if field ~= nil then
                  return field
                end
                return default
              end

              function checkPaused(obj)
                local hs = {}
                hs.status = "Suspended"
                hs.message = "Rollout is paused"
                if obj.status.pauseConditions ~= nil and table.getn(obj.status.pauseConditions) > 0 then
                  return hs
                end

                if obj.spec.paused ~= nil and obj.spec.paused then
                  return hs
                end
                return nil
              end

              function isGenerationObserved(obj)
                if obj.status == nil then
                  return false
                end
                observedGeneration = tonumber(obj.status.observedGeneration)
                if observedGeneration == nil or observedGeneration > obj.metadata.generation then
                  return true
                end
                return observedGeneration == obj.metadata.generation
              end

              function isWorkloadGenerationObserved(obj)
                if obj.spec.workloadRef == nil or obj.metadata.annotations == nil then
                  return true
                end
                local workloadGen = tonumber(obj.metadata.annotations["rollout.argoproj.io/workload-generation"])
                local observedWorkloadGen = tonumber(obj.status.workloadObservedGeneration)
                return workloadGen == observedWorkloadGen
              end

              local hs = {}
              if not isGenerationObserved(obj) or not isWorkloadGenerationObserved(obj) then
                hs.status = "Progressing"
                hs.message = "Waiting for rollout spec update to be observed"
                return hs
              end

              if obj.status.phase ~= nil then
                if obj.status.phase == "Paused" then
                  hs.status = "Suspended"
                else
                  hs.status = obj.status.phase
                end
                hs.message = obj.status.message
                return hs
              end

              for _, condition in ipairs(obj.status.conditions) do
                if condition.type == "InvalidSpec" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
                if condition.type == "Progressing" and condition.reason == "RolloutAborted" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
                if condition.type == "Progressing" and condition.reason == "ProgressDeadlineExceeded" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
              end

              local isPaused = checkPaused(obj)
              if isPaused ~= nil then
                return isPaused
              end

              if obj.status.currentPodHash == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for rollout to finish: status has not been reconciled."
                return hs
              end

              replicasHS = checkReplicasStatus(obj)
              if replicasHS ~= nil then
                return replicasHS
              end

              local stableRS = getStableRS(obj)

              if obj.spec.strategy.blueGreen ~= nil then
                if obj.status.blueGreen == nil or obj.status.blueGreen.activeSelector ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "active service cutover pending"
                  return hs
                end
                if stableRS ~= "" and stableRS ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "waiting for analysis to complete"
                  return hs
                end
              elseif obj.spec.strategy.canary ~= nil then
                if statusReplicas > updatedReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: old replicas are pending termination"
                  return hs
                end
                if stableRS == "" or stableRS ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "Waiting for rollout to finish steps"
                  return hs
                end
              end

              hs.status = "Healthy"
              hs.message = ""
              return hs
            # Same PVC-health override, and same rationale, as 01-argocd-platform/
            # install.yaml's own argocd-cm - see that ConfigMap's inline comment (right
            # above this same key) for the full write-up. Two separate ArgoCD installs,
            # two separate ConfigMaps (see this file's own comment above
            # accounts.backstage/resource.customizations.health.argoproj.io_Rollout for
            # why both need every override independently), so this one needs it too
            # rather than assuming the platform instance's copy is enough.
            resource.customizations.health.PersistentVolumeClaim: |
              hs = {}
              hs.status = "Healthy"
              hs.message = "Not tracking Bound status - WaitForFirstConsumer PVCs stay Pending until first real consumer schedules, which is expected, not a failure (see comment above this key in argocd-cm)."
              return hs
            # ExternalSecret health check (added 2026-09-14): without this, ArgoCD
            # treats any external-secrets.io/ExternalSecret as "Healthy" the instant
            # the object itself applies - it has no built-in awareness that ESO's own
            # reconcile into a real Secret is a separate, asynchronous step. That gap
            # deadlocked a brand-new env's PreSync outcome-hook Job on the prod cluster
            # (airframe's relay-token-external-secret.yaml, confirmed live): wave-
            # ordering alone got the ExternalSecret object created first, but the next
            # wave's Job still started before ESO had actually populated the Secret.
            # Standard ESO status.conditions[].type == "Ready" check, same
            # Synced/Ready-condition shape as catalog.hangar.io/*'s own health.lua below,
            # just a single specific Kind via the flat resource.customizations.health.
            # key form (like PersistentVolumeClaim above) rather than that block's
            # nested per-group form.
            resource.customizations.health.external-secrets.io_ExternalSecret: |
              hs = {}
              if obj.status ~= nil and obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" then
                    if condition.status == "True" then
                      hs.status = "Healthy"
                      hs.message = condition.message or condition.reason or "Ready"
                    else
                      hs.status = "Degraded"
                      hs.message = condition.message or condition.reason or "Not ready"
                    end
                    return hs
                  end
                end
              end
              hs.status = "Progressing"
              hs.message = "Waiting for ExternalSecret to sync"
              return hs
            resource.customizations: |
              catalog.hangar.io/*:
                health.lua: |
                  health_status = {}
                  if obj.status == nil or obj.status.conditions == nil then
                    health_status.status = "Progressing"
                    health_status.message = "Waiting for status.conditions to be reported"
                    return health_status
                  end
                  local synced = nil
                  local ready = nil
                  for _, condition in ipairs(obj.status.conditions) do
                    if condition.type == "Synced" then
                      synced = condition
                    elseif condition.type == "Ready" then
                      ready = condition
                    end
                  end
                  if synced ~= nil and synced.status == "False" then
                    health_status.status = "Degraded"
                    health_status.message = synced.message or synced.reason or "Not synced"
                    return health_status
                  end
                  if ready ~= nil then
                    if ready.status == "True" then
                      health_status.status = "Healthy"
                      health_status.message = ready.message or ready.reason or "Ready"
                    else
                      health_status.status = "Progressing"
                      health_status.message = ready.message or ready.reason or "Not ready"
                    end
                    return health_status
                  end
                  health_status.status = "Progressing"
                  health_status.message = "No Ready condition yet"
                  return health_status
          rbac:
            # Binds the `backstage` account above to ArgoCD's own built-in
            # read-only role - get/list on every resource in every project,
            # no write verbs. Same scope-minimization principle as every other
            # cross-cluster credential this platform delivers to Backstage
            # (idp/docs/backstage-design.md "Credentials").
            #
            # role:tower-sync (2026-09-14, HANDOFF-tower-write-actions.md
            # Tier 1) adds exactly one write action - `sync` - on top of that,
            # bound to the SAME `backstage` account rather than a second
            # identity/token: no prune, no force (those stay deferred pending
            # this platform's not-yet-built authorization model - see the
            # handoff's per-action verdict table), and Refresh needs no policy
            # line at all here since it piggybacks on the `get` action
            # role:readonly already grants (confirmed against ArgoCD's own
            # API: GET .../applications/{name}?refresh=normal triggers
            # reconciliation as a side effect of a plain read).
            #
            # role:tower-rollout (2026-10-10, glidepath ADR-0021 phase 4) adds Argo CD's built-in Rollout
            # resource actions (abort, pause, resume, promote-full, retry, restart, skip-current-step) for
            # Tower's Rollout controls. Delegated: Argo CD runs the action and checks the Rollout belongs to the
            # Application; Tower holds no Kubernetes RBAC for it. Who may run which action on which app is
            # decided in Backstage (towerPermissions.ts: owning team only; on Flight, promote-full and
            # skip-current-step are audited and announced as a bypass), which is now the authorization model
            # the notes above were waiting for.
            #
            # Narrowed 2026-10-10 (Tower authorization review follow-up): Tower's writes reach app environment
            # Applications only, never the platform projects this instance also holds - `default` (the
            # *-onboarding and *-appproject Applications) and `airframe-onboarding` (*-xr-requests). A deny wins over
            # the allow in Argo CD RBAC, so these stay out whatever the app projects are named (<app>-lower on a
            # Ground cluster, <app> on a Flight one). Terminate and Force sync use the same `sync` action, and
            # Backstage decides who may run each (towerPermissions.ts).
            #
            # role:tower-pod (2026-10-10): Tower's Restart pod deletes one pod through Argo CD (its ReplicaSet
            # replaces it). Fine-grained `delete//Pod/*` (core group, kind Pod, any name): pods only - never a
            # Deployment, Service or the Application. Backstage refuses the last ready pod on Flight, since a delete
            # skips the PodDisruptionBudget (backstage podRestart.ts).
            policy.csv: |
              p, role:tower-sync, applications, sync, */*, allow
              p, role:tower-sync, applications, sync, default/*, deny
              p, role:tower-sync, applications, sync, airframe-onboarding/*, deny
              p, role:tower-rollout, applications, action/argoproj.io/Rollout/*, */*, allow
              p, role:tower-rollout, applications, action/argoproj.io/Rollout/*, default/*, deny
              p, role:tower-rollout, applications, action/argoproj.io/Rollout/*, airframe-onboarding/*, deny
              p, role:tower-pod, applications, delete//Pod/*, */*, allow
              p, role:tower-pod, applications, delete//Pod/*, default/*, deny
              p, role:tower-pod, applications, delete//Pod/*, airframe-onboarding/*, deny
              g, backstage, role:readonly
              g, backstage, role:tower-sync
              g, backstage, role:tower-rollout
              g, backstage, role:tower-pod
        server:
          # Argo Rollouts UI extension: renders the canary/blue-green step timeline
          # inside an Application's resource tree in the web UI. v0.3.7 pinned (not
          # latest v0.4.0) because v0.4.0 externalizes react-dom for React 19, which
          # matches ArgoCD v3.5+'s UI - this instance runs chart 10.2.1 / appVersion
          # v3.4.5, still on React 18.
          extensions:
            enabled: true
            extensionList:
              - name: rollout-extension
                env:
                  - name: EXTENSION_URL
                    value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-apps
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
#@if _rolloutOrder
    # I-77: an automated sync is not retried on the same revision after it fails, so a rollout-order hook that gave up
    # (above, extraObjects) would leave the repo-server change unsynced until the next commit. Retried instead: limit 5 is
    # five retries after the first try, six tries in all, each waiting up to its timeout (10m), with 1m doubling to 10m
    # between them (25m), so up to about 85 minutes; once Argo CD reports the sync failed with its retries used up, Sync by hand.
    retry:
      limit: 5
      backoff: {duration: 1m, factor: 2, maxDuration: 10m}
#@end
