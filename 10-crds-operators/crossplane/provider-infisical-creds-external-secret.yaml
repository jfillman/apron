# provider-infisical-creds-external-secret.yaml
#
# Same posture as provider-github-creds-external-secret.yaml (this directory), applied
# to a second provider: rather than a hand-`kubectl create secret`-per-cluster-rebuild
# step, this credential is planted by hand, once, in the same shared Infisical project
# every other platform-wide credential already lives in (platform-cicd-kind-dev,
# environmentSlug: shared - see platform-cicd's docs/admin/secrets-management.md), and
# pulled automatically from there via the same platform-secret-store ClusterSecretStore
# platform-cicd-control-plane's own ExternalSecrets and provider-github-creds already
# use.
#
# Plant it by hand, once (UI or API, never committed here): key
# provider-infisical-creds, value {"host": "<your Infisical host>", "client_id":
# "<admin-scoped machine identity client ID>", "client_secret": "<...client secret>"}
# - an admin-scoped machine identity with Universal Auth enabled, the same shared
# credential this provider's ClusterProviderConfig already expects (see
# provider-infisical-config.yaml's own header). Not the same value as the current
# operator's INFISICAL_ADMIN_TOKEN (a bearer token) - this is Universal Auth
# client_id/client_secret, the non-deprecated equivalent.
#
# Single flat-value key, not multiple fields extracted via dataFrom.extract - same
# posture as provider-github-creds: the ProviderConfig wants exactly one Secret key
# ("credentials") holding the whole JSON blob.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provider-infisical-creds
  namespace: crossplane-system
  labels:
    hangar.io/component: cluster-config
    hangar.io/subcomponent: crds-operators
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: provider-infisical-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials
      remoteRef:
        key: provider-infisical-creds
