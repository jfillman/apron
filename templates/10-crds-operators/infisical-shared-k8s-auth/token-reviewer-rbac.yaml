# The SA whose long-lived token Infisical uses to call THIS cluster's TokenReview
# API - configured on every IdentityKubernetesAuth resource's tokenReviewerJwt field
# (provider-infisical, <scm-host>/<owner>/provider-infisical - see airframe's
# SecretStore Composition, compositions/secretstore/templates/
# 01-k8s-reviewer-secret-gate.yaml), and previously by every InfisicalProject
# identity's Kubernetes Auth under the now-decommissioned infisical-secretstore-
# operator (main.py's configure_kubernetes_auth(),
# INFISICAL_K8S_TOKEN_REVIEWER_JWT) - genuinely shared, cluster-wide infra, not tied
# to either mechanism's own lifecycle. Split into its own directory/Application
# 2026-09-18 specifically so decommissioning that operator's Deployment/CRDs/RBAC
# doesn't also delete this - moving these two objects (this file +
# infisical-nodeport.yaml) here first, verified live under the new Application,
# BEFORE removing anything from the old operator directory.
#
# Not the identity of anything being authenticated - system:auth-delegator only
# grants the ability to ask "is this other token valid," not to read secrets, act as
# any workload, or anything else. Deliberately its own SA, not reused from any
# consumer's own SA - different trust boundary, this one's token leaves the
# cluster's own control plane and gets handed to Infisical's backend to hold
# indefinitely.
#
# Fully declarative, unlike infisical-secrets/infisical-bootstrap-credentials
# (infisical/application.yaml's header) - this Secret needs no manually-typed
# sensitive input. The kubernetes.io/service-account-token annotation is the
# standard long-lived-token mechanism (distinct from the short-lived, auto-rotated
# TokenRequest-projected tokens every pod gets by default) - the control plane
# populates token/ca.crt/namespace asynchronously after this Secret is created, same
# as pre-1.24 auto-generated SA token Secrets worked by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-token-reviewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: infisical-token-reviewer
    namespace: infisical
---
apiVersion: v1
kind: Secret
metadata:
  name: infisical-token-reviewer-token
  annotations:
    kubernetes.io/service-account.name: infisical-token-reviewer
type: kubernetes.io/service-account-token
